version: 2

updates:
  # GitHub Actions のバージョン更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  # フロントエンド npm/pnpm パッケージ更新
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5
    ignore:
      # メジャーバージョンアップは手動対応
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # バックエンド Go モジュール更新
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - backend
    open-pull-requests-limit: 5
