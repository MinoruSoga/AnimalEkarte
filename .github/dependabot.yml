version: 2

updates:
  # GitHub Actions のバージョン更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  # フロントエンド npm/pnpm パッケージ更新
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5
    groups:
      # Radix primitives share focus/portal internals. Update and validate them as one unit.
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - minor
          - patch
    ignore:
      # 2.3.7 causes a Dialog × Select FocusScope loop under React 19/jsdom.
      # A later release may be proposed through the radix-ui group and must pass the smoke test.
      - dependency-name: "@radix-ui/react-select"
        versions: ["2.3.7"]
      # メジャーバージョンアップは手動対応
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # バックエンド Go モジュール更新
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - MinoruSoga
    labels:
      - dependencies
      - backend
    open-pull-requests-limit: 5
