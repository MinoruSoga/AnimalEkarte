# Direct STG migration runner (diagnostic + recovery).
#
# Container boot runs `/app/migrate && exec /app/api`, so a failing boot-time
# migrate crash-loops the whole container and the /_internal/migrate exec path
# becomes unreachable (needs a running container). This workflow runs the SAME
# cmd/migrate binary against STG PlanetScale directly from the runner — both to
# surface the real error in CI logs and to apply pending migrations so the
# container boot chain unblocks.
#
# Pattern mirrors stg-sql-probe-brt71.yml (STG_DB_USER/STG_DB_PASSWORD secrets,
# public ap-northeast-2 host + sslmode=require).
name: STG Migrate Direct

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to run cmd/migrate against STG'
        required: true
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate on explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "migrate" ]; then
            echo "Set confirm=migrate to run. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      # cmd/migrate hardcodes migrationsDir=/app/migrations (same location the
      # production image COPYs migrations/ into).
      - name: Stage migrations at /app/migrations
        run: |
          sudo mkdir -p /app/migrations
          sudo cp -r backend/migrations/. /app/migrations/
          sudo chmod -R a+rX /app

      - name: Run cmd/migrate against STG
        working-directory: backend
        env:
          # Non-secret topology from wrangler.jsonc vars / stg-sql-probe.
          DB_HOST: ap-northeast-2.pg.psdb.cloud
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: ${{ secrets.STG_DB_USER }}
          DB_PASSWORD: ${{ secrets.STG_DB_PASSWORD }}
          # sslmode=require is proven by stg-sql-probe-brt71; the container uses
          # verify-full + DB_SSL_ROOT_CERT which has no equivalent CA file here.
          DB_SSL_MODE: require
          # Matches wrangler.jsonc vars — gates seedlogin + seed bundle order.
          APP_ENV: staging
          DB_RESET: "false"
        run: go run ./cmd/migrate
