name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: |
          set -euo pipefail
          ENV=preview
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            ENV=production
          fi
          pnpm exec vercel pull --yes --environment="$ENV" --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # vercel build --prebuilt は Project Settings の Output Directory と噛み合わず
      # 「dist があるのに No Output Directory named dist」になる事例あり。
      # Vite で dist を確定し、静的ディレクトリをそのまま deploy する。
      - name: Build (Vite)
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm build
          test -d dist
          test -f dist/index.html

      - name: Deploy to Vercel
        working-directory: frontend
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            EXTRA+=(--prod)
          fi
          pnpm exec vercel deploy dist --yes "${EXTRA[@]}" --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
