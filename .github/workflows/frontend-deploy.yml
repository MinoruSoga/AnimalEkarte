name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Production GitHub Environment is restricted to refs/heads/production.
    # Preview is used for staging pushes and non-production workflow_dispatch.
    environment: ${{ (github.event.inputs.environment == 'production' || (github.event_name == 'push' && github.ref == 'refs/heads/production')) && 'Production' || 'Preview' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Reject production deploy from a non-production ref
        if: ${{ github.event.inputs.environment == 'production' && github.ref != 'refs/heads/production' }}
        run: |
          echo "::error::Production frontend deploy is only allowed from refs/heads/production."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pull, build, prebuilt deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
          DEMO_LOGIN_PASSWORD_SECRET: ${{ secrets.VITE_DEMO_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          ENV=preview
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/production" ]; then
            ENV=production
          elif [ "${{ github.event.inputs.environment }}" = "production" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/production" ]; then
              echo "::error::Production frontend deploy is only allowed from refs/heads/production."
              exit 1
            fi
            ENV=production
          fi

          pnpm --dir frontend exec vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"
          mkdir -p .vercel
          cp -a frontend/.vercel/project.json .vercel/project.json

          # --prebuilt は cwd 直下の .vercel/output を見る。
          # Dashboard の rootDirectory=frontend は prebuilt 時に frontend/frontend を誘発するため外す。
          node <<'NODE'
          const fs = require('fs');
          const path = '.vercel/project.json';
          const j = JSON.parse(fs.readFileSync(path, 'utf8'));
          j.projectSettings = j.projectSettings || {};
          delete j.projectSettings.rootDirectory;
          j.projectSettings.outputDirectory = 'dist';
          fs.writeFileSync(path, JSON.stringify(j, null, 2));
          console.log('projectSettings', JSON.stringify(j.projectSettings));
          NODE

          # Vite はコマンドラインの VERCEL_ENV を読む。VITE_* は loadEnv がファイルで上書きし得るので
          # 非 VITE_ の DEMO_LOGIN_PASSWORD を同じ行で渡し、vite.config が define する。
          DEMO_PW=""
          if [ "$ENV" = "preview" ]; then
            DEMO_PW="${DEMO_LOGIN_PASSWORD_SECRET:-}"
            if [ -z "$DEMO_PW" ]; then
              DEMO_PW="${STG_DEMO_PASSWORD:-}"
            fi
            if [ -z "$DEMO_PW" ]; then
              echo "::warning::preview demo password unset; login picker will not fill password"
            fi
          else
            unset STG_DEMO_PASSWORD
            unset DEMO_LOGIN_PASSWORD_SECRET
          fi
          VERCEL_ENV="$ENV" VITE_VERCEL_ENV="$ENV" DEMO_LOGIN_PASSWORD="$DEMO_PW" pnpm --dir frontend build
          test -f frontend/dist/index.html

          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -a frontend/dist/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/line-reserve/(.*)", "dest": "/line-reserve/index.html" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          test -f .vercel/output/static/index.html
          test -f .vercel/output/config.json

          EXTRA=()
          if [ "$ENV" = "production" ]; then
            EXTRA+=(--prod)
          fi
          ./frontend/node_modules/.bin/vercel deploy --prebuilt --yes "${EXTRA[@]}" --token="$VERCEL_TOKEN"
