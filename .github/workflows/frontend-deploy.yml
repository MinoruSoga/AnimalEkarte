name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: |
          set -euo pipefail
          ENV=preview
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            ENV=production
          fi
          pnpm exec vercel pull --yes --environment="$ENV" --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Dashboard の Output Directory / buildCommand と衝突しないよう、
      # Vite 成果物を Build Output API (.vercel/output) に載せ --prebuilt する。
      - name: Build and Deploy (prebuilt static)
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm build
          test -f dist/index.html

          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -a dist/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/line-reserve/(.*)", "dest": "/line-reserve/index.html" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          test -f .vercel/output/static/index.html
          test -f .vercel/output/config.json

          EXTRA=()
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            EXTRA+=(--prod)
          fi
          pnpm exec vercel deploy --prebuilt --yes "${EXTRA[@]}" --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
