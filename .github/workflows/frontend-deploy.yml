name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm exec vercel pull --yes --environment=${{ github.ref == 'refs/heads/production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
          # Dashboard の Output Directory 食い違いで dist を見失う事例への防衛
          node <<'NODE'
          const fs = require('fs');
          const path = '.vercel/project.json';
          if (!fs.existsSync(path)) {
            console.log('no .vercel/project.json');
            process.exit(0);
          }
          const j = JSON.parse(fs.readFileSync(path, 'utf8'));
          j.projectSettings = j.projectSettings || {};
          j.projectSettings.outputDirectory = 'dist';
          j.projectSettings.framework = j.projectSettings.framework || 'vite';
          if (j.projectSettings.rootDirectory === '.' || j.projectSettings.rootDirectory === '') {
            // CI は working-directory=frontend 前提。空/ルートは触らないがログに出す
            console.log('rootDirectory=', j.projectSettings.rootDirectory);
          }
          fs.writeFileSync(path, JSON.stringify(j, null, 2));
          console.log('forced outputDirectory=dist');
          NODE
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: frontend
        run: |
          set -euo pipefail
          # Project Settings の Output Directory 食い違いを避けるため、先に Vite で dist を確定させる
          pnpm build
          test -d dist
          test -f dist/index.html
          ls -la dist | head
          pnpm exec vercel build ${{ github.ref == 'refs/heads/production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: pnpm exec vercel deploy --prebuilt ${{ github.ref == 'refs/heads/production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
