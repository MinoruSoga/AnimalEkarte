name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Dashboard Root Directory = frontend 前提。
      # cwd を monorepo root に固定し、成果物は frontend/.vercel/output に置く
      # （cwd=frontend だと frontend/frontend を探して落ちる）。
      - name: Pull, build, prebuilt deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          ENV=preview
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            ENV=production
          fi

          pnpm --dir frontend exec vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"
          # link metadata を repo root にも置き、root から --prebuilt する
          mkdir -p .vercel
          cp -a frontend/.vercel/project.json .vercel/project.json
          if [ -f frontend/.vercel/README.txt ]; then cp -a frontend/.vercel/README.txt .vercel/; fi

          node <<'NODE'
          const fs = require('fs');
          for (const path of ['.vercel/project.json', 'frontend/.vercel/project.json']) {
            if (!fs.existsSync(path)) continue;
            const j = JSON.parse(fs.readFileSync(path, 'utf8'));
            j.projectSettings = j.projectSettings || {};
            j.projectSettings.rootDirectory = 'frontend';
            j.projectSettings.outputDirectory = 'dist';
            fs.writeFileSync(path, JSON.stringify(j, null, 2));
            console.log('patched', path);
          }
          NODE

          pnpm --dir frontend build
          test -f frontend/dist/index.html

          rm -rf frontend/.vercel/output
          mkdir -p frontend/.vercel/output/static
          cp -a frontend/dist/. frontend/.vercel/output/static/
          cat > frontend/.vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/line-reserve/(.*)", "dest": "/line-reserve/index.html" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          test -f frontend/.vercel/output/static/index.html

          EXTRA=()
          if [ "$ENV" = "production" ]; then
            EXTRA+=(--prod)
          fi
          # IMPORTANT: monorepo root cwd（Root Directory=frontend の二重付与を防ぐ）
          ./frontend/node_modules/.bin/vercel deploy --prebuilt --yes "${EXTRA[@]}" --token="$VERCEL_TOKEN"
