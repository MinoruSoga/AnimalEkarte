name: Frontend Deploy (Cloudflare Workers)

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (preview = ステージング相当 / production = 本番)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # Production GitHub Environment is restricted to refs/heads/production.
    # Preview is used for staging pushes and non-production workflow_dispatch.
    environment: ${{ (github.event.inputs.environment == 'production' || (github.event_name == 'push' && github.ref == 'refs/heads/production')) && 'Production' || 'Preview' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Reject production deploy from a non-production ref
        if: ${{ github.event.inputs.environment == 'production' && github.ref != 'refs/heads/production' }}
        run: |
          echo "::error::Production frontend deploy is only allowed from refs/heads/production."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      - name: Build, deploy, and smoke-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          # EMR-265: STG デモアカウント自動入力用。vite.config.ts が appEnv==="stg"
          # のときだけ import.meta.env.VITE_DEMO_LOGIN_PASSWORD に焼き込む。
          # production ビルドでは読まれず bundle に値は入らない(fail-closed)。
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          ENV=stg
          WORKER_URL="https://animalekarte-stg-frontend.baritech-soga.workers.dev"
          CONFIG="wrangler.jsonc"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/production" ]; then
            ENV=production
            WORKER_URL="https://noah-karte.com"
            CONFIG="wrangler.production.jsonc"
          elif [ "${{ github.event.inputs.environment }}" = "production" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/production" ]; then
              echo "::error::Production frontend deploy is only allowed from refs/heads/production."
              exit 1
            fi
            ENV=production
            WORKER_URL="https://noah-karte.com"
            CONFIG="wrangler.production.jsonc"
          fi

          # backend-deploy.yml と同じトークン棲み分け: production は Production
          # environment の PROD_* secret、それ以外はリポジトリの CLOUDFLARE_API_TOKEN。
          TOKEN="$CLOUDFLARE_API_TOKEN"
          if [ "$ENV" = "production" ]; then
            TOKEN="$PROD_CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${TOKEN}" ]; then
            echo "::error::Cloudflare API token for $ENV is not configured (docs/ops/infra/architecture.md)"
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"

          # APP_ENV は vite.config.ts の環境分岐の正本(__VERCEL_ENV__ へ写像)。
          # VITE_API_URL は注入しない — /api/* は Worker が service binding で
          # 同一オリジン中継する(frontend/worker/index.ts)。
          APP_ENV="$ENV" pnpm --dir frontend build
          test -f frontend/dist/index.html
          test -f frontend/dist/line-reserve/index.html
          test -f frontend/dist/liff/index.html
          test -f frontend/dist/_headers

          # pnpm exec は workspace root を CWD にするため、wrangler.jsonc を拾うには
          # frontend を working-directory にした npx が必要(backend-deploy.yml 同様)。
          cd frontend
          npx wrangler deploy -c "$CONFIG"
          cd ..

          # workers_dev(STG) / 独自ドメイン(PROD)上での配信確認。
          # DNS 切替(infra/cloudflare/zone.tf apply)前でも STG は workers.dev で検証できる。
          # server: cloudflare も併せて確認する — CSP ヘッダは旧 Vercel 配信も返すため、
          # PROD で DNS 未切替のままだと smoke が Vercel に対して誤って PASS する。
          for attempt in 1 2 3 4 5; do
            HEADERS="$(curl -fsSI "$WORKER_URL/" || true)"
            if echo "$HEADERS" | grep -qi "content-security-policy" && echo "$HEADERS" | grep -qi "^server: cloudflare"; then
              echo "smoke: CSP header + server=cloudflare at $WORKER_URL (attempt $attempt)"
              break
            fi
            echo "smoke attempt $attempt failed; retrying in 10s"
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "::error::frontend smoke check failed at $WORKER_URL"
              exit 1
            fi
          done
          curl -fsS -o /dev/null -w "spa-fallback: %{http_code}\n" "$WORKER_URL/owners"
          curl -fsS -o /dev/null -w "line-reserve: %{http_code}\n" "$WORKER_URL/line-reserve/smoke-clinic/"
