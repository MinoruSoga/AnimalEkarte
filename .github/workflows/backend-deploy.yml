# Cloudflare Workers + Containers デプロイ (docs/ops/infra/architecture.md)
# 旧 AWS ECS 版 CI は 2026-07-20 に廃止済み。履歴は git で確認する。
# jobs は2系統: deploy (STG) と、GitHub Environment `Production` でゲートされた
# deploy-production (本番。setup.md の人間前提条件が揃うまで実行不可)。

name: Backend Deploy

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先 (staging = STG / production = 本番。production は refs/heads/production からのみ)"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  # P1-2 NS 切替前の検証経路。切替後は api.stg.noah-karte.com に更新 (P7-4)
  WORKER_URL: https://animalekarte-stg-api.baritech-soga.workers.dev
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy Backend to Cloudflare
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target != 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # workflow_dispatch で任意ブランチを指定できるが、production ブランチからの
      # STG deploy は prod リリース経路と混線するため fail-closed で拒否する
      #（deploy-production 側の Environment ガードと対称）。
      - name: Guard against deploying the production branch to staging
        if: github.ref == 'refs/heads/production'
        run: |
          echo "::error::production branch cannot be deployed to the STG environment. Use the production deploy workflow instead." >&2
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured (docs/ops/infra/architecture.md)"
            exit 1
          fi
          pnpm exec wrangler whoami

      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: backend
        # pnpm exec は backend/ に package.json が無いためワークスペースルートを CWD にしてしまい、
        # wrangler.jsonc 不在の root で新規プロジェクト誤検出 → 別名 Worker(nimal-karte) へ配布される実害があった
        # (2026-07-17 発覚)。npx は node_modules を上方探索しつつ CWD=backend を維持する。
        run: npx wrangler deploy

      # PR#186 P2-3: wrangler deploy は Worker/Container を即座に切り替える(段階的ロールアウト機構なし)ため、
      # 旧ECSフロー(migrateジョブ→exit code検証→失敗ならAPI deployをabort、docs/ops/infra/_archive/migration-cloudflare.md:425が
      # 本来の意図として明記)の意図を守るには、新バージョンに対する検証系ステップより前に migration を
      # 通す必要がある。cf-run-migrate.sh の self-test(15s)/本実行(150s)タイムアウトはコンテナのコールド
      # スタート(最大 ~3s)を吸収できるため、/health ポーリングより前段に置ける。
      # 既知の残課題: wrangler deploy 完了と同時に実トラフィックは新バージョンへ切り替わる。Cloudflare の
      # 段階的デプロイ(wrangler versions upload/deploy)は Durable Object(本Workerが AnimalEkarteApiContainer
      # を DO として bind)を使うスクリプトには適用できない(Preview URL も DO bind Worker には生成されない。
      # 出典: developers.cloudflare.com/workers/versions-and-deployments/gradual-deployments/with-durable-objects/
      # および .../preview-urls/、いずれも2026-07時点)。本ワークフローでは利用不可。したがって
      # 「新バイナリが旧スキーマに対して稼働し得る」区間は deploy完了時点からこのステップの migration が
      # 完了するまで(最大 MIGRATE_TIMEOUT=150s 分)残り続け、CIの検証順序を早めても、この区間そのものを
      # YAML の変更だけでゼロにはできない(縮小したのみ)。
      #
      # USER accept-window 決定（PR#186 P2-3, 2026-07-16, Grill-me Q2=A採用）:
      # 上記の残存ウィンドウ（deploy完了 〜 migration完了、最大 MIGRATE_TIMEOUT=150s）は既知の限界として
      # USER が明示的に受容済み。migrate を health-check より前段に置くことでウィンドウを縮小する緩和策は
      # 既に実施済みで、これが現行アーキテクチャでの最終形である。真のゼロ化（migrate-before-traffic の
      # 完全達成）には、migration をコンテナイメージのデプロイから切り離し、wrangler deploy より前の
      # CI ステップとして PlanetScale へ直接実行する「decouple」方式への移行が必要（本番DB認証情報の
      # CI Secrets 化・PlanetScale側のCIランナー許可・expand-contract 運用への移行を伴うため、別途
      # USER 承認とスコープ切り出しが必要 — New Work、本コメントの更新だけでは実装しない）。
      # 「残存リスクつき PASS」ではなく「意図的に受容した既知の制約」として扱うこと。
      - name: Run database migration
        env:
          MIGRATE_RUN_SECRET: ${{ secrets.MIGRATE_RUN_SECRET }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MIGRATE_RUN_SECRET}" ]; then
            echo "::error::MIGRATE_RUN_SECRET secret is not configured (docs/ops/infra/architecture.md)"
            exit 1
          fi
          ./infra/scripts/cf-run-migrate.sh

      # 試行12: vars 変更は warm Container に即時反映されない。コールドスタート最大 ~3s + sleepAfter 10m を考慮
      - name: Wait for /health (post-migrate)
        run: |
          set -euo pipefail
          URL="${WORKER_URL}/health"
          echo "Polling ${URL} (max 12 attempts, 30s interval)..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "${URL}" || echo "000")
            echo "Attempt ${i}/12: HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS=$(jq -r '.status // empty' /tmp/health.json)
              if [ "${STATUS}" = "ok" ]; then
                echo "Health OK"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Health check failed after deploy+migrate"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Optional API smoke (CRUD)
        continue-on-error: true
        env:
          STG_DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STG_DEMO_EMAIL:-}" ] || [ -z "${STG_DEMO_PASSWORD:-}" ]; then
            echo "Skipping cf:smoke — STG_DEMO_EMAIL / STG_DEMO_PASSWORD not configured (P5-4 optional)"
            exit 0
          fi
          ./infra/scripts/cf-crud-smoke.sh

  deploy-production:
    name: Deploy Backend to Cloudflare (Production)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/production') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `Production` は frontend-deploy.yml と共有する大文字小文字厳密な GitHub Environment 名。
    # required reviewers と deployment branch (production) 制限は人間設定
    # (docs/ops/infra/production/setup.md)。Environment が未設定でも deploy 前に secret 検査で fail closed。
    environment: Production
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    env:
      # wrangler.production.jsonc の route 由来。workflow 全体の STG WORKER_URL をこの job だけ上書きする。
      WORKER_URL: https://api.noah-karte.com

    steps:
      - name: Reject production deploy from a non-production ref
        if: ${{ github.ref != 'refs/heads/production' }}
        run: |
          echo "::error::Production backend deploy is only allowed from refs/heads/production."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PROD_ の別名にすることで STG repository secrets へのフォールバックを構造的に排除する。
      # 両方を deploy 前に検査し、欠落時は何も配布せず fail closed する。
      - name: Verify production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          MIGRATE_RUN_SECRET: ${{ secrets.PROD_MIGRATE_RUN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::PROD_CLOUDFLARE_API_TOKEN must be a Production Environment secret (docs/ops/infra/production/setup.md)"
            exit 1
          fi
          if [ -z "${MIGRATE_RUN_SECRET}" ]; then
            echo "::error::PROD_MIGRATE_RUN_SECRET must be a Production Environment secret (docs/ops/infra/production/setup.md)"
            exit 1
          fi
          pnpm exec wrangler whoami

      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
        working-directory: backend
        # npx (pnpm exec ではない) は STG job と同じ理由。-c は必須: 省略すると wrangler.jsonc (STG) が使われる。
        run: |
          set -euo pipefail
          test -f wrangler.production.jsonc
          npx wrangler deploy -c wrangler.production.jsonc

      # STG job と同じ順序・同じ許容 deploy→migrate ウィンドウ (STG job の migration 前段コメント参照)。
      - name: Run database migration
        env:
          MIGRATE_RUN_SECRET: ${{ secrets.PROD_MIGRATE_RUN_SECRET }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          ./infra/scripts/cf-run-migrate.sh

      - name: Wait for /health (post-migrate)
        run: |
          set -euo pipefail
          URL="${WORKER_URL}/health"
          echo "Polling ${URL} (max 12 attempts, 30s interval)..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "${URL}" || echo "000")
            echo "Attempt ${i}/12: HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS=$(jq -r '.status // empty' /tmp/health.json)
              if [ "${STATUS}" = "ok" ]; then
                echo "Health OK"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Health check failed after deploy+migrate"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      # 本番 DB へ書き込む CRUD smoke step は意図的に置かない。STG 用デモ credential は本番では
      # 絶対に使用せず、プロビジョニング済み合成アカウントで人手実施する (setup.md §7)。
