# Cloudflare Workers + Containers デプロイ (migration-cloudflare.md Phase 5 / P5-1)
# ECS 版は backend-deploy-ecs.yml (workflow_dispatch のみ、ロールバック用)

name: Backend Deploy

on:
  push:
    branches:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # P1-2 NS 切替前の検証経路。切替後は api.stg.noah-karte.com に更新 (P7-4)
  WORKER_URL: https://animalekarte-stg-api.baritech-soga.workers.dev
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy Backend to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured (migration-cloudflare.md P5-2)"
            exit 1
          fi
          pnpm exec wrangler whoami

      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: backend
        run: pnpm exec wrangler deploy

      # 試行12: vars 変更は warm Container に即時反映されない。コールドスタート最大 ~3s + sleepAfter 10m を考慮
      - name: Wait for /health (post-deploy)
        run: |
          set -euo pipefail
          URL="${WORKER_URL}/health"
          echo "Polling ${URL} (max 12 attempts, 30s interval)..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "${URL}" || echo "000")
            echo "Attempt ${i}/12: HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS=$(jq -r '.status // empty' /tmp/health.json)
              if [ "${STATUS}" = "ok" ]; then
                echo "Health OK"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Health check failed after deploy"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Run database migration
        env:
          MIGRATE_RUN_SECRET: ${{ secrets.MIGRATE_RUN_SECRET }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MIGRATE_RUN_SECRET}" ]; then
            echo "::error::MIGRATE_RUN_SECRET secret is not configured (migration-cloudflare.md P5-2)"
            exit 1
          fi
          ./infra/scripts/cf-run-migrate.sh

      - name: Verify /health (post-migrate)
        run: |
          set -euo pipefail
          URL="${WORKER_URL}/health"
          HTTP_CODE=$(curl -sS -o /tmp/health-post.json -w '%{http_code}' --max-time 30 "${URL}")
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Post-migrate health returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          STATUS=$(jq -r '.status // empty' /tmp/health-post.json)
          if [ "${STATUS}" != "ok" ]; then
            echo "::error::Post-migrate health status was '${STATUS}'"
            exit 1
          fi
          echo "Post-migrate health OK"

      - name: Optional API smoke (CRUD)
        env:
          STG_DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STG_DEMO_EMAIL:-}" ] || [ -z "${STG_DEMO_PASSWORD:-}" ]; then
            echo "Skipping cf:smoke — STG_DEMO_EMAIL / STG_DEMO_PASSWORD not configured (P5-4 optional)"
            exit 0
          fi
          ./infra/scripts/cf-crud-smoke.sh
