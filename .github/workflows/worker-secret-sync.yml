# STG Worker への DB シークレット投入(手動専用)。
# 経緯: 2026-07-17 の PlanetScale 障害対応で pscale role reset-default を実施し
# postgres 資格情報がローテーションされた。ローカルからの wrangler secret put は
# .env.staging 読み取り制限があるため、GitHub Secrets(STG_DB_USER/STG_DB_PASSWORD)を
# 正本として CI 経由で投入する。本番(#253)でも同パターンを流用する。
name: Worker Secret Sync (STG)

on:
  workflow_dispatch:
    inputs:
      delete_ghost:
        description: "誤作成 Worker (nimal-karte) を削除する"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Put DB secrets to STG worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STG_DB_USER: ${{ secrets.STG_DB_USER }}
          STG_DB_PASSWORD: ${{ secrets.STG_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN STG_DB_USER STG_DB_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::${key} secret is not configured"
              exit 1
            fi
          done
          printf '%s' "$STG_DB_USER" | npx -y wrangler@4.107.0 secret put DB_USER --name animalekarte-stg-api
          printf '%s' "$STG_DB_PASSWORD" | npx -y wrangler@4.107.0 secret put DB_PASSWORD --name animalekarte-stg-api

      - name: Delete ghost worker (optional)
        if: ${{ github.event.inputs.delete_ghost == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # wrangler delete は対話確認が必要なため、確認プロンプトの無い REST API で削除する。
          # account_id は公開値(docs/ops/infra/_archive/migration-cloudflare.md 実施記録に記載済み)。
          curl -sf -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/776ddc3e975e8fe5773d5300522e2404/workers/scripts/nimal-karte" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | head -c 200
          echo "ghost worker deleted"
