name: actionlint

# ワークフロー YAML の構文・式・action 参照を検証する軽量セルフテスト。
# .github/workflows/ を変更する PR でのみ起動する（Go/frontend/e2e マトリクスは起動しない）。

on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Run actionlint
        shell: bash
        # バージョン固定: main からの未ピン取得はサプライチェーン・再現性リスク（bug.md M-9）。
        # 更新時は URL のタグと引数の両方を同じバージョンに揃えること。
        run: |
          bash <(curl -Ls https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint
      # actionlint は構文・式のみを検査しバージョンドリフトを検出しない（#195 回帰の教訓）。
      # 同一 action の複数バージョン混在はこのスクリプトで機械的に fail させる。
      - name: Check actions version drift
        shell: bash
        run: bash scripts/check-actions-version-drift.sh
