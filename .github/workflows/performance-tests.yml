name: Performance Tests (Load & Profiling)

on:
  schedule:
    # GitHub Actions の cron は UTC。0 3 UTC = 12:00 JST（正午）に実行。
    # ⚠️ STG は毎日 22:00-8:00 JST に自動停止する（enable_off_hours_schedule）。
    #    この cron は必ず稼働窓 8:00-22:00 JST 内に置くこと（停止窓に動かすと STG ダウンで失敗）。
    - cron: '0 3 * * *'
  # push トリガは外す（毎 push の負荷・時間を削る）。手動は workflow_dispatch。
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  load-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Load Testing (k6)

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: animal_ekarte

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create .env.local for CI
        run: |
          {
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=postgres"
            echo "DB_NAME=animal_ekarte"
            echo "JWT_SECRET=${{ secrets.CI_JWT_SECRET || 'ci-test-secret-not-for-prod-use-32chars-min' }}"
          } > .env.local

      - name: Install k6
        run: sudo apt-get install -y gnupg software-properties-common && curl https://dl.k6.io/key.gpg | sudo apt-key add - && sudo add-apt-repository "deb https://dl.k6.io/deb stable main" && sudo apt-get update && sudo apt-get install k6

      - name: Start Docker services
        run: docker compose up -d db backend

      - name: Wait for backend health
        run: |
          for i in {1..150}; do
            if curl -f http://localhost:8080/health 2>/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Attempt $i/150: waiting for backend..."
            sleep 2
          done
          exit 1

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== backend logs ==="
          docker compose logs --no-color backend | tail -100
          echo "=== db logs ==="
          docker compose logs --no-color db | tail -50

      # #109 / TASK-606: 認証は STG_DEMO_* のみ。fallback / continue-on-error 禁止。
      # secret 値は env 経由で k6 に渡すだけで、step log / summary には出さない。
      - name: Require STG_DEMO credentials
        env:
          STG_DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
        run: |
          if [ -z "${STG_DEMO_EMAIL}" ] || [ -z "${STG_DEMO_PASSWORD}" ]; then
            echo "STG_DEMO_EMAIL and STG_DEMO_PASSWORD secrets are required (no fallback)"
            exit 1
          fi
          echo "STG_DEMO credentials present (values not logged)"

      - name: Run k6 API endpoints load test
        run: |
          k6 run load-tests/k6-api-endpoints.js \
            --out json=load-tests/results-endpoints.json \
            --summary-export load-tests/results-endpoints-summary.json
        env:
          BASE_URL: http://localhost:8080
          STG_DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}

      - name: Run k6 spike test
        run: |
          k6 run load-tests/k6-spike-test.js \
            --out json=load-tests/results-spike.json \
            --summary-export load-tests/results-spike-summary.json
        env:
          BASE_URL: http://localhost:8080
          STG_DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          STG_DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}

      - name: Upload load test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-results
          path: |
            load-tests/results-endpoints.json
            load-tests/results-spike.json
            load-tests/results-endpoints-summary.json
            load-tests/results-spike-summary.json
          retention-days: 30

      # fail-closed: --summary-export の aggregate を検証。
      # パスワード・body・cookie・token 値は出力しない。
      - name: Validate k6 summary aggregates
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          function metricActivity(metric) {
            if (!metric || !metric.values) return 0;
            if (typeof metric.values.count === 'number') return metric.values.count;
            const passes = metric.values.passes;
            const fails = metric.values.fails;
            if (typeof passes === 'number' || typeof fails === 'number') {
              return (passes || 0) + (fails || 0);
            }
            return 0;
          }

          function validate(path) {
            if (!fs.existsSync(path)) {
              console.error(`missing summary export: ${path}`);
              process.exit(1);
            }
            let data;
            try {
              data = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (err) {
              console.error(`invalid JSON summary: ${path}`);
              process.exit(1);
            }
            const metrics = data.metrics || {};
            const required = ['http_reqs', 'iterations', 'checks', 'successful_logins'];
            const report = [];
            let failed = false;
            for (const name of required) {
              const activity = metricActivity(metrics[name]);
              report.push(`${name}=${activity}`);
              if (activity <= 0) {
                failed = true;
              }
            }
            console.log(`${path}: ${report.join(', ')}`);
            if (failed) {
              console.error(`fail-closed: zero or missing aggregate metrics in ${path}`);
              process.exit(1);
            }
          }

          validate('load-tests/results-endpoints-summary.json');
          validate('load-tests/results-spike-summary.json');
          console.log('k6 summary aggregates validated');
          NODE

          {
            echo "### Load Test Summary Aggregates"
            echo ""
            echo "Validated fail-closed metrics: http_reqs, iterations, checks, successful_logins (counts only; secrets not logged)."
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Frontend Lighthouse Audit

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: animal_ekarte

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies (lighthouse + chrome-launcher)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Create .env.local for CI
        run: |
          {
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=postgres"
            echo "DB_NAME=animal_ekarte"
            echo "JWT_SECRET=${{ secrets.CI_JWT_SECRET || 'ci-test-secret-not-for-prod-use-32chars-min' }}"
          } > .env.local

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:3003 2>/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Attempt $i/60: waiting for frontend..."
            sleep 5
          done
          exit 1

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== backend logs ==="
          docker compose logs --no-color backend | tail -100
          echo "=== db logs ==="
          docker compose logs --no-color db | tail -50

      - name: Run Lighthouse audit
        run: |
          node frontend/scripts/lighthouse-audit.js --url http://localhost:3003
        continue-on-error: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: frontend/audit-results/
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 📊 Performance Test Results\n\n';

            // Lighthouse results
            const auditDir = 'frontend/audit-results';
            if (fs.existsSync(auditDir)) {
              const files = fs.readdirSync(auditDir);
              if (files.length > 0) {
                const latestFile = files[files.length - 1];
                const data = JSON.parse(fs.readFileSync(path.join(auditDir, latestFile), 'utf8'));

                comment += '### Lighthouse Audit\n';
                for (const [name, category] of Object.entries(data.categories)) {
                  const score = category.score;
                  const icon = score >= 90 ? '🟢' : score >= 50 ? '🟡' : '🔴';
                  comment += `- ${icon} ${category.title}: ${score}/100\n`;
                }
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  summary:
    needs: [load-test, lighthouse]
    runs-on: ubuntu-latest
    if: always()
    name: Performance Test Summary

    steps:
      - name: Generate summary
        run: |
          {
            echo "## Performance Test Run Complete"
            echo ""
            echo "- Load Testing: ${{ needs.load-test.result }}"
            echo "- Lighthouse Audit: ${{ needs.lighthouse.result }}"
            echo ""
            echo "Results available in Artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker services
        if: always()
        run: docker compose down -v 2>/dev/null || true
