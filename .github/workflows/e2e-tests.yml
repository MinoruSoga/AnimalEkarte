name: E2E Tests

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: animal_ekarte
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frontend)
        run: cd frontend && pnpm install

      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install --with-deps

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install Go dependencies
        run: cd backend && go mod download

      - name: Build frontend
        run: cd frontend && pnpm run build

      - name: Start Docker services (PostgreSQL + Vite + Go)
        run: |
          docker compose up -d db
          echo "Waiting for database to be ready..."
          docker compose exec -T db pg_isready -U postgres -d animal_ekarte || sleep 10
          docker compose up -d backend frontend
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Verify backend health
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:8080/health 2>/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Attempt $i/60: waiting for backend..."
            sleep 2
          done
          echo "Backend did not become ready after 120s"
          docker compose logs backend
          exit 1

      - name: Run database migrations
        run: |
          sleep 5
          docker compose exec -T db psql -U postgres -d animal_ekarte << 'EOF'
          \i /docker-entrypoint-initdb.d/001_init.sql
          \i /docker-entrypoint-initdb.d/002_seed_master.sql
          \i /docker-entrypoint-initdb.d/003_seed_demo.sql
          \i /docker-entrypoint-initdb.d/004_seed_staging.sql
          EOF

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000 2>/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Attempt $i/30: waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not become ready"
          exit 1

      - name: Run E2E tests
        run: cd frontend && pnpm run test:e2e
        env:
          TEST_EMAIL: admin@example.com
          TEST_PASSWORD: password
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'frontend/playwright-report/index.html';

            if (fs.existsSync(reportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ E2E tests completed. [View report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              });
            }

      - name: Stop Docker services
        if: always()
        run: docker compose down -v
