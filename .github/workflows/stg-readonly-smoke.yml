name: STG Read-Only Smoke Test (Phase 2)

on:
  workflow_dispatch:

jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Health Check
        run: |
          set -euo pipefail
          echo "=== 1. Health Check ==="
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" https://api.stg.noah-karte.com/health)"
          
          echo "Health Check HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: Health endpoint returned HTTP ${http_code}; expected 200"
            cat "$body_file"
            exit 1
          fi

          status="$(jq -r '.status // empty' "$body_file")"
          if [ "$status" != "ok" ]; then
            echo "Error: Health endpoint status was '${status}'; expected 'ok'"
            exit 1
          fi
          echo "Health endpoint is OK."

      - name: Login
        env:
          DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== 2. Login ==="
          
          if [ -z "${DEMO_EMAIL}" ] || [ -z "${DEMO_PASSWORD}" ]; then
            echo "Error: STG_DEMO_EMAIL or STG_DEMO_PASSWORD is not set in secrets."
            exit 1
          fi

          body_file="$(mktemp)"
          # cookie-jarはcookie.txtとして現在のディレクトリに保存
          http_code="$(curl -sS -c cookie.txt -o "$body_file" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${DEMO_EMAIL}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            https://api.stg.noah-karte.com/api/v1/login)"

          echo "Login HTTP Status: ${http_code}"

          if [ "$http_code" != "200" ]; then
            echo "Error: Login failed with HTTP ${http_code}"
            # 安全のため、レスポンスボディの全量出力は行わない
            exit 1
          fi

          # is_system_admin を検証
          is_admin="$(jq -r '.is_system_admin // .data.is_system_admin // empty' "$body_file")"
          if [ "$is_admin" != "true" ]; then
            echo "Error: Account is not system admin (is_system_admin=${is_admin})"
            exit 1
          fi

          echo "Login successful. Cookie saved."

      - name: Read-only API Verification
        run: |
          set -euo pipefail
          echo "=== 3. Read-only API Verification ==="

          if [ ! -f cookie.txt ]; then
            echo "Error: cookie.txt not found. Login step must have failed."
            exit 1
          fi

          API_V1="https://api.stg.noah-karte.com/api/v1"

          # 1. GET /api/v1/clinics?scope=all
          echo "--- Testing GET /api/v1/clinics?scope=all ---"
          body_file="$(mktemp)"
          http_code="$(curl -sS -b cookie.txt -o "$body_file" -w "%{http_code}" "${API_V1}/clinics?scope=all")"
          echo "HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: GET clinics failed with HTTP ${http_code}"
            exit 1
          fi
          # JSONパース可能か検証し、件数を出力
          count=$(jq '. | length' "$body_file" 2>/dev/null || jq '.data | length' "$body_file" 2>/dev/null || echo "invalid")
          if [ "$count" = "invalid" ]; then
            echo "Error: Clinics response is not valid JSON"
            exit 1
          fi
          echo "Clinics count: ${count}"

          # 2. GET /api/v1/masters/permission-groups
          echo "--- Testing GET /api/v1/masters/permission-groups ---"
          body_file="$(mktemp)"
          http_code="$(curl -sS -b cookie.txt -o "$body_file" -w "%{http_code}" "${API_V1}/masters/permission-groups")"
          echo "HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: GET permission-groups failed with HTTP ${http_code}"
            exit 1
          fi
          # JSONパース可能か検証し、件数を出力
          count=$(jq '. | length' "$body_file" 2>/dev/null || jq '.data | length' "$body_file" 2>/dev/null || echo "invalid")
          if [ "$count" = "invalid" ]; then
            echo "Error: Permission groups response is not valid JSON"
            exit 1
          fi
          echo "Permission groups count: ${count}"

          # 3. GET /api/v1/masters/staffs
          echo "--- Testing GET /api/v1/masters/staffs ---"
          body_file="$(mktemp)"
          http_code="$(curl -sS -b cookie.txt -o "$body_file" -w "%{http_code}" "${API_V1}/masters/staffs")"
          echo "HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: GET staffs failed with HTTP ${http_code}"
            exit 1
          fi
          # JSONパース可能か検証し、件数を出力
          count=$(jq '. | length' "$body_file" 2>/dev/null || jq '.data | length' "$body_file" 2>/dev/null || echo "invalid")
          if [ "$count" = "invalid" ]; then
            echo "Error: Staffs response is not valid JSON"
            exit 1
          fi
          echo "Staffs count: ${count}"

          echo "All Read-only API verification tests passed successfully."
