name: STG Smoke Test

# STG の疎通確認（/health）。手動トリガー。
#
# Cloudflare 移行 (Phase 5): 既定は workers.dev 経路。P1-2 NS 切替後は
# workflow_dispatch の api_base 入力または repository variable STG_API_BASE で上書き可能。
#
# 注: login / readonly / CRUD の smoke は STG_DEMO_EMAIL / STG_DEMO_PASSWORD secret が
#     未設定で約1年間 login 段階から機能していなかったため、2026-06 にデッドコードとして撤去した。
#     CRUD の正しさは backend の unit/integration テスト + FE の route-guard テストでカバー済み。
#     Cloudflare 経路の CRUD smoke は backend-deploy.yml の optional step または `pnpm cf:smoke` を使用。
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API origin (no trailing slash). Default: Cloudflare workers.dev"
        required: false
        default: "https://animalekarte-stg-api.baritech-soga.workers.dev"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: ${{ inputs.api_base }}
    steps:
      - name: Health Check
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" "${API_BASE}/health")"
          echo "Health HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: Health endpoint returned HTTP ${http_code}; expected 200"
            cat "$body_file"
            exit 1
          fi
          status="$(jq -r '.status // empty' "$body_file")"
          if [ "$status" != "ok" ]; then
            echo "Error: Health status was '${status}'; expected 'ok'"
            exit 1
          fi
          echo "Health endpoint OK."
