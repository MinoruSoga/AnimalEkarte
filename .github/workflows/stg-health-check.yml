name: STG Health Check (Phase 1)

on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check STG health endpoint
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" https://api.stg.noah-karte.com/health)"

          echo "HTTP Status: ${http_code}"
          echo "Response Body:"
          cat "$body_file"

          if [ "$http_code" != "200" ]; then
            echo "Health endpoint returned HTTP ${http_code}; expected 200"
            exit 1
          fi

          status="$(jq -r '.status // empty' "$body_file")"
          if [ "$status" != "ok" ]; then
            echo "Health endpoint status was '${status}'; expected 'ok'"
            exit 1
          fi

          echo "STG health check passed"
