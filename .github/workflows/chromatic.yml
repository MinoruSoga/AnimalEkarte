name: Chromatic (Visual Regression)

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  chromatic:
    name: Publish Storybook and run visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # トークンの有無だけをこの step の環境で見る。後続の pnpm install には渡さない。
      - name: Record whether the Chromatic token is configured
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice when token is not configured
        if: steps.token.outputs.configured != 'true'
        run: |
          echo "::notice::CHROMATIC_PROJECT_TOKEN is not set — skipping Chromatic. \
          Create a project at chromatic.com and add the token as a repository secret."

      - name: Checkout
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # TurboSnap (onlyChanged) が変更検出に履歴を必要とする
          persist-credentials: false

      - name: Setup pnpm
        if: steps.token.outputs.configured == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        if: steps.token.outputs.configured == 'true'
        uses: chromaui/action@6b3c2820222d23bad770d57a4ad5e2d1c91f92e9 # v18.9.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
