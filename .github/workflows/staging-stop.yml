name: Staging Stop

# STG の ECS サービス停止 (desiredCount=0) と RDS 停止を手動で実行する。
# backend-deploy.yml の delayed-stop ジョブも同等の処理を実行する。
#
# 使用場面:
#   - 即時手動停止が必要な場合
#   - デプロイ外で夜間停止を早める場合
#
# 注意: このワークフローは常にステージングリソースのみを対象とする。

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Stop reason (for audit log)"
        required: false
        default: "manual"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: animalekarte-stg-cluster
  ECS_SERVICE: animalekarte-stg-service
  RDS_INSTANCE: animalekarte-stg-db

jobs:
  stop:
    name: Stop staging ECS and RDS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::698109622668:role/animalekarte-stg-github-ecs-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop ECS service (desiredCount=0)
        run: |
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Setting ECS service desiredCount to 0..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0 \
            --region ${{ env.AWS_REGION }} \
            --query 'service.desiredCount' \
            --output text
          echo "ECS desiredCount set to 0."

      - name: Stop RDS instance
        run: |
          DB_ID="${{ env.RDS_INSTANCE }}"
          REGION="${{ env.AWS_REGION }}"

          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text \
            --region "$REGION")

          echo "RDS status: $DB_STATUS"

          if [ "$DB_STATUS" = "available" ]; then
            aws rds stop-db-instance \
              --db-instance-identifier "$DB_ID" \
              --region "$REGION" > /dev/null
            echo "RDS stop issued."
          else
            echo "::notice::RDS is in state '$DB_STATUS'; skip stop."
          fi
