name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  # JST 統一 (37d6e333): 本番/ローカルは Dockerfile・compose の TZ で time.Local=JST になるが、
  # CI ランナーは UTC のため go test の time.Local 依存テストが日付境界でズレる。全 job に JST を適用する。
  TZ: Asia/Tokyo

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: どのジョブを実行すべきか判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            codegen:
              - 'backend/internal/model/**'
              - 'backend/tygo.yaml'
              - 'frontend/src/types/generated/**'
            migrations:
              - 'backend/migrations/*.sql'

  # ──────────────────────────────────────────────
  # Reset wait-set contract: make reset の `up --wait` が
  # 長寿命サービス (db migrate backend frontend) だけを待ち、
  # one-shot codegen を含めないことを静的に検証する。
  # Docker 不要・純テキスト検査なので無条件かつ最速で走らせ、
  # cosmetic exit-1 を起こす wait-set 退行を merge 前に reject する。
  # ──────────────────────────────────────────────
  reset-contract:
    name: Reset Wait-Set Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Verify make reset wait-set contract
        run: bash scripts/check-reset-wait-services.sh

      - name: Self-test the contract check
        run: bash scripts/check-reset-wait-services.test.sh

  # ──────────────────────────────────────────────
  # ShellCheck: scripts/*.sh の静的検査ゲート。
  # シェルスクリプトの退行を手動レビューではなく自動で弾く。
  # ubuntu-latest には shellcheck がプリインストールされているため
  # ゲートは PATH 上の shellcheck をそのまま使う（Docker fallback は不要）。
  # 整形・行継続トリックでは欺けない AST 検査で無条件に実行する。
  # ──────────────────────────────────────────────
  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Lint scripts/*.sh (severity=warning)
        run: bash scripts/shellcheck-scripts.sh

      - name: Self-test the shellcheck gate
        run: bash scripts/shellcheck-scripts.test.sh

  # ──────────────────────────────────────────────
  # P3.1 Preload clinic-scope lint: clinic-scoped マスタの Preload に clinic_id 述語が
  # 無いものを go/ast で検出する read-IDOR (b3638d5e) 再発防止ゲート（DB 不要・純静的検査）。
  # backend job は PR→main でスキップされる (daily work 想定) ため、セキュリティゲートは
  # 全イベント無条件で走る独立 job にして pre-merge で必ずブロックする。
  # ./... の backend Test step でも走るが、それは push/PR→staging のみ。
  # ──────────────────────────────────────────────
  preload-clinic-scope-lint:
    name: P3.1 Preload Clinic-Scope Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run P3.1 Preload clinic-scope lint
        working-directory: backend
        run: go test ./internal/repository/ -run TestPreloadClinicScope -count=1

  # ──────────────────────────────────────────────
  # P3.1 Master-FK write inventory gate: go/ast exhaustiveness check that every service
  # method receiving a request-derived clinic-scoped master FK via a DTO is on a reviewed
  # allowlist (write-side analogue of preload-clinic-scope-lint; the #124 slip-through
  # prevention). REVIEW COVERAGE only — correctness is enforced by runtime isolation tests.
  # DB 不要・純静的検査。backend job は PR→main でスキップされるため、独立 job で全イベント
  # 無条件に走らせ pre-merge で必ずブロックする。
  # ──────────────────────────────────────────────
  master-fk-write-inventory:
    name: P3.1 Master-FK Write Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run P3.1 master-FK write inventory gate
        working-directory: backend
        run: go test ./internal/service/ -run TestMasterFKWriteInventory -count=1

  # ──────────────────────────────────────────────
  # Clinical-result audit-tx inventory gate: 患者臨床結果（exam_results/checkup_field_results）の
  # hard-delete/replace サイトを go/ast で列挙し、監査ステータス付き allowlist と突合する。
  # 未移行サイト（exam_results pending-migration）の CI 可視化と再発防止ゲート（#211 follow-up）。
  # DB 不要・純静的検査。backend job は PR→main でスキップされるため、独立 job で全イベント
  # 無条件に走らせ pre-merge で必ずブロックする。
  # ──────────────────────────────────────────────
  clinical-result-audit-tx-inventory:
    name: Clinical-Result Audit-Tx Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run clinical-result audit-tx inventory gate
        working-directory: backend
        run: go test ./internal/repository/ -run TestClinicalResultAuditTxInventory -count=1

  # ──────────────────────────────────────────────
  # Migration CASCADE inventory gate: backend/migrations/*.sql の "ON DELETE CASCADE" 出現数を
  # ファイル単位でピンし、未レビューの新規 CASCADE 混入を検出する（BE-refactor.md R3-1・D9 P0）。
  # migrations/CLAUDE.md の「CASCADE DELETE 禁止」原則を、新規 migration に対して機械強制する
  # （既存の 001_init.sql/010 の正当な CASCADE は allowlist でピン留め済み）。
  # DB 不要・純静的検査。backend job は PR→main でスキップされるため、独立 job で全イベント
  # 無条件に走らせ pre-merge で必ずブロックする。
  # ──────────────────────────────────────────────
  migration-cascade-inventory:
    name: Migration CASCADE Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run migration CASCADE inventory gate
        working-directory: backend
        run: go test ./internal/repository/ -run TestMigrationCascadeInventory -count=1

  # ──────────────────────────────────────────────
  # OpenAPI date-format drift gate: docs/api.yaml の `format: date`（日付のみ）宣言と handler の
  # response 構造体の time.Time/*time.Time フィールド（datetime wire）の乖離を検出する
  # （BE-refactor.md R3-3・D9 P1）。既存 drift 22 箇所は allowlist で固定し、新規 drift・出現数変化・
  # stale エントリで fail する。独立 package(internal/apicontract)が openapi + handler ソースを
  # os.ReadFile+go/ast で読むため handler/service test package の compile 状態に依存しない。
  # DB 不要・純静的検査。backend job は PR→main でスキップされるため独立 job で全イベント無条件。
  # ──────────────────────────────────────────────
  openapi-date-format-drift:
    name: OpenAPI Date-Format Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run OpenAPI date-format drift gate
        working-directory: backend
        run: go test ./internal/apicontract/ -run TestOpenAPIDateFormatDrift -count=1

  # ──────────────────────────────────────────────
  # dbOrTx inventory gate: ambient transaction に参加する（dbOrTx を使う）repository メソッド集合を
  # 固定し、(1) 固定メソッドが dbOrTx をやめる=tx参加 regression（R1-1/R1-2 の部分コミット/TOCTOU 修正の
  # 退行）、(2) 未登録の新規 dbOrTx メソッド追加（atomicity/isolation テスト添付のレビュー強制）を検出する。
  # 「WithTx 内で呼ばれるのに dbOrTx 未使用」の検出は taint 解析が必要で go/ast 単体では不可のため対象外
  # （各 tx フローの atomicity テストが正本ガード）。DB 不要・純静的検査・全イベント無条件。
  # ──────────────────────────────────────────────
  dbortx-inventory:
    name: dbOrTx Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run dbOrTx inventory gate
        working-directory: backend
        run: go test ./internal/repository/ -run TestDBOrTxInventory -count=1

  # ──────────────────────────────────────────────
  # Backend: build + lint + schema check
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Verify seed invariants
        if: needs.changes.outputs.migrations == 'true'
        run: python3 scripts/verify_seed.py

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: backend

      - name: Test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        # 非ゲートのカバレッジ可視化: -coverprofile で測定するが、しきい値で fail させない。
        # -race は covermode=atomic を要求するため明示する。テストの合否は従来どおり。
        # -coverpkg=./internal/... で internal/* のみを計測対象とし、cmd/,
        # lstep-migrate/, seed-old-db/, stage-import/, migrations/ 等のエントリポイント・
        # インフラパッケージを除外する。除外ポリシー/ロードマップ: docs/coverage-policy.md
        # -timeout 900s: internal/repository は _test.go ファイル急増（33→130、b69932eb）で
        # 旧 120s はもとより 450s でも実CI(run 28650708439)で test timed out。旧CI基準
        # (33ファイル/69.9s, run e9687c98) からの単純比例なら130ファイルで約276sの想定に対し、
        # 実CIは450sでも未完走（アルファベット順で TestReservationTypeGroupRepository_ 付近まで
        # 進行）——非線形の速度劣化を示唆。ローカル -race 実測245.867s完走との乖離も大きいため、
        # 憶測を重ねず十分な余裕(実測450s未達の2倍)を確保する。恒久対策は setupTestDB の
        # セットアップコスト削減/パッケージ分割が別途必要（PR #186 timeout調査参照）。
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./internal/... -timeout 900s

      - name: Coverage summary (non-gating, baseline visibility)
        if: always()
        # 可視化専用ステップ。集計失敗が CI を落とさないよう非致命にする。
        continue-on-error: true
        working-directory: backend
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tee coverage-summary.txt
            go tool cover -html=coverage.out -o coverage.html
            {
              echo "### Backend coverage (non-gating, baseline visibility)"
              echo '```'
              tail -n 1 coverage-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage.out not produced (tests failed before profiling completed); skipping summary."
          fi

      # BE-refactor.md R3-5 / bug.md H-7 / coverage-policy.md Phase 1: カバレッジ ratchet。
      # .coverage-baseline は 2026-07-03 の CI 実測（run 28655388836 / commit 80e0648a）で 89.9% に
      # arm 済み。baseline > 0 のため evaluateRatchet が tolerance（既定 0.5pp）を超える低下を検出すると
      # 非0 exit する。continue-on-error を外し -warn-only も外しているため、低下時はこのステップ自体が
      # 失敗し Backend Test job 全体を fail させる（Phase 1 の非ゲート運用から fail ゲートへ昇格）。
      # coverage-summary.txt が無い場合（テスト自体が失敗しプロファイリング未完了）はスキップする —
      # その場合は先行の Test ステップの失敗がジョブを落とす。
      - name: Coverage ratchet
        if: always()
        working-directory: backend
        run: |
          if [ -f coverage-summary.txt ]; then
            go run ./cmd/coverage-ratchet -baseline .coverage-baseline -func-file coverage-summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage-summary.txt not produced; skipping ratchet."
          fi

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage-summary.txt
            backend/coverage.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Schema drift check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        run: go test ./internal/model/ -run TestSchemaDrift -v

  # ──────────────────────────────────────────────
  # Frontend: build + lint
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level moderate

      - name: Type check
        working-directory: frontend
        run: pnpm run type-check

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Build
        working-directory: frontend
        run: pnpm run build

      # 非ゲートのカバレッジ可視化: vite.config.ts には coverage.thresholds 未設定のため、
      # --coverage はレポート生成のみで低カバレッジによる fail は起きない。テストの合否は従来どおり。
      - name: Test (with coverage)
        working-directory: frontend
        run: pnpm run test:coverage

      # FE-refactor.md R-F5 / coverage-policy.md Phase 1: カバレッジ ratchet（backend cmd/coverage-ratchet と対）。
      # .coverage-baseline が未記録（0）の間は warn のみで exit 0。実測値は本 PR merge 後の CI run の
      # frontend-coverage artifact から取得し、別コミットで .coverage-baseline に転記する。
      # Lint/Build は本ステップより前に実行済みのため、ratchet が fail してもマスクされない
      # （backend job の Build→Lint→Test→ratchet と同じ順序。feedback_ci_step_order_masks_lint 対策）。
      - name: Coverage ratchet
        working-directory: frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-ratchet.mjs --summary coverage/coverage-summary.json --baseline .coverage-baseline | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage/coverage-summary.json not produced; skipping ratchet."
          fi

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────
  # Codegen: Go model → TypeScript 型の同期チェック
  # ──────────────────────────────────────────────
  codegen-check:
    name: Codegen Sync
    needs: changes
    if: needs.changes.outputs.codegen == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tygo
        working-directory: backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tygo-output"
          sed 's|/output/models.ts|'"$GITHUB_WORKSPACE"'/tygo-output/models.ts|' tygo.yaml > tygo-ci.yaml
          go run github.com/gzuidhof/tygo@latest generate --config tygo-ci.yaml
          cp "$GITHUB_WORKSPACE/tygo-output/models.ts" ../frontend/src/types/generated/models.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code frontend/src/types/generated/; then
            echo "::error::models.ts is out of sync with Go models. Run 'make codegen' and commit the result."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # PR to main: lightweight migration guard
  # ──────────────────────────────────────────────
  migration-verify:
    name: Migration Verify
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Verify seed invariants
        run: python3 scripts/verify_seed.py
