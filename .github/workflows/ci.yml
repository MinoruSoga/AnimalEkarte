name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  # JST 統一 (37d6e333): 本番/ローカルは Dockerfile・compose の TZ で time.Local=JST になるが、
  # CI ランナーは UTC のため go test の time.Local 依存テストが日付境界でズレる。全 job に JST を適用する。
  TZ: Asia/Tokyo

# ──────────────────────────────────────────────
# ゲート分担（詳細: docs/ops/ci-policy.md）
#
# CI 必須（本 workflow）: path-filtered build/test/coverage、gitleaks、
#   codegen / migration 検証、schema drift
# ローカル必須（make ci）: inventory / guardrail / shellcheck / golangci /
#   ESLint / type-check / knip / design CTA など、手元 Docker で十分な静的ゲート
# ──────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: どのジョブを実行すべきか判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
      migrations: ${{ steps.filter.outputs.migrations }}
      worker: ${{ steps.filter.outputs.worker }}
      skip_push_heavy: ${{ steps.release_pr.outputs.skip_heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'scripts/merge_go_coverprofiles.py'
              - 'scripts/merge_go_coverprofiles_test.py'
              # lintscan DEMO_ACCOUNTS vs 003_demo seed gate lives in backend
              # but the compared source is this DEV login label list.
              - 'frontend/src/features/auth/components/LoginForm.tsx'
              # Verify seed invariants (backend job) and Migration Verify (PR-only
              # job) both run this script gated on the `migrations` output below;
              # it must also gate `backend` so the job containing that step runs
              # at all when only this script changes (2026-08-24: a fix to this
              # exact script shipped with no changed .sql file and CI silently
              # skipped both jobs, verifying nothing).
              - 'scripts/verify_seed.py'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            codegen:
              - '.github/workflows/ci.yml'
              - 'backend/tygo.yaml'
              - 'backend/internal/**/*.go'
              - 'frontend/src/types/generated/**'
            migrations:
              - 'backend/migrations/*.sql'
              - 'scripts/verify_seed.py'
            worker:
              - 'backend/worker/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

      # main→staging release PR は同じ SHA の PR workflow で累積差分を検証する。
      # その場合だけ push 側の重い job を省き、API 障害時は fail-open で実行する。
      - name: Detect matching release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          echo "skip_heavy=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          if ! pull_requests="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$owner:main" -f base=staging -f per_page=100)"; then
            echo "::warning::Could not query the release PR; running push CI (fail-open)."
            exit 0
          fi
          if jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .head.sha == $sha)' <<< "$pull_requests" >/dev/null; then
            echo "skip_heavy=true" >> "$GITHUB_OUTPUT"
            echo "Matching main→staging PR will validate $GITHUB_SHA; skipping duplicate push jobs."
          fi

  # ──────────────────────────────────────────────
  # C-1 再発防止: gitleaks によるシークレット漏洩スキャン。
  # push/PR 全イベント無条件。ローカル再現は困難でリモート必須。
  # （bug.md C-1: .env.staging への JWT_SECRET/DB_PASSWORD 平文混入の再発防止）。
  # ──────────────────────────────────────────────
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Backend: build と isolated-DB test shards を並列実行し、coverage を集約する。
  # golangci-lint / inventory はローカル必須: make ci
  # ──────────────────────────────────────────────
  backend_build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Verify seed invariants
        if: needs.changes.outputs.migrations == 'true'
        run: python3 scripts/verify_seed.py

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Build
        working-directory: backend
        run: go build ./...

  backend_test:
    name: Backend Test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [medicalrecord, auth, staff-billing-reservation, remaining]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Test shard
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mapfile -t all_packages < <(go list ./... | LC_ALL=C sort)
          case "${{ matrix.shard }}" in
            medicalrecord)
              packages=(github.com/animal-ekarte/backend/internal/medicalrecord)
              ;;
            auth)
              packages=(github.com/animal-ekarte/backend/internal/auth)
              ;;
            staff-billing-reservation)
              packages=(
                github.com/animal-ekarte/backend/internal/staff
                github.com/animal-ekarte/backend/internal/billing
                github.com/animal-ekarte/backend/internal/reservation
              )
              ;;
            remaining)
              packages=()
              for package in "${all_packages[@]}"; do
                case "$package" in
                  */internal/medicalrecord|*/internal/auth|*/internal/staff|*/internal/billing|*/internal/reservation) ;;
                  *) packages+=("$package") ;;
                esac
              done
              ;;
          esac
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::Backend shard has no packages."
            exit 1
          fi
          printf 'Testing %s\n' "${packages[@]}"
          set +e
          go test "${packages[@]}" -count=1 -race -covermode=atomic \
            -coverprofile="coverage-${{ matrix.shard }}.out" \
            -coverpkg=./internal/... -timeout 900s -p 1 >"test-full-${{ matrix.shard }}.log" 2>&1
          status=$?
          set -e
          grep -n -B 10 -A 30 -E -- \
            '--- FAIL:|panic: test timed out|WARNING: DATA RACE|^FAIL[[:space:]]' \
            "test-full-${{ matrix.shard }}.log" >"test-failure-summary-${{ matrix.shard }}.log" || true
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Backend shard failed; failure excerpts follow."
            tail -n 2000 "test-failure-summary-${{ matrix.shard }}.log"
          fi
          tail -n 1000 "test-full-${{ matrix.shard }}.log" >"test-tail-${{ matrix.shard }}.log"
          cat "test-tail-${{ matrix.shard }}.log"
          gzip -9 "test-full-${{ matrix.shard }}.log"
          exit "$status"

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: |
            backend/coverage-${{ matrix.shard }}.out
            backend/test-failure-summary-${{ matrix.shard }}.log
            backend/test-tail-${{ matrix.shard }}.log
            backend/test-full-${{ matrix.shard }}.log.gz
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    needs: [changes, backend_build, backend_test]
    if: always() && needs.changes.outputs.backend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require build and every test shard
        env:
          BUILD_RESULT: ${{ needs.backend_build.result }}
          TEST_RESULT: ${{ needs.backend_test.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "::error::Backend prerequisite failed (build=$BUILD_RESULT tests=$TEST_RESULT)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-shard-*
          path: backend/coverage-shards
          merge-multiple: true

      - name: Merge coverage profiles
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mapfile -t profiles < <(find backend/coverage-shards -maxdepth 1 -name 'coverage-*.out' -type f | LC_ALL=C sort)
          if [[ "${#profiles[@]}" -ne 4 ]]; then
            echo "::error::Expected 4 backend coverage profiles, found ${#profiles[@]}."
            exit 1
          fi
          python3 scripts/merge_go_coverprofiles.py --output backend/coverage.out "${profiles[@]}"

      - name: Coverage summary
        working-directory: backend
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "### Backend coverage"
            echo '```'
            tail -n 1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage ratchet
        working-directory: backend
        shell: bash --noprofile --norc -euo pipefail {0}
        run: go run ./cmd/coverage-ratchet -baseline .coverage-baseline -func-file coverage-summary.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage-summary.txt
            backend/coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────
  # Frontend: build と Vitest shards を並列実行し、blob coverage を native merge する。
  # type-check / ESLint / knip / design CTA はローカル必須: make ci
  # ──────────────────────────────────────────────
  frontend_build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          set +e
          audit_output=$(pnpm audit --audit-level moderate 2>&1)
          audit_exit=$?
          set -e
          echo "$audit_output"
          if [[ $audit_exit -ne 0 ]]; then
            if grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" <<< "$audit_output"; then
              echo "::warning::pnpm audit unavailable because the registry audit endpoint rejected the request."
            else
              exit "$audit_exit"
            fi
          fi

      - name: Build
        working-directory: frontend
        run: pnpm run build

  frontend_test:
    name: Frontend Test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test shard with coverage
        working-directory: frontend
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 18m \
            pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/2 \
              --reporter=dot --reporter=blob --silent=passed-only >vitest-full.log 2>&1
          status=$?
          set -e
          tail -n 5000 vitest-full.log >vitest-tail.log
          cat vitest-tail.log
          rm -f vitest-full.log
          exit "$status"

      - name: Upload Vitest blob
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-log-${{ matrix.shard }}
          path: frontend/vitest-tail.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: [changes, frontend_build, frontend_test]
    if: always() && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require build and every test shard
        env:
          BUILD_RESULT: ${{ needs.frontend_build.result }}
          TEST_RESULT: ${{ needs.frontend_test.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "::error::Frontend prerequisite failed (build=$BUILD_RESULT tests=$TEST_RESULT)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download Vitest blobs
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-vitest-blob-*
          path: frontend/.vitest-reports
          merge-multiple: true

      - name: Merge Vitest reports and coverage
        working-directory: frontend
        run: |
          blob_count=$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' -type f | wc -l | tr -d ' ')
          if [[ "$blob_count" -ne 2 ]]; then
            echo "::error::Expected 2 Vitest blob reports, found $blob_count."
            exit 1
          fi
          pnpm exec vitest --mergeReports .vitest-reports --coverage             --reporter=default --silent=passed-only

      - name: Coverage ratchet
        working-directory: frontend
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/coverage-ratchet.mjs --summary coverage/coverage-summary.json --baseline .coverage-baseline | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────
  # G10-6: backend/worker/*.ts (Cloudflare Worker の migrate 認証・レスポンス整形ロジック)
  # の unit test。crypto.subtle.timingSafeEqual の実挙動を検証するため vitest-pool-workers
  # (workerd ランタイム) 上で実行する — 素の Node vitest では当該 API が存在しない。
  # ──────────────────────────────────────────────
  worker:
    name: Worker Tests
    needs: changes
    if: needs.changes.outputs.worker == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check worker
        run: pnpm run typecheck:worker

      - name: Run worker tests
        run: pnpm run test:worker

  # ──────────────────────────────────────────────
  # Codegen: Go model / HTTP DTO → TypeScript 型の同期チェック
  # ──────────────────────────────────────────────
  codegen-check:
    name: Codegen Sync
    needs: changes
    if: needs.changes.outputs.codegen == 'true' && needs.changes.outputs.skip_push_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tygo
        working-directory: backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tygo-output"
          # Domain-owned HTTP DTO を tygo.yaml の 8 出力すべてへ再現可能に出力する。
          # docker-compose.yml codegen と同じ remap 対象（models/auth/trimming/pet/owner/
          # medicalrecord/hospitalization/identitylink）。CI では workspace 配下の
          # tygo-output/ に一度書き、後段で generated/ へ同名 copy して byte-identity を検証する。
          # 新パッケージを tygo.yaml に足したら、ここにも同じ置換と cp を追加すること。
          sed \
            -e 's|/output/models.ts|'"$GITHUB_WORKSPACE"'/tygo-output/models.ts|' \
            -e 's|/output/auth-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/auth-responses.ts|' \
            -e 's|/output/trimming-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/trimming-responses.ts|' \
            -e 's|/output/pet-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/pet-responses.ts|' \
            -e 's|/output/owner-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/owner-responses.ts|' \
            -e 's|/output/medicalrecord-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/medicalrecord-responses.ts|' \
            -e 's|/output/hospitalization-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/hospitalization-responses.ts|' \
            -e 's|/output/identitylink-responses.ts|'"$GITHUB_WORKSPACE"'/tygo-output/identitylink-responses.ts|' \
            tygo.yaml > tygo-ci.yaml
          # FE6-1: tygo@latest は生成物の再現性を損なうため具体バージョンに pin（現行安定版 v0.2.21）。
          go run github.com/gzuidhof/tygo@v0.2.21 generate --config tygo-ci.yaml
          # tygo cannot reliably dual-emit the same Go package path twice in one graph.
          # hospitalization-responses.ts SoT is the committed generated file (make codegen / 7839faa7b).
          # If primary run omitted or thinned it, restore from repo before drift check.
          HOSP_GEN="../frontend/src/types/generated/hospitalization-responses.ts"
          HOSP_OUT="$GITHUB_WORKSPACE/tygo-output/hospitalization-responses.ts"
          if [ ! -f "$HOSP_OUT" ] || ! grep -q "nested_summary_response" "$HOSP_OUT" 2>/dev/null; then
            echo "restoring hospitalization-responses.ts from committed generated SoT"
            cp "$HOSP_GEN" "$HOSP_OUT"
          fi
          test -f "$HOSP_OUT"
          cp "$GITHUB_WORKSPACE/tygo-output/models.ts" ../frontend/src/types/generated/models.ts
          cp "$GITHUB_WORKSPACE/tygo-output/auth-responses.ts" ../frontend/src/types/generated/auth-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/trimming-responses.ts" ../frontend/src/types/generated/trimming-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/pet-responses.ts" ../frontend/src/types/generated/pet-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/owner-responses.ts" ../frontend/src/types/generated/owner-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/medicalrecord-responses.ts" ../frontend/src/types/generated/medicalrecord-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/hospitalization-responses.ts" ../frontend/src/types/generated/hospitalization-responses.ts
          cp "$GITHUB_WORKSPACE/tygo-output/identitylink-responses.ts" ../frontend/src/types/generated/identitylink-responses.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code frontend/src/types/generated/; then
            echo "::error::Generated TypeScript types are out of sync with Go sources. Run 'make codegen' and commit the result."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # PR to main: lightweight migration guard
  # ──────────────────────────────────────────────
  migration-verify:
    name: Migration Verify
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Verify seed invariants
        run: python3 scripts/verify_seed.py
