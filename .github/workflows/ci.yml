name: CI

on:
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# ──────────────────────────────────────────────
# ゲート分担（詳細: docs/ops/ci-policy.md）
#
# 本 workflow は最小構成。build / test / coverage / lint / migration /
# worker / codegen 検証はすべてローカル必須の `make ci`
# （scripts/run-local-ci.sh）へ集約した。
# 残すのは GitHub 上でしか担保できない2ゲートのみ:
#   - workflow 定義自身の契約検査（自己参照のため remote 必須）
#   - gitleaks（PR 差分スキャン。C-1 再発防止の fail ゲート）
# ──────────────────────────────────────────────

jobs:
  workflow-contracts:
    name: Workflow Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify workflow contracts
        run: node --test scripts/check-workflow-contracts.test.mjs

  # ──────────────────────────────────────────────
  # C-1 再発防止: gitleaks によるシークレット漏洩スキャン。
  # PR 全イベント無条件。ローカル側も run-local-ci.sh が full-history スキャンを
  # 実行するが、GitHub 側の fail ゲートとしても維持する
  # （bug.md C-1: .env.staging への JWT_SECRET/DB_PASSWORD 平文混入の再発防止）。
  # ──────────────────────────────────────────────
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
