name: CI

on:
  pull_request:
    branches: [staging, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: どのジョブを実行すべきか判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            codegen:
              - 'backend/internal/model/**'
              - 'backend/tygo.yaml'
              - 'frontend/src/types/generated/**'

  # ──────────────────────────────────────────────
  # Backend: build + lint + schema check
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -f "$f"
          done

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        run: go test ./... -count=1 -race -timeout 120s

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend

      - name: Schema drift check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        run: go test ./internal/model/ -run TestSchemaDrift -v

  # ──────────────────────────────────────────────
  # Frontend: build + lint
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  # ──────────────────────────────────────────────
  # Codegen: Go model → TypeScript 型の同期チェック
  # ──────────────────────────────────────────────
  codegen-check:
    name: Codegen Sync
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tygo
        working-directory: backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tygo-output"
          sed 's|/output/models.ts|'"$GITHUB_WORKSPACE"'/tygo-output/models.ts|' tygo.yaml > tygo-ci.yaml
          go run github.com/gzuidhof/tygo@latest generate --config tygo-ci.yaml
          cp "$GITHUB_WORKSPACE/tygo-output/models.ts" ../frontend/src/types/generated/models.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code frontend/src/types/generated/; then
            echo "::error::models.ts is out of sync with Go models. Run 'make codegen' and commit the result."
            exit 1
          fi
