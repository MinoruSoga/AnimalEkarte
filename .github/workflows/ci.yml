name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  # JST 統一 (37d6e333): 本番/ローカルは Dockerfile・compose の TZ で time.Local=JST になるが、
  # CI ランナーは UTC のため go test の time.Local 依存テストが日付境界でズレる。全 job に JST を適用する。
  TZ: Asia/Tokyo

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: どのジョブを実行すべきか判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            codegen:
              - 'backend/internal/model/**'
              - 'backend/tygo.yaml'
              - 'frontend/src/types/generated/**'
            migrations:
              - 'backend/migrations/*.sql'

  # ──────────────────────────────────────────────
  # Backend: build + lint + schema check
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Verify seed invariants
        if: needs.changes.outputs.migrations == 'true'
        run: python3 scripts/verify_seed.py

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: backend

      - name: Test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        run: go test ./... -count=1 -race -timeout 120s

      - name: Schema drift check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: ekarte_user
          DB_PASSWORD: ekarte_password
          DB_NAME: ekarte_db
          DB_SSL_MODE: disable
        run: go test ./internal/model/ -run TestSchemaDrift -v

  # ──────────────────────────────────────────────
  # Frontend: build + lint
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level moderate

      - name: Type check
        working-directory: frontend
        run: pnpm run type-check

      - name: Test
        working-directory: frontend
        run: pnpm run test:run

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Build
        working-directory: frontend
        run: pnpm run build

  # ──────────────────────────────────────────────
  # Codegen: Go model → TypeScript 型の同期チェック
  # ──────────────────────────────────────────────
  codegen-check:
    name: Codegen Sync
    needs: changes
    if: needs.changes.outputs.codegen == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tygo
        working-directory: backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tygo-output"
          sed 's|/output/models.ts|'"$GITHUB_WORKSPACE"'/tygo-output/models.ts|' tygo.yaml > tygo-ci.yaml
          go run github.com/gzuidhof/tygo@latest generate --config tygo-ci.yaml
          cp "$GITHUB_WORKSPACE/tygo-output/models.ts" ../frontend/src/types/generated/models.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code frontend/src/types/generated/; then
            echo "::error::models.ts is out of sync with Go models. Run 'make codegen' and commit the result."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # PR to main: lightweight migration guard
  # ──────────────────────────────────────────────
  migration-verify:
    name: Migration Verify
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
          POSTGRES_USER: ekarte_user
          POSTGRES_PASSWORD: ekarte_password
          POSTGRES_DB: ekarte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ekarte_user -d ekarte_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ekarte_user
          PGPASSWORD: ekarte_password
          PGDATABASE: ekarte_db
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f ..."
            psql -v ON_ERROR_STOP=1 -1 -f "$f"
          done

      - name: Verify seed invariants
        run: python3 scripts/verify_seed.py
