# DEPRECATED (migration-cloudflare.md P5-1 / Phase 5):
# STG CI の通常デプロイ先は Cloudflare (backend-deploy.yml)。
# 本ワークフローは Phase 7〜8 の ECS ロールバック専用。workflow_dispatch のみ。

name: Backend Deploy (ECS rollback)

on:
  workflow_dispatch:
    inputs:
      db_reset:
        description: "DB_RESET: true で DB を DROP & 再作成（001_init.sql 変更時に使用）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "698109622668"
  ECR_REPOSITORY: animalekarte-api
  ECS_CLUSTER: animalekarte-stg-cluster
  ECS_SERVICE: animalekarte-stg-service
  ECS_TASK_DEFINITION_FAMILY: animalekarte-stg-api
  ECS_MIGRATE_TASK_FAMILY: animalekarte-stg-migrate
  ECS_SUBNETS: subnet-02442ec427303161f,subnet-0e2c5fa539a4048ca
  ECS_SECURITY_GROUPS: sg-0aa38e88ba0e4876c
  # H-5: SSM Parameter Store（SecureString）に切り出すシークレットキー名。
  # ここに列挙されたキーは .env.staging に残っていても environment（平文）へは展開せず、
  # 代わりに containerDefinitions[*].secrets の valueFrom で SSM から解決する。
  # パラメータ名は infra/CLAUDE.md の既存命名（/animalekarte/stg/...）に合わせる。
  # 実際の SSM 登録・IAM 権限付与はユーザー実施（docs/infra/deploy/ の H-5 runbook 参照）。
  SSM_SECRET_PARAM_MAP: |
    DB_PASSWORD=/animalekarte/stg/db/password
    JWT_SECRET=/animalekarte/stg/jwt_secret
    INTEGRATION_ENCRYPTION_KEY=/animalekarte/stg/integration_encryption_key

jobs:
  deploy:
    name: Deploy Backend to ECS (rollback only)
    runs-on: ubuntu-latest
    outputs:
      outside_stg_hours: ${{ steps.time-check.outputs.outside_stg_hours }}

    steps:
      # -------------------------------------------------------
      # Time-window detection: JST 08:00–22:00 の外かどうかを判定する。
      # 時間外デプロイの場合、完了後 30 分で ECS/RDS を自動停止する。
      # -------------------------------------------------------
      - name: Detect JST time window
        id: time-check
        run: |
          JST_HOUR=$(TZ=Asia/Tokyo date +%-H)
          echo "Current JST hour: $JST_HOUR"
          if [ "$JST_HOUR" -lt 8 ] || [ "$JST_HOUR" -ge 22 ]; then
            echo "outside_stg_hours=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy outside 08:00-22:00 JST (hour=${JST_HOUR}). Staging resources will be auto-stopped 30 min after completion."
          else
            echo "outside_stg_hours=false" >> "$GITHUB_OUTPUT"
            echo "Deploy within business hours (hour=${JST_HOUR}). No auto-stop scheduled."
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: arn:aws:iam::698109622668:role/animalekarte-stg-github-ecs-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      # -------------------------------------------------------
      # Preflight: RDS 停止状態の検出と起動
      # stopped の場合は start-db-instance を発行し Docker build と並行して起動する。
      # 接続不可状態 (stopping/rebooting 等) は即時 fail で明確なエラーを出す。
      # -------------------------------------------------------
      - name: Preflight — check and start RDS if stopped
        id: rds-preflight
        run: |
          DB_ID="animalekarte-stg-db"
          REGION="${{ env.AWS_REGION }}"

          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text \
            --region "$REGION")

          echo "RDS $DB_ID status: $DB_STATUS"

          if [ "$DB_STATUS" = "available" ]; then
            echo "rds_was_stopped=false" >> "$GITHUB_OUTPUT"
          elif [ "$DB_STATUS" = "stopped" ]; then
            echo "::notice::RDS is stopped. Initiating start (will proceed with Docker build while RDS starts)..."
            aws rds start-db-instance \
              --db-instance-identifier "$DB_ID" \
              --region "$REGION" > /dev/null
            echo "rds_was_stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::RDS is in unexpected state: $DB_STATUS — manual intervention required before deploying."
            exit 1
          fi

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f backend/Dockerfile.production \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push \
            ./backend
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # .env.staging → ECS environment(平文) / secrets(SSM valueFrom) JSON に分離変換
      # H-5: SSM_SECRET_PARAM_MAP に列挙したキーは environment に平文展開せず、
      # secrets 配列の valueFrom で SSM Parameter Store（SecureString）から解決する。
      # -------------------------------------------------------
      - name: Parse .env.staging into environment / secrets
        env:
          SSM_SECRET_PARAM_MAP: ${{ env.SSM_SECRET_PARAM_MAP }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          python3 -c "
          import json, os

          secret_map = {}
          for line in os.environ['SSM_SECRET_PARAM_MAP'].strip().splitlines():
              line = line.strip()
              if not line:
                  continue
              key, _, param = line.partition('=')
              secret_map[key] = param

          account_id = os.environ['AWS_ACCOUNT_ID']
          region = os.environ['AWS_REGION']

          env_pairs = []
          with open('.env.staging') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  key, _, value = line.partition('=')
                  if not key:
                      continue
                  if key in secret_map:
                      # 平文の値は environment/secrets どちらにも書き出さない（H-5: SSM 移行後は
                      # .env.staging からこの行自体を削除する。移行期間中の後方互換のためスキップのみ）。
                      continue
                  env_pairs.append({'name': key, 'value': value})

          secret_pairs = []

          # secret_map に列挙された全キーを valueFrom で secrets に追加する（.env.staging に
          # 該当行が既に無い場合でも SSM 側にさえ登録されていれば解決できるようにするため）。
          for key, param in secret_map.items():
              secret_pairs.append({
                  'name': key,
                  'valueFrom': f'arn:aws:ssm:{region}:{account_id}:parameter{param}',
              })

          with open('/tmp/env_vars.json', 'w') as f:
              json.dump(env_pairs, f)
          with open('/tmp/secrets.json', 'w') as f:
              json.dump(secret_pairs, f)
          "

      # -------------------------------------------------------
      # API タスク定義: 非シークレット env は environment、シークレットは
      # secrets（SSM valueFrom）に分離して反映する（H-5）。
      # -------------------------------------------------------
      - name: Download and prepare API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} > task-definition-raw.json

          jq --argjson envvars "$(cat /tmp/env_vars.json)" --argjson secrets "$(cat /tmp/secrets.json)" \
            'del(.taskDefinitionArn,.revision,.status,.registeredAt,.registeredBy,.compatibilities,.requiresAttributes) |
             .containerDefinitions[0].environment = $envvars |
             .containerDefinitions[0].secrets = $secrets' \
            task-definition-raw.json > task-definition.json

      - name: Fill in new image ID in API task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.build-image.outputs.image }}

      # -------------------------------------------------------
      # Run database migration before deploying new API version
      # -------------------------------------------------------
      - name: Download and prepare migrate task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_MIGRATE_TASK_FAMILY }} \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} > migrate-task-definition-raw.json

          # workflow_dispatch で db_reset が明示指定された場合のみ上書き。
          # push トリガーでは .env.staging の DB_RESET 値をそのまま使用する。
          DB_RESET_INPUT="${{ github.event.inputs.db_reset }}"

          python3 -c "
          import json, sys
          vars = json.load(open('/tmp/env_vars.json'))
          override = '$DB_RESET_INPUT'
          if override:
              for v in vars:
                  if v['name'] == 'DB_RESET':
                      v['value'] = override
          print(json.dumps(vars))
          " > /tmp/migrate_env_vars.json

          jq --argjson envvars "$(cat /tmp/migrate_env_vars.json)" --argjson secrets "$(cat /tmp/secrets.json)" \
            'del(.taskDefinitionArn,.revision,.status,.registeredAt,.registeredBy,.compatibilities,.requiresAttributes) |
             .containerDefinitions[0].environment = $envvars |
             .containerDefinitions[0].secrets = $secrets' \
            migrate-task-definition-raw.json > migrate-task-definition.json

      - name: Fill in new image ID in migrate task definition
        id: migrate-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition: migrate-task-definition.json
          container-name: migrate
          image: ${{ steps.build-image.outputs.image }}

      - name: Register migrate task definition
        id: register-migrate-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.migrate-task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "::error::Failed to register migrate task definition"
            exit 1
          fi

          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $TASK_DEF_ARN"

      # -------------------------------------------------------
      # Preflight: RDS が起動中だった場合は migration 前に available を確認する
      # -------------------------------------------------------
      - name: Preflight — wait for RDS to become available
        if: steps.rds-preflight.outputs.rds_was_stopped == 'true'
        run: |
          echo "RDS was stopped; waiting for it to become available (up to 10 minutes)..."
          aws rds wait db-instance-available \
            --db-instance-identifier animalekarte-stg-db \
            --region ${{ env.AWS_REGION }}
          echo "RDS is now available."

      - name: Run database migration
        id: run-migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ steps.register-migrate-task.outputs.task_definition_arn }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ env.ECS_SUBNETS }}],securityGroups=[${{ env.ECS_SECURITY_GROUPS }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to start migration task"
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migration task started: $TASK_ARN"

      - name: Wait for migration to complete
        timeout-minutes: 15
        run: |
          echo "Waiting for migration task to finish..."

          CLUSTER="${{ env.ECS_CLUSTER }}"
          TASK_ARN="${{ steps.run-migration.outputs.task_arn }}"
          REGION="${{ env.AWS_REGION }}"
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')

          for i in $(seq 1 60); do
            STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text \
              --region "$REGION")

            echo "[$i/60] Task status: $STATUS"

            if [ "$STATUS" = "STOPPED" ]; then
              break
            fi

            sleep 10
          done

          if [ "$STATUS" != "STOPPED" ]; then
            echo "::error::Migration timed out (status: $STATUS)"
            exit 1
          fi

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text \
            --region "$REGION")

          if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "None" ] || [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed (exit code: $EXIT_CODE)"

            echo "--- Migration logs ---"
            aws logs get-log-events \
              --log-group-name /ecs/animalekarte-stg \
              --log-stream-name "migrate/migrate/$TASK_ID" \
              --region "$REGION" \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "Could not fetch logs"
            exit 1
          fi

          echo "Migration completed successfully (exit code: $EXIT_CODE)"

      # -------------------------------------------------------
      # Preflight: ECS service が desiredCount=0 の場合は 1 に戻してから deploy する。
      # desiredCount=0 のまま deploy-task-definition を実行すると、task definition は
      # 更新されるが稼働タスクがゼロのまま "stable" と判定され API が 503 になる。
      # -------------------------------------------------------
      - name: Preflight — ensure ECS service has at least one desired task
        run: |
          CLUSTER="${{ env.ECS_CLUSTER }}"
          SERVICE="${{ env.ECS_SERVICE }}"
          REGION="${{ env.AWS_REGION }}"

          DESIRED=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].desiredCount' \
            --output text \
            --region "$REGION")

          echo "ECS service desiredCount: $DESIRED"

          if [ "$DESIRED" = "0" ]; then
            echo "::notice::ECS service desiredCount is 0. Setting to 1 before deploy..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --desired-count 1 \
              --region "$REGION" \
              --query 'service.desiredCount' \
              --output text
            echo "desiredCount updated to 1."
          else
            echo "ECS service desiredCount is $DESIRED. No action needed."
          fi

      # -------------------------------------------------------
      # Deploy new API version
      # -------------------------------------------------------
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."

          RUNNING=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].runningCount' \
            --output text \
            --region ${{ env.AWS_REGION }})

          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount}' \
            --output table \
            --region ${{ env.AWS_REGION }}

          if [ "$RUNNING" = "0" ]; then
            echo "::error::Deployment completed but no tasks are running (runningCount=0). Check ECS service events."
            exit 1
          fi

          echo "Deployment completed successfully. Running tasks: $RUNNING"

  # -------------------------------------------------------
  # 時間外デプロイ後の自動停止ジョブ
  # deploy ジョブの成功・失敗にかかわらず実行される (always())。
  # キャンセル時は outside_stg_hours output が伝播しないため実行されない。
  #
  # トレードオフ: GitHub Actions ランナーを 30 分占有するが、
  # EventBridge Scheduler 方式は scheduler:CreateSchedule +
  # iam:PassRole(scheduler-role) の追加権限が必要で複雑になるため
  # sleep ベースを採用した。ステージング限定でコストへの影響は軽微。
  # -------------------------------------------------------
  delayed-stop:
    name: Auto-stop staging resources (outside hours)
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.outputs.outside_stg_hours == 'true'
    timeout-minutes: 45

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: arn:aws:iam::698109622668:role/animalekarte-stg-github-ecs-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait 30 minutes before stopping
        run: |
          echo "Deploy result: ${{ needs.deploy.result }}"
          echo "Waiting 30 minutes before stopping staging resources..."
          sleep 1800

      - name: Stop ECS service (desiredCount=0)
        run: |
          echo "Setting ECS service desiredCount to 0..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0 \
            --region ${{ env.AWS_REGION }} \
            --query 'service.desiredCount' \
            --output text
          echo "ECS desiredCount set to 0."

      - name: Stop RDS instance
        run: |
          DB_ID="animalekarte-stg-db"
          REGION="${{ env.AWS_REGION }}"

          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text \
            --region "$REGION")

          echo "RDS status: $DB_STATUS"

          if [ "$DB_STATUS" = "available" ]; then
            aws rds stop-db-instance \
              --db-instance-identifier "$DB_ID" \
              --region "$REGION" > /dev/null
            echo "RDS stop issued."
          else
            echo "::notice::RDS is in state '$DB_STATUS'; skip stop (may already be stopped or transitioning)."
          fi
