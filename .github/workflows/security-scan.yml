name: Security Scan

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Minimum severity to fail/report."
        type: choice
        options:
          - doc
          - low
          - medium
          - high
          - critical
        required: false
        default: medium

permissions:
  contents: read

jobs:
  agentshield:
    name: AgentShield
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run AgentShield
        # Pinned from refs/tags/v1 to avoid mutable third-party action tags.
        # continue-on-error: v1.4.0 crashes with ERR_MODULE_NOT_FOUND for 'yaml' (upstream bug).
        continue-on-error: true
        uses: affaan-m/agentshield@9bbc007cf5afb562c324bbad4ce6c544420f49f6
        with:
          path: "."
          min-severity: "${{ github.event.inputs.min_severity || 'medium' }}"
          fail-on-findings: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
