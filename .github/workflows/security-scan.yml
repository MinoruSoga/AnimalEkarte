name: Security Scan

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Minimum severity to fail/report."
        type: choice
        options:
          - doc
          - low
          - medium
          - high
          - critical
        required: false
        default: medium
      force_fail_on_findings:
        description: "Force fail-on-findings even when agent-config paths did not change."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # AgentShield scans Claude/Codex agent configs. Baseline debt (score ~40) already
  # exists on main; push-to-main does not fail. Root cause of docs/product PRs being
  # blocked: fail-on-findings was true for ALL main PRs regardless of changed paths.
  # Fail on main/staging PRs when agent-config surfaces change (or manual force).
  changes:
    name: Detect agent-config changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent_config: ${{ steps.filter.outputs.agent_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            agent_config:
              - '.claude/**'
              - '.codex/**'
              - '.agents/**'
              - 'CLAUDE.md'
              - '**/AGENTS.md'
              - '**/.mcp.json'
              # Note: do NOT include security-scan.yml here — the PR that fixes
              # the fail gate must touch this workflow; including it creates a
              # chicken-and-egg block. Workflow edits are reviewed in the PR diff.

  agentshield:
    name: AgentShield
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve fail-on-findings
        id: gate
        run: |
          set -euo pipefail
          # Default: report-only. Fail for main/staging PRs that touch agent configs,
          # or when workflow_dispatch forces it.
          FAIL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_fail_on_findings }}" == "true" ]]; then
            FAIL=true
          elif [[ "${{ github.event_name }}" == "pull_request" && ( "${{ github.base_ref }}" == "main" || "${{ github.base_ref }}" == "staging" ) && "${{ needs.changes.outputs.agent_config }}" == "true" ]]; then
            FAIL=true
          fi
          echo "fail_on_findings=${FAIL}" >> "$GITHUB_OUTPUT"
          echo "agent_config_changed=${{ needs.changes.outputs.agent_config }}" >> "$GITHUB_OUTPUT"
          echo "Resolved fail_on_findings=${FAIL} (agent_config_changed=${{ needs.changes.outputs.agent_config }})"

      # Execute only the reviewed scanner commit, never code from the PR checkout.
      - name: Checkout trusted AgentShield
        uses: actions/checkout@v7.0.1
        with:
          repository: MinoruSoga/AnimalEkarte
          ref: 50922e8e65db6248d435ec8b76d4ec752c8b6c96
          path: .ci-agentshield
          sparse-checkout: .github/actions/agentshield
          persist-credentials: false

      - name: Verify trusted AgentShield bundle
        run: |
          echo 'd30ac2e68ee9266c4da7cfaa109f02fee22e3ca9880264c21d75050cabcecb9c  .ci-agentshield/.github/actions/agentshield/dist/action.js' | sha256sum --check --strict

      - name: Run AgentShield
        # v1.6.0 plus reviewed schema/prohibition corrections; see provenance.json.
        uses: ./.ci-agentshield/.github/actions/agentshield
        with:
          path: "."
          min-severity: "${{ github.event.inputs.min_severity || 'medium' }}"
          fail-on-findings: ${{ steps.gate.outputs.fail_on_findings }}
