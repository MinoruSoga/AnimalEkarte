name: Security Scan

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Minimum severity to fail/report."
        type: choice
        options:
          - doc
          - low
          - medium
          - high
          - critical
        required: false
        default: medium

permissions:
  contents: read

jobs:
  agentshield:
    name: AgentShield
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Run AgentShield
        # Pinned to v1.3.0 SHA: v1.4.0 (9bbc007c) introduced an unbundled `yaml` import that
        # crashes with ERR_MODULE_NOT_FOUND. v1.3.0 is the last known-good version.
        # Upgrade when upstream fixes yaml bundling and releases a new tag.
        uses: affaan-m/agentshield@9bbc007cf5afb562c324bbad4ce6c544420f49f6
        with:
          path: "."
          min-severity: "${{ github.event.inputs.min_severity || 'medium' }}"
          fail-on-findings: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
