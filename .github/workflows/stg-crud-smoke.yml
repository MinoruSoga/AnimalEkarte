name: STG CRUD Smoke Test (Phase 3)

on:
  workflow_dispatch:

jobs:
  crud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Health Check & Login
        env:
          DEMO_EMAIL: ${{ secrets.STG_DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.STG_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== 1. Health Check ==="
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" https://api.stg.noah-karte.com/health)"
          echo "Health Check HTTP Status: ${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "Error: Health endpoint returned HTTP ${http_code}"
            exit 1
          fi

          echo "=== 2. Login ==="
          if [ -z "${DEMO_EMAIL}" ] || [ -z "${DEMO_PASSWORD}" ]; then
            echo "Error: STG_DEMO_EMAIL or STG_DEMO_PASSWORD is not set in secrets."
            exit 1
          fi

          body_file_login="$(mktemp)"
          http_code_login="$(curl -sS -c cookie.txt -o "$body_file_login" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${DEMO_EMAIL}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            https://api.stg.noah-karte.com/api/v1/login)"
          echo "Login HTTP Status: ${http_code_login}"
          if [ "$http_code_login" != "200" ]; then
            echo "Error: Login failed with HTTP ${http_code_login}"
            exit 1
          fi

          is_admin="$(jq -r '.is_system_admin // .data.is_system_admin // empty' "$body_file_login")"
          if [ "$is_admin" != "true" ]; then
            echo "Error: Account is not system admin"
            exit 1
          fi
          echo "Login successful. Cookie saved."

      - name: CRUD Automation Execution
        run: |
          set -euo pipefail

          if [ ! -f cookie.txt ]; then
            echo "Error: cookie.txt not found. Login must have failed."
            exit 1
          fi

          API_V1="https://api.stg.noah-karte.com/api/v1"
          RUN_ID="${GITHUB_RUN_ID}"

          # テストデータID管理用変数
          CREATED_PG_ID=""
          CREATED_STAFF_ID=""

          # cleanup 関数の定義
          cleanup() {
            echo "=== Cleanup STG Smoke Test Data ==="
            # Staffs の削除（依存している側を先に削除）
            if [ -n "${CREATED_STAFF_ID}" ]; then
              echo "Cleanup: Deleting Staff ID ${CREATED_STAFF_ID}..."
              hcode=$(curl -sS -b cookie.txt -o /dev/null -w "%{http_code}" -X DELETE "${API_V1}/masters/staffs/${CREATED_STAFF_ID}")
              echo "Cleanup: Delete Staff HTTP Status: ${hcode}"
              if [ "$hcode" = "204" ] || [ "$hcode" = "404" ]; then
                CREATED_STAFF_ID=""
              else
                echo "Warning: Cleanup delete staff failed."
              fi
            fi

            # Permission Groups の削除
            if [ -n "${CREATED_PG_ID}" ]; then
              echo "Cleanup: Deleting Permission Group ID ${CREATED_PG_ID}..."
              hcode=$(curl -sS -b cookie.txt -o /dev/null -w "%{http_code}" -X DELETE "${API_V1}/masters/permission-groups/${CREATED_PG_ID}")
              echo "Cleanup: Delete Permission Group HTTP Status: ${hcode}"
              if [ "$hcode" = "204" ] || [ "$hcode" = "404" ]; then
                CREATED_PG_ID=""
              else
                echo "Warning: Cleanup delete permission-group failed."
              fi
            fi

            if [ -f cookie.txt ]; then
              rm -f cookie.txt
            fi
          }

          # trap による自動後処理
          trap cleanup EXIT

          echo "=== 3. Read-Only Verification for Clinics (Deferred Write) ==="
          # Clinics の書き込み（POST/PATCH/DELETE）は deferred (TODO)
          # TODO: clinics write automation will be implemented after cleanup reliability stabilization.
          # 現時点では Clinics は read-only のみ確認
          body_file_clinics="$(mktemp)"
          http_code_clinics="$(curl -sS -b cookie.txt -o "$body_file_clinics" -w "%{http_code}" "${API_V1}/clinics?scope=all")"
          echo "GET clinics (Read-Only Check) HTTP Status: ${http_code_clinics}"
          if [ "$http_code_clinics" != "200" ]; then
            echo "Error: Read-Only Clinics check failed with HTTP ${http_code_clinics}"
            exit 1
          fi

          echo "=== 4. PermissionGroups CRUD Test ==="
          # A. Create (POST)
          echo "[PG-1] Creating permission group..."
          body_file_pg_post="$(mktemp)"
          http_code_pg_post="$(curl -sS -b cookie.txt -o "$body_file_pg_post" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"STG_AUTO_PG_${RUN_ID}\",\"description\":\"Smoke test temporary group\",\"color\":\"#E5E7EB\",\"is_active\":true,\"sort_order\":0}" \
            "${API_V1}/masters/permission-groups")"
          echo "POST permission-group HTTP Status: ${http_code_pg_post}"
          if [ "$http_code_pg_post" != "201" ]; then
            echo "Error: Create permission group failed."
            jq -r '.error // .message // empty' "$body_file_pg_post" 2>/dev/null || true
            exit 1
          fi

          # IDの抽出
          CREATED_PG_ID="$(jq -r '.id // empty' "$body_file_pg_post")"
          if [ -z "${CREATED_PG_ID}" ]; then
            echo "Error: Failed to parse created permission group ID"
            exit 1
          fi
          echo "Created Permission Group ID: ${CREATED_PG_ID}"

          # B. Read (GET)
          echo "[PG-2] Getting permission group..."
          body_file_pg_get="$(mktemp)"
          http_code_pg_get="$(curl -sS -b cookie.txt -o "$body_file_pg_get" -w "%{http_code}" \
            "${API_V1}/masters/permission-groups/${CREATED_PG_ID}")"
          echo "GET permission-group HTTP Status: ${http_code_pg_get}"
          if [ "$http_code_pg_get" != "200" ]; then
            echo "Error: Get permission group failed."
            exit 1
          fi
          
          # C. Update (PATCH)
          echo "[PG-3] Updating permission group..."
          body_file_pg_patch="$(mktemp)"
          http_code_pg_patch="$(curl -sS -b cookie.txt -o "$body_file_pg_patch" -w "%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"Smoke test temporary group (updated)\"}" \
            "${API_V1}/masters/permission-groups/${CREATED_PG_ID}")"
          echo "PATCH permission-group HTTP Status: ${http_code_pg_patch}"
          if [ "$http_code_pg_patch" != "200" ]; then
            echo "Error: Patch permission group failed."
            jq -r '.error // .message // empty' "$body_file_pg_patch" 2>/dev/null || true
            exit 1
          fi

          echo "=== 5. Staffs CRUD Test ==="
          # A. Create (POST)
          echo "[STAFF-1] Creating staff..."
          body_file_staff_post="$(mktemp)"
          http_code_staff_post="$(curl -sS -b cookie.txt -o "$body_file_staff_post" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"STG_AUTO_STAFF_${RUN_ID}\",\"email\":\"stg-auto-${RUN_ID}@example.com\",\"password\":\"stg-password-1234\",\"sort_order\":0}" \
            "${API_V1}/masters/staffs")"
          echo "POST staff HTTP Status: ${http_code_staff_post}"
          if [ "$http_code_staff_post" != "201" ]; then
            echo "Error: Create staff failed."
            jq -r '.error // .message // empty' "$body_file_staff_post" 2>/dev/null || true
            exit 1
          fi

          # IDの抽出
          CREATED_STAFF_ID="$(jq -r '.id // empty' "$body_file_staff_post")"
          if [ -z "${CREATED_STAFF_ID}" ]; then
            echo "Error: Failed to parse created staff ID"
            exit 1
          fi
          echo "Created Staff ID: ${CREATED_STAFF_ID}"

          # B. Read (GET)
          echo "[STAFF-2] Getting staff..."
          body_file_staff_get="$(mktemp)"
          http_code_staff_get="$(curl -sS -b cookie.txt -o "$body_file_staff_get" -w "%{http_code}" \
            "${API_V1}/masters/staffs/${CREATED_STAFF_ID}")"
          echo "GET staff HTTP Status: ${http_code_staff_get}"
          if [ "$http_code_staff_get" != "200" ]; then
            echo "Error: Get staff failed."
            exit 1
          fi

          # C. Update (PATCH)
          echo "[STAFF-3] Updating staff..."
          body_file_staff_patch="$(mktemp)"
          http_code_staff_patch="$(curl -sS -b cookie.txt -o "$body_file_staff_patch" -w "%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"STG_AUTO_STAFF_${RUN_ID}_UPDATED\"}" \
            "${API_V1}/masters/staffs/${CREATED_STAFF_ID}")"
          echo "PATCH staff HTTP Status: ${http_code_staff_patch}"
          if [ "$http_code_staff_patch" != "200" ]; then
            echo "Error: Patch staff failed."
            jq -r '.error // .message // empty' "$body_file_staff_patch" 2>/dev/null || true
            exit 1
          fi

          echo "=== 6. Explicit Delete (CRUD Flow Verification) ==="
          # A. Delete Staff
          echo "[STAFF-4] Deleting staff..."
          http_code_staff_delete="$(curl -sS -b cookie.txt -o /dev/null -w "%{http_code}" -X DELETE \
            "${API_V1}/masters/staffs/${CREATED_STAFF_ID}")"
          echo "DELETE staff HTTP Status: ${http_code_staff_delete}"
          if [ "$http_code_staff_delete" != "204" ]; then
            echo "Error: Delete staff failed."
            exit 1
          fi
          # explicit 削除完了したのでIDクリア
          CREATED_STAFF_ID=""

          # B. Delete PermissionGroup
          echo "[PG-4] Deleting permission group..."
          http_code_pg_delete="$(curl -sS -b cookie.txt -o /dev/null -w "%{http_code}" -X DELETE \
            "${API_V1}/masters/permission-groups/${CREATED_PG_ID}")"
          echo "DELETE permission-group HTTP Status: ${http_code_pg_delete}"
          if [ "$http_code_pg_delete" != "204" ]; then
            echo "Error: Delete permission group failed."
            exit 1
          fi
          # explicit 削除完了したのでIDクリア
          CREATED_PG_ID=""

          echo "All CRUD smoke tests passed successfully."
