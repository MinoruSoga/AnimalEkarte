services:
  db:
    image: postgres:18-alpine
    container_name: ekarte-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ekarte-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GIN_MODE: debug
      CORS_ALLOWED_ORIGIN: http://localhost:3003
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ekarte-frontend
    ports:
      - "3003:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  codegen:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - ./backend/docs:/work/spec:ro
      - ./frontend/src/types/generated:/work/output
    # api.yaml (OpenAPI 3.0) → TypeScript types
    # api.yaml が single source of truth
    command: >
      sh -c "npx --yes openapi-typescript@^7 /work/spec/api.yaml -o /work/output/api.ts"
    profiles:
      - tools

volumes:
  postgres_data:
