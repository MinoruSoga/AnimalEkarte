services:
  db:
    image: postgres:18-alpine
    networks:
      - ekarte-network
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      tags:
        - ekarte-backend:latest
    networks:
      - ekarte-network
    env_file:
      - .env.local
    environment:
      # Local Docker network overrides
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_mod_cache:/root/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      tags:
        - ekarte-frontend:latest
    networks:
      - ekarte-network
    ports:
      - "3003:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  codegen:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend/src/types/generated:/output
    # Go model → TypeScript types via tygo
    # backend/internal/model/*.go が single source of truth
    command: >
      sh -c "go run github.com/gzuidhof/tygo@latest generate"
    profiles:
      - tools

volumes:
  postgres_data:
    name: ekarte-postgres-data
  frontend_node_modules:
    name: ekarte-frontend-node-modules
  go_mod_cache:
    name: ekarte-go-mod-cache

networks:
  ekarte-network:
    name: ekarte-network
