services:
  db:
    image: postgres:18-alpine
    networks:
      - ekarte-network
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    networks:
      - ekarte-network
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    env_file:
      - .env.local
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      tags:
        - ekarte-frontend:latest
    networks:
      - ekarte-network
    ports:
      - "3003:3000"
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  codegen:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    command: /bin/sh -c "cd /app && sed 's|/output/models.ts|/frontend/src/types/generated/models.ts|' tygo.yaml > /tmp/tygo-ci.yaml && go run github.com/gzuidhof/tygo@latest generate --config /tmp/tygo-ci.yaml"

volumes:
  postgres_data:
    name: ekarte-postgres-data
  frontend_node_modules:
    name: ekarte-frontend-node-modules
  go_mod_cache:
    name: ekarte-go-mod-cache

networks:
  ekarte-network:
    name: ekarte-network
