openapi: 3.0.0
info:
  title: Animal Ekarte API
  description: |
    動物病院向け電子カルテシステム API (Implementation Synced v3.1.0)

    ## 認証方式

    主メカニズムは **HttpOnly Cookie** ベース。フロントエンドは axios `withCredentials: true` で
    Cookie を自動送信する。`Authorization: Bearer <jwt>` ヘッダはミドルウェアの後方互換
    フォールバックとしてサポートされる。

    | Cookie 名 | 内容 | 有効期限 | Path | 用途 |
    |----------|------|---------|------|------|
    | `access_token` | JWT (HS256) | 15分 | `/` | 全保護エンドポイントの認証 |
    | `refresh_token` | JWT (HS256, sub=refresh) | 7日 | `/api/v1/auth/refresh` | アクセストークン再発行 |
    | `prev_clinic_id` | クリニックID数値 | 15分 | `/` | クリニック切替の監査・履歴用 |
    | `auth_token` | (legacy) | — | `/` | 旧 Cookie 名。読み取りのみ後方互換 |

    本番環境では `Secure=true` + `SameSite=None`、開発環境では `Secure=false` + `SameSite=Lax`。

    ## クリニック切替

    `X-Clinic-ID` ヘッダで所属クリニックを切り替え可能（所属チェック付き、system_admin は無制限）。
  version: 3.1.0
  contact:
    name: Animal Ekarte Team
    url: https://github.com/animal-ekarte/backend
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: https://stg.noah-karte.com
    description: ステージング環境
  - url: https://api.noah-karte.com
    description: 本番環境

paths:
  /health:
    get:
      tags: [Health]
      summary: ヘルスチェック
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/login:
    post:
      tags: [Authentication]
      summary: ログイン
      description: |
        メール/パスワードを bcrypt 検証し、認証成功時に
        `access_token` (15分) と `refresh_token` (7日) を **HttpOnly Cookie** として
        `Set-Cookie` で発行する。レスポンスボディには JWT 文字列は含まれない。

        **レート制限**: 5回/分（BUG-130 ブルートフォース対策）。

        **監査ログ**: `auth.login.success` / `auth.login.failure` を記録。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: ログイン成功。`Set-Cookie` で `access_token` / `refresh_token` を発行。
          headers:
            Set-Cookie:
              description: |
                2 件発行される（`access_token`, `refresh_token`）。
                両方とも `HttpOnly`。本番では `Secure; SameSite=None`、開発では `SameSite=Lax`。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: バリデーションエラー（email 形式 / password 8文字未満）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 認証失敗（メールアドレスまたはパスワード不正、アカウント無効、スタッフ無効）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: レート制限超過（5回/分）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/logout:
    post:
      tags: [Authentication]
      summary: ログアウト
      description: |
        `access_token` / `refresh_token` / 旧 `auth_token` Cookie を `MaxAge=-1` で破棄する。
        認証ミドルウェアの保護対象外で、未認証でも 200 を返す。
        Cookie 由来の `user_id` / `clinic_id` が解決できる場合のみ `auth.logout` 監査ログを記録する。
      responses:
        '200':
          description: OK。`Set-Cookie` で 3 件の Cookie を破棄する。
          headers:
            Set-Cookie:
              description: access_token / refresh_token / auth_token を `MaxAge=-1` で削除。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: アクセストークン更新（Token Rotation）
      description: |
        `refresh_token` Cookie を検証し、新しい `access_token` (15分) と
        `refresh_token` (7日) を発行する。リクエストボディは不要。
        旧 `refresh_token` は使い捨てで、新トークンに置換される（Token Rotation）。

        新トークンはレスポンスボディに含まれず、`Set-Cookie` で返される。

        スタッフが無効化されている場合、`refresh_token` の subject が `refresh` でない場合、
        署名不正・期限切れの場合は 401 を返す。
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 更新成功。`Set-Cookie` で新しい `access_token` / `refresh_token` を発行。
          headers:
            Set-Cookie:
              description: access_token (15分) と refresh_token (7日) を再発行。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401':
          description: refresh_token Cookie 不在 / 検証失敗 / Subject 不正 / スタッフ無効
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: パスワードリセットメール送信
      description: |
        メールアドレスにリセットリンク（有効期限1時間）を送信する。
        メール存在有無の漏洩防止のため、アカウント不存在時も 200 を返す。
        既存の未使用トークンは削除されてから新しいトークンが発行される。

        **レート制限**: 3回/分（同一クライアント IP）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: 受付完了（アカウント存在の有無に関わらず同じレスポンス）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: バリデーションエラー（email 形式不正）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: レート制限超過（3回/分）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: パスワードリセット実行
      description: |
        `token` (rawToken) を SHA256 ハッシュ化して DB と照合し、有効期限内であれば
        `password` を bcrypt ハッシュ化して `accounts.password_hash` を更新する。
        使用済みトークンは削除される。

        **パスワード複雑性 (BUG-139)**: 8 文字以上、英字 1 文字以上、数字 1 文字以上が必須。

        **レート制限**: 3回/分。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: パスワード更新完了。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: |
            トークン不正 / 期限切れ / パスワード複雑性違反。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: レート制限超過（3回/分）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Authentication]
      summary: ログインユーザー情報・実効権限取得
      description: |
        認証済みユーザーの基本情報、メインクリニック詳細、所属クリニック一覧、
        実効権限マップを返す。実効権限は `staff_permission_groups` →
        `permission_group_rules` の UNION で計算される（system_admin は全リソースで全 CRUD true）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/v1/users/me/password:
    put:
      tags: [Authentication]
      summary: 自分のパスワード変更
      description: |
        認証済みユーザー自身のパスワードを変更する（BUG-148）。
        `current_password` を bcrypt 検証し、`new_password` を `validatePassword` で
        複雑性チェック（BUG-139: 8文字以上、英字+数字必須）してから更新する。

        スタッフにアカウントが紐づいていない場合は 400。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 変更完了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: |
            バリデーションエラー（複雑性違反、アカウント未紐付け、必須欠落）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未認証 または `current_password` 不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/owners:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Owners]
      summary: 飼主一覧
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Owner' }
    post:
      tags: [Owners]
      summary: 飼主作成
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerInput' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Owner' }

  /api/v1/owners/{id}:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Owners]
      summary: 飼主詳細
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Owner' }
    patch:
      tags: [Owners]
      summary: 飼主更新
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerInput' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Owner' }
    delete:
      tags: [Owners]
      summary: 飼主削除
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: OK }

  /api/v1/owners/{id}/line-user-id:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    patch:
      tags: [Owners, LINE]
      summary: LINE User ID 連携
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line_user_id: { type: string, nullable: true }
      responses:
        '200': { description: OK }

  /api/v1/owners/{id}/lstep/tags:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Owners, LSTEP]
      summary: Lステップタグ一覧
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
    post:
      tags: [Owners, LSTEP]
      summary: Lステップタグ追加
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tag_name]
              properties:
                tag_name:
                  type: string
                  description: |
                    付与するLステップタグ名。タグ名はLステップから動的取得・参照する。バリデーション制約は docs/API_SPEC.md §6 を参照。
      responses:
        '200': { description: OK }

  /api/v1/clinics/{clinic_id}/owners/{id}/lstep/friend-attributes:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Owners, LSTEP]
      summary: 飼主の最新友だち属性取得（クリニック別エンドポイント）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepFriendAttribute' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/clinics/{clinic_id}/lstep-settings:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定取得
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepSettings' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    patch:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定更新
      description: |
        未送信フィールドは空文字や `null` を含めて受け付けます。
        送受信される秘密情報はマスクされており、更新時に未送信なら既存値を保持します。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LstepSettingsPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepSettings' }
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    delete:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定削除
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/clinics/{clinic_id}/lstep-settings/test-connection:
    post:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ接続テスト
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepConnectionTest' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/lstep-settings:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定取得（スタッフ所属ベース）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepSettings' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    patch:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定更新（スタッフ所属ベース）
      description: |
        未送信フィールドは空文字や `null` を含めて受け付けます。
        秘密情報はマスクレスポンス。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LstepSettingsPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepSettings' }
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    delete:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ連携設定削除（スタッフ所属ベース）
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/lstep-settings/test-connection:
    post:
      tags: [LSTEP, Hospital Settings]
      summary: Lステップ接続テスト（スタッフ所属ベース）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LstepConnectionTest' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/clinics/{clinic_id}/lstep/checkup-sync/preview:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [LSTEP, Checkups]
      summary: 健診対象者プレビュー（ISSUE-005 / ISSUE-008）
      description: |
        健診タグ一括付与の対象者候補を抽出する。
        opt-out / 生存ペットなし / LINE未連携 の飼い主は `exclusion_reason` で除外理由を返し、
        サマリー（`eligible_count` / `opt_out_count` / `no_living_pet_count`）で集計する。

        **除外優先順位** (deriveExclusionReason): `opt-out` > `生存ペットなし` > `LINE未連携`。
        いずれにも該当しない場合 `exclusion_reason` は `null`（送信可能）となる。

        FEAT-375: `lstep_settings.is_sync_enabled=false` のクリニックでもプレビューは参照系として利用可能。
        実際の Lステップ API 呼び出しを伴う同期処理はクライアントを生成せず、noop/skip する。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
        - name: checkup_type
          in: query
          required: false
          description: 健診種別（監査ログ用、抽出条件には影響しない）
          schema:
            type: string
            enum: [annual, dental, blood, skin, cancer, other]
        - name: species
          in: query
          required: false
          description: 動物種フィルタ
          schema: { type: string }
        - name: last_visit_before
          in: query
          required: false
          description: 最終来院日がこの日以前
          schema: { type: string, format: date }
        - name: last_visit_after
          in: query
          required: false
          description: 最終来院日がこの日以降
          schema: { type: string, format: date }
        - name: min_age_years
          in: query
          required: false
          description: |
            (ISSUE-009) 生存ペットの最小年齢（years 以上）。
            飼い主の生存ペット中に少なくとも1匹該当する場合にマッチする。
          schema: { type: integer, minimum: 0 }
        - name: max_age_years
          in: query
          required: false
          description: |
            (ISSUE-009) 生存ペットの最大年齢（years 以下）。
            飼い主の生存ペット中に少なくとも1匹該当する場合にマッチする。
          schema: { type: integer, minimum: 0 }
        - name: has_chronic_condition
          in: query
          required: false
          description: |
            (ISSUE-009) アクティブな慢性疾患の有無。
            `true`: 慢性疾患あり / `false`: 慢性疾患なし / 未指定: 絞らない。
          schema: { type: boolean }
        - name: cpm_stage
          in: query
          required: false
          description: |
            (ISSUE-009) CPM ステージ絞り込み。判定ロジックはタグ同期側 `CalculateCPMStage` と同一。

            V1/V2 並立稼働中（Q2 確定済み 2026-05-08）。V1 enum 値を使用。
            詳細: docs/line/lstep-integration.md §5
          schema:
            type: string
            enum: [cpm_encounter, cpm_growing, cpm_core, cpm_spot, cpm_noah, cpm_dormant]
        - name: min_total_amount
          in: query
          required: false
          description: (ISSUE-009) 累計診療費（円）以上（completed accountings 合計）。
          schema: { type: integer, minimum: 0 }
        - name: min_annual_visit_count
          in: query
          required: false
          description: (ISSUE-009) 年間来院回数（過去365日 distinct visit）以上。
          schema: { type: integer, minimum: 0 }
        - name: last_checkup_before
          in: query
          required: false
          description: (ISSUE-009) 最終健診実施日がこの日以前。
          schema: { type: string, format: date }
        - name: last_checkup_after
          in: query
          required: false
          description: (ISSUE-009) 最終健診実施日がこの日以降。
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckupSyncPreviewResponse' }
        '400':
          description: バリデーションエラー（パラメータ形式不正・列挙値外）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/clinics/{clinic_id}/lstep/checkup-sync:
    parameters:
      - $ref: '#/components/parameters/XClinicIDHeader'
    post:
      tags: [LSTEP, Checkups]
      summary: 健診タグ一括付与
      description: |
        選択した飼い主に対して健診リマインダータグを一括付与する。

        **スキップ判定** はプレビュー側 `exclusion_reason` と同じ優先度
        (`opt-out` > `生存ペットなし` > `LINE未連携`) で行い、誤配信を防ぐ。
        スキップされたケースは `skipped_count` に集計される。

        FEAT-375: `lstep_settings.is_sync_enabled=false` のクリニックでは Lステップ API クライアントを生成しない。
        API キー未設定時と同じく同期実行はエラー扱いとなる。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckupSyncRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckupSyncResult' }
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
