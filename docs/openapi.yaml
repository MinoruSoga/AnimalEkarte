  parameters:
    XClinicIDHeader:
      name: X-Clinic-ID
      in: header
      required: false
      description: |
        **所属クリニック切替ヘッダ** (BUG-128 / `middleware/auth.go::Auth`)。

        認証ミドルウェアが Cookie / Bearer から復号した JWT の `clinic_id` を、
        本ヘッダの値で **上書き** する。クリニック横断ユーザー（複数所属スタッフ
        または `system_admin`）が同一セッション内で操作対象クリニックを切り替える際に使用する。

        **権限ルール**:
        - `system_admin`: 任意のクリニック ID を許可（所属チェックなし）
        - 通常スタッフ: JWT クレームの `clinic_ids` リストに含まれるクリニック ID のみ許可
          - リスト外 → `403 Forbidden` (`not assigned to this clinic`)
          - 数値として解析できない → `400 Bad Request` (`invalid clinic id`)
        - 未指定 / 空文字: JWT の `clinic_id`（ログイン時のメインクリニック）が使われる

        **クライアント側挙動**: フロントエンドは `frontend/src/lib/axios.ts` の interceptor
        で `localStorage["auth_current_clinic:v1"]` から自動付与する。直接 API を叩く場合は
        必要に応じて手動指定する。

        **適用範囲**: `Auth` ミドルウェア配下の保護エンドポイントでのみ評価される。
        login / logout / auth refresh / forgot / reset / health / LINE webhook では無視される。
      schema:
        type: string
        pattern: '^[0-9]+$'
        example: "1"

  responses:
    UnauthorizedError:
      description: 認証が必要です
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenError:
      description: 権限がありません
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFoundError:
      description: リソースが見つかりません
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        主要な認証メカニズム。`POST /api/v1/login` 成功時に `Set-Cookie` で発行される
        HttpOnly な JWT。Path=/, MaxAge=15min。本番環境では `Secure; SameSite=None`、
        開発環境では `SameSite=Lax`。

        ブラウザは axios `withCredentials: true` で自動送信する。
        後方互換: 旧 Cookie 名 `auth_token` も読み取られる（書き込みは行われず、ログアウト時のみ破棄）。
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        `POST /api/v1/auth/refresh` 専用の HttpOnly な JWT (subject=refresh)。
        Path=`/api/v1/auth/refresh`、MaxAge=7days。Token Rotation により毎回置換される。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        後方互換のフォールバック。`Authorization: Bearer <jwt>` ヘッダで `access_token`
        と同じ JWT を送信する。Cookie が利用不可な環境（CLI クライアント等）向け。
        新規クライアントは `cookieAuth` を使用すること。
