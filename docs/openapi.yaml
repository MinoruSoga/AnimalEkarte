        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CheckupSyncExclusionReason:
      type: string
      description: |
        健診タグ一括付与における除外理由。優先度順に判定される。
        いずれにも該当しない場合は `null`（送信可能）。

        - `Lステップ配信停止中`: opt-out 中の飼い主（最優先で除外）
        - `生存ペットなし`: 生存中のペットが1件もない（死亡ペットのみの飼い主）
        - `LINE未連携`: LINE User ID が未登録
      enum:
        - Lステップ配信停止中
        - 生存ペットなし
        - LINE未連携

    CheckupSyncPreviewOwner:
      type: object
      description: 健診対象者プレビューの1件（ISSUE-005）。
      required:
        - owner_id
        - owner_name
        - pet_names
        - last_visit_date
        - has_line
        - is_opt_out
        - has_living_pet
        - exclusion_reason
        - current_tags
      properties:
        owner_id:
          type: string
          description: 飼い主ID（数値の文字列表現）
        owner_name: { type: string }
        pet_names:
          type: array
          items: { type: string }
          description: 関連ペット名一覧（CSV を分割）
        last_visit_date:
          type: string
          format: date
          nullable: true
          description: 最終来院日（YYYY-MM-DD）。来院履歴がない場合は null。
        has_line:
          type: boolean
          description: LINE User ID が登録済みかどうか
        is_opt_out:
          type: boolean
          description: Lステップ配信停止フラグ
        has_living_pet:
          type: boolean
          description: 生存中ペットが1件以上存在するか（ISSUE-005）
        exclusion_reason:
          allOf:
            - $ref: '#/components/schemas/CheckupSyncExclusionReason'
          nullable: true
          description: |
            除外理由。`null` のとき送信可能。
            優先順位: `opt-out` > `生存ペットなし` > `LINE未連携`。
        current_tags:
          type: array
          items: { type: string }
          description: 現在付与中の Lステップタグ一覧（LINE未連携時は空配列）
        min_pet_age_years:
          type: integer
          nullable: true
          description: (ISSUE-009) 生存ペットの最小年齢（years）。誕生日未登録 / 生存ペットなしのとき null。
        max_pet_age_years:
          type: integer
          nullable: true
          description: (ISSUE-009) 生存ペットの最大年齢（years）。誕生日未登録 / 生存ペットなしのとき null。
        has_chronic_condition:
          type: boolean
          description: (ISSUE-009) アクティブな慢性疾患の有無（生存ペット由来）。
        cpm_stage:
          type: string
          description: |
            (ISSUE-009) CPM ステージ（現行実装 V1 / `CalculateCPMStage`）。

            V1/V2 並立稼働中（Q2 確定済み 2026-05-08）。V1 enum 値を使用。
            詳細: docs/line/lstep-integration.md §5
          enum: [cpm_encounter, cpm_growing, cpm_core, cpm_spot, cpm_noah, cpm_dormant]
        total_amount:
          type: integer
          description: (ISSUE-009) 累計診療費（円、completed accountings 合計）。
        annual_visit_count:
          type: integer
          description: (ISSUE-009) 年間来院回数（過去365日 distinct visit）。
        last_checkup_date:
          type: string
          format: date
          nullable: true
          description: (ISSUE-009) 最終健診実施日（YYYY-MM-DD）。実績なしは null。

    CheckupSyncPreviewResponse:
      type: object
      description: 健診対象者プレビューレスポンス（ISSUE-005）。
      required:
        - owners
        - total_count
        - eligible_count
        - line_linked_count
        - opt_out_count
        - no_living_pet_count
      properties:
        owners:
          type: array
          items: { $ref: '#/components/schemas/CheckupSyncPreviewOwner' }
        total_count:
          type: integer
          description: 抽出条件にマッチした総件数
        eligible_count:
          type: integer
          description: |
            送信可能件数（`exclusion_reason == null` の件数）。
            すなわち `has_line && !is_opt_out && has_living_pet` を満たす件数。
        line_linked_count:
          type: integer
          description: LINE 連携済み件数（`has_line == true`）
        opt_out_count:
          type: integer
          description: opt-out 中の件数（ISSUE-005）
        no_living_pet_count:
          type: integer
          description: 生存ペットなしの件数（死亡ペットのみの飼い主、ISSUE-005）

    CheckupSyncRequest:
      type: object
      required: [checkup_type, owner_ids, tag_name]
      properties:
        checkup_type:
          type: string
          enum: [annual, dental, blood, skin, cancer, other]
          description: 健診種別（監査ログ用）
        owner_ids:
          type: array
          minItems: 1
          items: { type: string }
          description: 対象飼い主ID（数値の文字列表現）
        tag_name:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,100}$'
          description: |
            付与するLステップタグ名（現行バリデーション: 英数字・アンダースコア・ハイフンのみ、1〜100文字）。
            自動管理タグ名は使用不可。

