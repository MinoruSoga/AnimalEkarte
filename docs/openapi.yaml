      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: pet_id, schema: { type: integer } }
        - { in: query, name: owner_id, schema: { type: integer } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ExaminationStatus' } }
        - { in: query, name: start_date, schema: { type: string, format: date } }
        - { in: query, name: end_date, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Examination' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [Examinations]
      summary: 検査作成
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExaminationCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, description: 作成されたリソースの URI }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Examination' }
        '400': { description: Bad Request }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { description: Forbidden }

  /api/v1/examinations/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Examinations]
      summary: 検査詳細取得（items を含む）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Examination' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { description: Not Found }
    patch:
      tags: [Examinations]
      summary: 検査更新（部分更新）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExaminationUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Examination' }
        '400': { description: 不正な入力（確定済みの場合も 400） }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { description: Forbidden }
        '404': { description: Not Found }
    delete:
      tags: [Examinations]
      summary: 検査削除（items が紐付く場合は 409）
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { description: Forbidden }
        '404': { description: Not Found }
        '409': { description: 検査結果が紐付いているため削除不可 }

  /api/v1/examinations/{id}/items:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/XClinicIDHeader'
    get:
      tags: [Examinations]
      summary: 検査項目一覧取得（sort_order ASC）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamItemsResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { description: 検査が存在しない }
    put:
      tags: [Examinations]
      summary: 検査項目を一括置換（既存全削除→一括登録）
      description: |
        PUT セマンティクス。送信された items で既存項目を完全に置き換える。
        サーバ側で `inspection_value` を float としてパースし、`ref_min` / `ref_max` と比較して
        `status` (normal/high/low) と `is_abnormal` を導出する（FE 送信値は無視）。
        確定済み (`status=confirmed`) の検査は 400 で拒否する。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceExamItemsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamItemsResponse' }
        '400': { description: 不正な入力 / 確定済みの検査 }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { description: Forbidden（edit 権限なし） }
        '404': { description: 検査が存在しない }

components:
  schemas:
    PaginatedResponse:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    ShiftTemplateBreak:
      type: object
      properties:
        id:
          type: integer
        break_start:
          type: string
        break_end:
          type: string

    ShiftTemplate:
      type: object
      properties:
        id:
          type: integer
        clinic_id:
          type: integer
        name:
          type: string
        shift_type:
          type: string
          enum: [full, morning, afternoon, off, paid_leave]
        start_time:
          type: string
        end_time:
          type: string
        notes:
          type: string
        sort_order:
          type: integer
          format: int32
        is_active:
          type: boolean
          default: true
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ShiftTemplateBreak'

    ExaminationStatus:
      type: string
      enum: [pending, in_progress, result_entered, completed, confirmed]
    ClinicHoliday:
      type: object
      properties:
        id:
          type: integer
        clinic_id:
          type: integer
        date:
          type: string
          format: date
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SetClinicHolidayRequest:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
        reason:
          type: string


    ExaminationResultStatus:
      type: string
      description: |
        サーバ側で `inspection_value` (float) と `ref_min` / `ref_max` から導出される判定。
        範囲内 → normal / ref_min 未満 → low / ref_max 超過 → high。
        パース不能・空値・ref 未指定の場合は normal。
      enum: [normal, high, low]

    Examination:
      type: object
      properties:
        id: { type: integer }
        clinic_id: { type: integer }
        medical_record_id: { type: integer, nullable: true }
        pet_id: { type: integer, nullable: true }
        exam_type_id: { type: integer }
        doctor_id: { type: integer, nullable: true }
        date: { type: string, format: date-time }
        result_summary: { type: string }
        machine: { type: string }
        status: { $ref: '#/components/schemas/ExaminationStatus' }
        pet: { type: object, nullable: true, description: 'ペットサマリ。Preload 時のみ。' }
        doctor: { type: object, nullable: true, description: '担当医サマリ(id, name)。Preload 時のみ。' }
        exam_type: { type: object, nullable: true, description: '検査種別サマリ。Preload 時のみ。' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExaminationCreateRequest:
      type: object
      required: [exam_type_id, date]
      properties:
        medical_record_id: { type: integer, nullable: true }
        pet_id: { type: integer, nullable: true }
        exam_type_id: { type: integer }
        doctor_id: { type: integer, nullable: true }
        date: { type: string, format: date-time }
        result_summary: { type: string }
        machine: { type: string }
        status: { $ref: '#/components/schemas/ExaminationStatus' }

    ExaminationUpdateRequest:
      type: object
      description: PATCH セマンティクス（指定しないフィールドは変更されない）。
      properties:
        medical_record_id: { type: integer, nullable: true }
        pet_id: { type: integer, nullable: true }
        exam_type_id: { type: integer }
        doctor_id: { type: integer, nullable: true }
        date: { type: string, format: date-time }
        result_summary: { type: string }
        machine: { type: string }
        status: { $ref: '#/components/schemas/ExaminationStatus' }

    ExamResult:
      type: object
      description: 検査項目（exam_results）。`status` / `is_abnormal` はサーバで導出された値。
      properties:
        id: { type: integer }
        exam_id: { type: integer }
        exam_type_field_id: { type: integer, nullable: true }
        name: { type: string }
        inspection_value: { type: string }
        normal_value: { type: string }
        result: { type: string }
        unit: { type: string }
        reference_value: { type: string }
        ref_min: { type: number, nullable: true }
        ref_max: { type: number, nullable: true }
        is_abnormal: { type: boolean }
        status: { $ref: '#/components/schemas/ExaminationResultStatus' }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertExamItemRequest:
      type: object
      required: [name]
      description: |
        検査項目 1 行分の入力。`status` / `is_abnormal` はサーバ側で `ref_min`/`ref_max` から
        導出するため、リクエストでは受け付けない。
      properties:
        exam_type_field_id: { type: integer, nullable: true }
        name: { type: string }
        inspection_value: { type: string }
        normal_value: { type: string }
        unit: { type: string }
        reference_value: { type: string }
        ref_min: { type: number, nullable: true }
        ref_max: { type: number, nullable: true }
        sort_order: { type: integer }

    ReplaceExamItemsRequest:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpsertExamItemRequest' }

    ExamItemsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExamResult' }

    User:
      type: object
      description: |
        【非推奨】accounts テーブルの内部表現。認証エンドポイントのレスポンスでは使用しない。
        `/api/v1/login` は `LoginResponse` を、`/api/v1/me` は `MeResponse` を返す。
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        password_hash: { type: string }
        is_active: { type: boolean }
        is_system_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    # ---- Authentication request/response schemas ----

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
          description: 8 文字以上（バインダ側の min バリデーション）

    LoginResponse:
      type: object
      description: |
        ログイン成功レスポンス。JWT は `Set-Cookie` で配布されるため
        ボディには含まれない。`user` は `MeResponse` と同形。
      required: [is_system_admin, user]
      properties:
        is_system_admin:
          type: boolean
          description: |
            `accounts.is_system_admin`。クリニック横断の最高権限フラグ。
            `user.is_system_admin` と常に同値。
        user: { $ref: '#/components/schemas/MeResponse' }

    MeResponse:
      type: object
      description: |
        `GET /api/v1/me` および `LoginResponse.user` のレスポンスシェイプ。
        ID は数値の文字列表現（フロントエンド統一のため）。
      required:
        - id
        - email
        - display_name
        - is_system_admin
        - main_clinic_id
        - permissions
      properties:
        id:
          type: string
          description: スタッフ ID（数値の文字列表現）
        email: { type: string, format: email }
        display_name:
          type: string
          description: スタッフ名（`staff.name`）
        is_system_admin: { type: boolean }
        occupation:
          type: string
          nullable: true
          description: 職種マスタ名（`occupations.name`）。未設定時は省略または null。
        main_clinic_id:
          type: string
          description: |
            メインクリニック ID（数値の文字列）。`staff_clinic_assignments.is_main=true`
            の最初の所属、なければ最初の所属を採用。
        clinic:
          allOf:
            - $ref: '#/components/schemas/MeClinicInfo'
          nullable: true
          description: メインクリニックの詳細情報。所属がない場合は省略または null。
        clinics:
          type: array
          items: { $ref: '#/components/schemas/MeClinicMembership' }
          description: 所属クリニック一覧
        permissions:
          $ref: '#/components/schemas/EffectivePermissions'

    MeClinicInfo:
      type: object
      description: ログインユーザーのメイン所属クリニックの詳細情報。
      required:
        - id
        - name
        - postal_code
        - address
        - phone_number
        - fax_number
        - registration_number
        - director_name
        - email
        - website
        - standard_tax_rate
        - reduced_tax_rate
      properties:
        id: { type: string }
        name: { type: string }
        postal_code: { type: string }
        address: { type: string }
        phone_number: { type: string }
        fax_number: { type: string }
        registration_number: { type: string }
        director_name: { type: string }
        email: { type: string }
        website: { type: string }
        logo_url: { type: string, nullable: true }
        standard_tax_rate:
          type: number
          format: float
          description: "標準税率（例: 0.10）。BUG-367 インボイス帳票用。"
        reduced_tax_rate:
          type: number
          format: float
          description: "軽減税率（例: 0.08）。BUG-367 インボイス帳票用。"
        accounting_document_show_logo: { type: boolean }
        accounting_document_show_registration_warning: { type: boolean }
        accounting_document_show_item_category: { type: boolean }
        accounting_document_footer_note: { type: string }
        accounting_document_show_clinic_header: { type: boolean }
        accounting_document_show_owner_pet_info: { type: boolean }
        accounting_document_show_items_table: { type: boolean }
        accounting_document_show_payment_summary: { type: boolean }
        accounting_document_section_order: { type: array, items: { type: string } }

    MeClinicMembership:
      type: object
      required: [clinic_id, clinic_name, is_main]
      properties:
        clinic_id: { type: string }
        clinic_name: { type: string }
        is_main: { type: boolean }

    ResourcePermission:
      type: object
      description: リソース単位の CRUD 権限。
      required: [view, create, edit, delete]
      properties:
        view: { type: boolean }
        create: { type: boolean }
        edit: { type: boolean }
        delete: { type: boolean }

    EffectivePermissions:
      type: object
      description: |
        リソース名 → CRUD 権限のマップ。`staff_permission_groups` →
        `permission_group_rules` の UNION で計算される。`is_system_admin=true` の場合は
        `AllResources` 全件で全 true。

        代表的なリソースキー: `owners`, `medical-records`, `hospitalization`, `trimming`,
        `examinations`, `accounting`, `vaccinations`, `inventory`, `estimates`,
        `accounting-reports` 等。完全な一覧は `backend/internal/model/permission.go::AllResources`
        を参照。
      additionalProperties:
        $ref: '#/components/schemas/ResourcePermission'

    MessageResponse:
      type: object
      description: |
        単純なメッセージレスポンス。logout / refresh / forgot-password /
        reset-password / users/me/password で共通利用。
      required: [message]
      properties:
        message: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: |
            メール記載のリセットトークン（rawToken、hex 64 文字）。
            DB 側では SHA256 ハッシュで保存・照合される。
        password:
          type: string
          format: password
          minLength: 8
          description: |
            新パスワード。bind バリデーションは `min=8` のみだが、サーバ側
            `validatePassword` で **英字 1 文字以上 + 数字 1 文字以上** の複雑性も検証される（BUG-139）。

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          description: 現在のパスワード（bcrypt 検証用）
        new_password:
          type: string
          format: password
          minLength: 8
          description: |
            新パスワード。サーバ側 `validatePassword` で 8 文字以上 +
            英字 1 文字以上 + 数字 1 文字以上を強制（BUG-139）。

    Owner:
