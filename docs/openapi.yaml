openapi: 3.0.0
info:
  title: Animal Ekarte API
  description: 動物病院向け電子カルテシステム API
  version: 2.0.0
  contact:
    name: Animal Ekarte Team
    url: https://github.com/animal-ekarte/backend
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: https://stg.noah-karte.com
    description: ステージング環境
  - url: https://api.noah-karte.com
    description: 本番環境

paths:
  /health:
    get:
      tags:
        - Health
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        '200':
          description: サーバー稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/login:
    post:
      tags:
        - Authentication
      summary: ログイン
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: メールアドレスまたはパスワードが違います
        '429':
          description: レート制限超過（5回/分）

  /api/v1/logout:
    post:
      tags:
        - Authentication
      summary: ログアウト
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: トークン更新
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: トークン更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string

  /api/v1/owners:
    get:
      tags:
        - Owners
      summary: 飼主一覧取得
      operationId: listOwners
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: 飼主名またはペット名で検索
      responses:
        '200':
          description: 飼主一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Owner'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Owners
      summary: 飼主作成
      operationId: createOwner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '201':
          description: 飼主作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/owners/{ownerId}:
    get:
      tags:
        - Owners
      summary: 飼主詳細取得
      operationId: getOwner
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 飼主詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Owners
      summary: 飼主更新
      operationId: updateOwner
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '200':
          description: 飼主更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Owners
      summary: 飼主削除
      operationId: deleteOwner
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 飼主削除成功
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 関連データが存在するため削除不可

  /api/v1/appointments:
    get:
      tags:
        - Reservations
      summary: 予約一覧取得
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: clinic_id
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 予約日付 (YYYY-MM-DD)
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: 予約一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  total:
                    type: integer

  /api/v1/medical-records:
    get:
      tags:
        - Medical Records
      summary: 医療記録一覧取得
      operationId: listMedicalRecords
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 医療記録一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicalRecord'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /api/v1/medical-records/{recordId}:
    get:
      tags:
        - Medical Records
      summary: 医療記録詳細取得
      operationId: getMedicalRecord
      security:
        - bearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 医療記録詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordDetail'

  /api/v1/settings/reservation-type:
    get:
      tags:
        - Masters
      summary: 予約種別一覧取得
      operationId: listReservationTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 予約種別一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservationType'

  /api/v1/settings/treatment-items:
    get:
      tags:
        - Masters
      summary: 処置項目一覧取得
      operationId: listTreatmentItems
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 処置項目一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TreatmentItem'

  /api/v1/settings/staff:
    get:
      tags:
        - Masters
      summary: スタッフ一覧取得
      operationId: listStaff
      security:
        - bearerAuth: []
      parameters:
        - name: clinic_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: スタッフ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Staff'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role_name:
          type: string
        clinic_id:
          type: integer
        clinic_name:
          type: string
        permissions:
          type: array
          items:
            type: string

    Owner:
      type: object
      required:
        - id
        - owner_name
        - owner_kana
        - phone
      properties:
        id:
          type: integer
        owner_name:
          type: string
        owner_kana:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        home_address:
          type: string
        birth_date:
          type: string
          format: date
        is_danger:
          type: boolean
        notes:
          type: string
        discount_rate:
          type: integer
          minimum: 0
          maximum: 100
        membership_type:
          type: string
          enum: [non_member, member, other, retired]
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'

    OwnerInput:
      type: object
      required:
        - owner_name
        - owner_kana
        - phone
      properties:
        owner_name:
          type: string
        owner_kana:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        home_address:
          type: string
        birth_date:
          type: string
          format: date
        is_danger:
          type: boolean
        notes:
          type: string
        discount_rate:
          type: integer
        membership_type:
          type: string

    Pet:
      type: object
      properties:
        id:
          type: string
        pet_no:
          type: string
        pet_name:
          type: string
        species:
          type: string
        breed:
          type: string
        birth_date:
          type: string
          format: date
        weight:
          type: number
          format: float
        microchip:
          type: string
        is_alive:
          type: boolean

    Appointment:
      type: object
      properties:
        id:
          type: string
        clinic_id:
          type: integer
        pet_id:
          type: string
        owner_id:
          type: integer
        owner_name:
          type: string
        pet_name:
          type: string
        reservation_type:
          type: string
        staff_id:
          type: string
        staff_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        notes:
          type: string
        status:
          type: string
          enum: [confirmed, cancelled, completed]

    MedicalRecord:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
        pet_name:
          type: string
        owner_name:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, finalized]
        chief_complaint:
          type: string
        diagnosis:
          type: string

    MedicalRecordDetail:
      allOf:
        - $ref: '#/components/schemas/MedicalRecord'
        - type: object
          properties:
            clinic_id:
              type: integer
            examination:
              type: object
              properties:
                body_weight:
                  type: number
                temperature:
                  type: number
                pulse:
                  type: integer
                findings:
                  type: string
            treatments:
              type: array
              items:
                $ref: '#/components/schemas/Treatment'
            medicines:
              type: array
              items:
                $ref: '#/components/schemas/Medicine'
            total_amount:
              type: integer

    Treatment:
      type: object
      properties:
        id:
          type: string
        treatment_item_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: integer
        total_price:
          type: integer

    Medicine:
      type: object
      properties:
        medicine_id:
          type: integer
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        days:
          type: integer

    ReservationType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          format: color
        sort_order:
          type: integer
        is_active:
          type: boolean

    TreatmentItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        unit_price:
          type: integer
        tax_rate:
          type: integer
        is_active:
          type: boolean

    Staff:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        occupation:
          type: string
        clinic_assignments:
          type: array
          items:
            type: object
            properties:
              clinic_id:
                type: integer
              clinic_name:
                type: string
              is_primary:
                type: boolean
        is_active:
          type: boolean

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
        request_id:
          type: string

  responses:
    UnauthorizedError:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenError:
      description: 権限がありません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequestError:
      description: 不正なリクエスト
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundError:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT トークン（HttpOnly Cookie または Authorization ヘッダ）
