# docker-compose override: adds the seed-old-db one-shot service.
#
# Usage (from AnimalEkarte repo root):
#   OLD_DB_MIGRATION_OUTPUT_DIR=/path/to/old_db/sensitive-local/migration-output \
#   docker compose -f docker-compose.yml -f docker-compose.seed-old-db.yml run --rm seed-old-db
#
# Or via: make seed-old-db (sets default path automatically)
#
# Safety: the seed-old-db binary refuses to run against any DB_HOST that is
# not "db", "localhost", or "127.0.0.1".

services:
  seed-old-db:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    networks:
      - ekarte-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
      # Mount old_db output read-only. Path is resolved from the env var at
      # compose invocation time (set by the Makefile or caller).
      - ${OLD_DB_MIGRATION_OUTPUT_DIR:-/tmp/old-db-data-not-set}:/old-db-data:ro
      # Mount old_db docs so the manifest JSON is accessible at its derived path
      - ${OLD_DB_DOCS_DIR:-/tmp/old-db-docs-not-set}:/old-db-docs:ro
    env_file:
      - .env.local
    environment:
      TZ: Asia/Tokyo
      DB_HOST: db
      DB_PORT: 5432
      OLD_DB_MIGRATION_OUTPUT_DIR: /old-db-data
      OLD_DB_MANIFEST_PATH: /old-db-docs/generated/new-schema-import-manifest.json
    entrypoint: ["sh", "-c", "go run ./cmd/seed-old-db"]
    restart: "no"
