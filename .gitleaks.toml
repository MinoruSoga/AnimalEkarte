title = "AnimalEkarte gitleaks config"

# C-1: CI secret scan（.github/workflows/ci.yml の secret-scan job）が参照する設定。
# デフォルトルールセットを継承しつつ、実害のないダミー値のみを対象パスで allowlist する。
# 実シークレット（.env.staging の JWT_SECRET/DB_PASSWORD/INTEGRATION_ENCRYPTION_KEY）は
# 意図的に allowlist しない — untrack（C-1 手順3）と H-5（SSM 移行）が完了するまでゲートの
# 対象として残し、誤って再露出させた場合に検知できるようにする。

[extend]
useDefault = true

[allowlist]
description = "既知のダミー値のみを含むドキュメント/テストフィクスチャ（実シークレットなし）"
paths = [
  '''backend/docs/api-examples\.md''',                                  # curl コマンド例の Bearer トークンはプレースホルダ
  '''backend/internal/config/config_validate_test\.go''',                 # config バリデーションのテスト用ダミー API キー
  '''backend/internal/service/line_reservation_setting_service_test\.go''', # LINE 連携設定のテスト用ダミー値
  '''backend/internal/service/line_credentials_test\.go''',               # LINE 資格情報ヘルパーの合成ダミー
  # 旧 003_seed_demo.sql は CSV 移行で廃止。003_demo CSV のシークレット列は空/合成ダミーのみ
]

# Reviewed documentation evidence digests, not API keys. Keep other values detectable.
# Preserve the inherited generic-api-key detector; restrict exceptions by path AND exact digest.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified SHA-256 file digests in BASELINE.json"
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/work/docs-perfection/EVIDENCE/BASELINE\.json$''']
regexes = [
  '''^15d4b1e2368ba9034b4535e6a633b654c351db56a62b7ebf44afe0732166bff6$''',
  '''^4fcf30c8df3f3b13c070df66307d0edd738e13edae4afc4560ed36aaf0faa36e$''',
  '''^7f6cf6aad0cef0ec81086858e9519b86210fb334acaa449c51799c4e96932820$''',
]

