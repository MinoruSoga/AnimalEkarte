# docker-compose override: adds the stage-import one-shot service.
#
# stage-import reads validated old_db migration data from the animalekarte_stage
# schema (in old_db's separate `ani_legacy` Postgres, container old-db-postgres)
# and imports it into the local AnimalEkarte本テーブル. It replaces the deprecated
# direct old-db seeder (docker-compose.seed-old-db.yml).
#
# Reaching BOTH databases: the importer joins TWO networks — ekarte-network (for
# the target `db`) and old_db_default (external, for `old-db-postgres`). Create
# the old_db container first with `make local-postgres-up` in the old_db repo so
# the external network exists.
#
# Usage (from AnimalEkarte repo root):
#   # dry-run (default, no writes):
#   docker compose -f docker-compose.yml -f docker-compose.stage-import.yml run --rm stage-import
#   # apply (destructive: deletes + reloads old_db rows in the LOCAL target):
#   docker compose -f docker-compose.yml -f docker-compose.stage-import.yml run --rm \
#     stage-import --apply --confirm-local-destroy
#
# Or via: make stage-import-dry-run / make stage-import
#
# Safety: stage-import refuses any non-local TARGET DB_HOST; the stage connection
# is opened read-only; apply requires BOTH --apply and --confirm-local-destroy.

services:
  stage-import:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    networks:
      - ekarte-network
      - old-db-net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    env_file:
      - .env.local
    environment:
      TZ: Asia/Tokyo
      DB_HOST: db
      DB_PORT: 5432
      # Stage source (old_db's ani_legacy Postgres). Reachable by service name on
      # the external old_db_default network. The old_db container requires a
      # password for TCP connections (POSTGRES_PASSWORD); pass it through as
      # STAGE_DB_PASSWORD at invocation (the Makefile target wires this from the
      # operator's OLD_DB_POSTGRES_PASSWORD). The stage connection is read-only.
      STAGE_DB_HOST: old-db-postgres
      STAGE_DB_PORT: 5432
      STAGE_DB_USER: postgres
      STAGE_DB_NAME: ani_legacy
      STAGE_DB_PASSWORD: ${OLD_DB_POSTGRES_PASSWORD:-}
    entrypoint: ["go", "run", "./cmd/stage-import"]
    restart: "no"

networks:
  # old_db's compose network, joined as external so the importer can reach
  # old-db-postgres. Its real name is old_db_default (see `docker network ls`).
  old-db-net:
    external: true
    name: old_db_default
