version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  # cmd/seed-old-db は旧DB→新スキーマの一回限り移行CLIのため、gofmt/goimports の
  # 整形チェックを緩和する（本番サーバコードの整形は維持）。
  exclusions:
    paths:
      - cmd/seed-old-db/
  settings:
    goimports:
      local-prefixes:
        - github.com/animal-ekarte/backend

linters:
  default: none
  enable:
    # デフォルト（gosimple は v2 で staticcheck に統合済み）
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # 追加推奨
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
    - errorlint      # エラーハンドリング改善
    - nilerr         # nilエラーチェック
    - contextcheck   # Context伝播チェック
    - wrapcheck      # エラーラッピングチェック

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # 2026-09-02 150行分割: composition/DTO を値で束ねた結果、hugeParam /
        # unnamedResult / rangeValCopy が数百件量産される。ポインタ化は別タスク。
        - hugeParam
        - unnamedResult
        - rangeValCopy

    revive:
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
        # WithX オプションが unexported option 型を返すのはこの repo の既存 DI パターン。
        - name: unexported-return
          disabled: true
        # gin.Context と request Context を両方取る handler 補助は c が先になる。
        - name: context-as-argument
          disabled: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gosec:
      excludes:
        - G104  # エラー無視（errcheckでカバー）

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        # 閉包内は apperrors で wrap 済み。Transaction/WithTx/Join 自体の戻りは begin/commit
        # 失敗か複数 error の合成であり、機械分割で薄い helper がそのまま返す。
        - errors.Join(
        - .Transaction(
        - .WithTx(
        # インフラ境界。error の動的型（net.Error / bcrypt.ErrMismatched /
        # context.Canceled / http.ErrBodyNotAllowed）を保つため wrap しない。
        - bcrypt.CompareHashAndPassword(
        - net.SplitHostPort(
        - .LookupIPAddr(
        - .DialContext(
        - smtp.NewClient(
        - .Hello(
        - .StartTLS(
        - json.Unmarshal(
        - .Encode(
        - filepath.WalkDir(
        - http.NewRequestWithContext(
        - (*net/http.Client).Do(
        - (net/http.ResponseWriter).Write(
        - (context.Context).Err(
        # 予約バリデータは既に AppError を返す。呼び出し側での %w は同義の二重ラップになる。
        - .ValidateReservationOwnerPetLinksWithRepo(
        - .ValidateReservationStaffCapability(
        - .ValidateReservationTypeAvailableTime(
        - .ValidateReservationPetNotDeceased(
        - .ValidateTrimmingAppointmentMutable(
        - .CheckSlotConflict(
        - .CheckReservationTypeCapacity(
      # wrapcheck はインターフェースの短名（Transactor, XxxRepository）にマッチする。
      # Domain 内の repository/transactor は apperrors を返すため、素通し return err
      # に機械 wrap を足すと AppError を二重ラップするだけなので全インターフェースを除外する。
      ignore-interface-regexps:
        - .+
      ignore-package-globs:
        # Campaign-touched packages stay on wrapcheck: staff, reservation, billing,
        # inventory, lstep, medicalrecord, owner, pet, clinic, auth.
        - github.com/animal-ekarte/backend/internal/apicontract
        - github.com/animal-ekarte/backend/internal/apperrors
        - github.com/animal-ekarte/backend/internal/audit
        - github.com/animal-ekarte/backend/internal/authjwt
        - github.com/animal-ekarte/backend/internal/config
        - github.com/animal-ekarte/backend/internal/csvimport
        - github.com/animal-ekarte/backend/internal/dbconn
        - github.com/animal-ekarte/backend/internal/httpapi
        - github.com/animal-ekarte/backend/internal/identitylink
        - github.com/animal-ekarte/backend/internal/infra
        - github.com/animal-ekarte/backend/internal/infra/*
        - github.com/animal-ekarte/backend/internal/labdeviceagent
        - github.com/animal-ekarte/backend/internal/lintscan
        - github.com/animal-ekarte/backend/internal/logger
        - github.com/animal-ekarte/backend/internal/manualarticle
        - github.com/animal-ekarte/backend/internal/middleware
        - github.com/animal-ekarte/backend/internal/model
        - github.com/animal-ekarte/backend/internal/persistence
        - github.com/animal-ekarte/backend/internal/scheduler
        - github.com/animal-ekarte/backend/internal/seedbundle
        - github.com/animal-ekarte/backend/internal/sharedkernel
        - github.com/animal-ekarte/backend/internal/testdb
        - github.com/animal-ekarte/backend/internal/textsearch
        - github.com/animal-ekarte/backend/internal/timeutil
        - github.com/animal-ekarte/backend/internal/trimming

  exclusions:
    rules:
      # テストファイルは一部緩和
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - errcheck
          # テストヘルパは context.Background() でフィクスチャを生成するため
          # contextcheck は false positive（*gin.Context が context.Context を内包するため）。
          - contextcheck
          # テストヘルパは可読性のため意図的に柔軟なシグネチャ（clinic/exam ID を明示
          # param で受ける・現状の呼び出しが一様・返り値を呼び出し側が破棄）を持つ。
          # unparam の「常に同値 param / 未使用 result」は prod 向け API 最小化ルールで、
          # fixture を magic number 化させるだけなので test では緩和する
          # （gosec/wrapcheck/errcheck と同じ test 緩和方針）。
          - unparam
          # テストの fixture シグネチャは context を第1引数にできないことが多い。
          - revive
          # テストの事前確保・未使用 stub・計算コメントは本番 API 最小化の対象外。
          - prealloc
          - gocritic
          - unused
          - staticcheck
          - ineffassign
          - nilerr
          - unconvert

      # main.goはwrapcheck緩和
      - path: cmd/
        linters:
          - wrapcheck

      # cmd/seed-old-db: 旧DB→新スキーマの一回限り移行CLIツール（本番サーバではない）。
      # 一回実行のバッチに perf/style 系 linter は過剰なため緩和する。
      #   gocritic : hugeParam/rangeValCopy/whyNoLint/unnamedResult（144B の ManifestEntry 値渡し等の micro-opt）
      #   prealloc : スライス事前確保（同上）
      - path: cmd/seed-old-db/
        linters:
          - gocritic
          - prealloc

      # gosec/staticcheck は本質的なバグ検出を維持し、誤検知・style の該当ルールのみ個別抑制する。
      #   gosec G703         : manifest 指定のローカル開発用パス（信頼境界内）に対する path traversal 誤検知
      #   staticcheck QF1001 : De Morgan 変換提案（style quickfix のみ。SA系バグ検出は維持）
      - path: cmd/seed-old-db/
        text: "G703"
        linters:
          - gosec
      - path: cmd/seed-old-db/
        text: "QF1001"
        linters:
          - staticcheck

      # Gin middleware / cmd/api composition: *gin.Context が context.Context を
      # 内包するため contextcheck は false positive（c.Request.Context() で伝播済み）。
      # flatten 前は internal/handler/ を除外していた。composition へ移した同等経路。
      - path: internal/middleware/
        linters:
          - contextcheck
      - path: cmd/api/
        linters:
          - contextcheck

      - path: cmd/lstep-migrate/
        linters:
          - gocritic
          - prealloc
      - path: cmd/lab-device-agent/
        linters:
          - gocritic
          - contextcheck
      - path: cmd/stg-uat-skeleton/
        linters:
          - gocritic
          - unused
          - errorlint
      - path: cmd/stg-uat-staff-attach/
        linters:
          - ineffassign
      - path: cmd/csv-import
        linters:
          - gocritic
          - prealloc
          - gosec
      - path: cmd/csv-import-stg-uat
        linters:
          - gocritic
          - prealloc
          - gosec
      - path: cmd/csv-import-failure-rehearsal
        linters:
          - gocritic
          - prealloc
          - gosec
      - path: internal/csvimport/
        linters:
          - gocritic
          - wrapcheck
          - prealloc
          - gosec

      # testdb は ignore-package-globs 済み（呼び出し側）。パッケージ内の sql.Conn 素通しも対象外。
      - path: internal/testdb/
        linters:
          - wrapcheck

issues:
  # 2026-06-30: max-same-issues:10 により11件目以降の同種issueがCI上で隠蔽される事故を経験した
  # (27件一括解消 ci_lint_26_to_0_complete 参照)。真の正本gateは無制限。cap を再導入しない。
  max-issues-per-linter: 0
  max-same-issues: 0
