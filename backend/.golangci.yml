version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/animal-ekarte/backend

linters:
  default: none
  enable:
    # デフォルト（gosimple は v2 で staticcheck に統合済み）
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # 追加推奨
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
    - errorlint      # エラーハンドリング改善
    - nilerr         # nilエラーチェック
    - contextcheck   # Context伝播チェック
    - wrapcheck      # エラーラッピングチェック

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        hugeParam:
          sizeThreshold: 128

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: unexported-return

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gosec:
      excludes:
        - G104  # エラー無視（errcheckでカバー）

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
      ignore-package-globs:
        - github.com/animal-ekarte/backend/internal/*

  exclusions:
    rules:
      # テストファイルは一部緩和
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - errcheck

      # main.goはwrapcheck緩和
      - path: cmd/
        linters:
          - wrapcheck

      # Gin handler/middleware 層: *gin.Context が context.Context を内包するため
      # contextcheck は false positive を出す（c.Request.Context() で正しく伝播済み）
      - path: internal/handler/
        linters:
          - contextcheck
      - path: internal/middleware/
        linters:
          - contextcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
