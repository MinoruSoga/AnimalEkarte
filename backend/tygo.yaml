packages:
  - path: "github.com/animal-ekarte/backend/internal/model"
    output_path: "/output/models.ts"
    # FE6-1: 生成定数の型 widen（typeof 定数 が string に潰れ「退化 union」化する問題）を解消。
    # union は const 宣言の値自体は維持したまま、型を `export type X = typeof A | typeof B | ...` の
    # 真の literal union として再出力する（値エクスポートに破壊的変更なし）。
    enum_style: "union"
    # FE6-1: lab_report.go の3型（LabExamReportSummary/Detail/ResultItem）は P7 準拠で
    # json タグが handler 側の非公開 response struct（lab_report_response.go）へ移設済みのため、
    # model パッケージ自体の構造体には json タグが無い。tygo は無タグ時に Go フィールド名を
    # そのまま出力する（PascalCase）ため、ここに含めると実際の wire 形式（snake_case）と
    # 一致しない誤った型が生成される。現状 FE 側に消費者が 0 件であることを確認済み
    # （2026-07-11 grep 実測）。将来必要になった場合は FE6-5 と同じ手法
    # （handler レスポンス struct を export してパッケージ追加生成）で対応すること。
    exclude_files: ["lab_report.go"]
    type_mappings:
      time.Time: "string"
      gorm.DeletedAt: "string | null"
      pq.StringArray: "string[]"
      "uint64": "number"
      "uint": "number"
      "*uint64": "number | null"
      "*string": "string | null"
      "*bool": "boolean | null"
      "*time.Time": "string | null"
      "*float64": "number | null"
    frontmatter: |
      // This file is auto-generated by tygo from backend/internal/model/
      // DO NOT EDIT manually — run `make codegen` to regenerate
  - path: "github.com/animal-ekarte/backend/internal/handler"
    output_path: "/output/handler-responses.ts"
    # FE6-5: MeResponse 等 auth_response.go の型はハンドラ層の export 済み wire DTO
    # （P7 準拠で json タグはこちらが正本）。models.ts の M1（clinics omitempty）のような
    # BE/FE drift を type-check で機械検知できるようにするため生成対象に追加する。
    # handler パッケージの他ファイルは大半が非公開 response struct（P7 準拠の意図的設計 —
    # 187/194 が非公開）であり tygo は export 済み型のみ処理するため、対象を
    # auth_response.go のみに絞る（無関係な型の巻き込みを避ける）。
    # BackendTrimming（trimming_response.go の trimmingResponse）は非公開のため対象外
    # — 生成するには Go 側で型を export する必要があり、これは本ラウンドの
    # 「tygo.yaml/codegen のみ許可・backend 本番コード編集は不可」の範囲外。BLOCKED として
    # FE-refactor.md に記録する。
    include_files: ["auth_response.go"]
    enum_style: "union"
    type_mappings:
      time.Time: "string"
      gorm.DeletedAt: "string | null"
      pq.StringArray: "string[]"
      "uint64": "number"
      "uint": "number"
      "*uint64": "number | null"
      "*string": "string | null"
      "*bool": "boolean | null"
      "*time.Time": "string | null"
      "*float64": "number | null"
    frontmatter: |
      // This file is auto-generated by tygo from backend/internal/handler/ (auth_response.go only)
      // DO NOT EDIT manually — run `make codegen` to regenerate
