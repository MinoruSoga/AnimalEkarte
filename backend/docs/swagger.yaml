host: localhost:8080
info:
  contact: {}
  description: 動物病院 電子カルテシステム API（45テーブル・専用マスタテーブル版）
  title: Animal Ekarte API
  version: "2.0"
paths:
  /accountings:
    get:
      consumes:
      - application/json
      description: 会計（請求）の一覧をページネーション付きで取得する
      parameters:
      - description: 'ページ番号 (default: 1)'
        in: query
        name: page
        type: integer
      - description: '件数 (1-100, default: 20)'
        in: query
        name: limit
        type: integer
      - description: ステータスフィルター
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BillingListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
