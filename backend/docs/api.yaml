    patch:
      operationId: updateAccounting
      summary: 会計更新
      description: >
        部分更新（EMR-63）。省略したフィールドは既存値を保持し、payment 全項目の再送は不要。
        payment_splits を省略した場合は既存の支払い内訳をそのまま保持する。
        billing_amount / insurance_amount は client 値を採用せず server が
        billing_amount = total_amount − insurance_amount − discount_amount から再計算する
        （insurance_amount は正の magnitude。負値は絶対値に正規化）。
        has_insurance=false と非ゼロ insurance_amount の併用、
        請求額変更後に既存内訳合計と請求額が一致しない場合は 400。
      tags: [Accountings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Billing'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
