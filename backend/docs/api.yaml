openapi: "3.0.3"
info:
  title: Animal Ekarte API
  description: |
    動物病院電子カルテシステム API

    ## 認証
    全エンドポイント（`/login`、`/logout` を除く）は `Authorization: Bearer <JWT>` ヘッダーが必要。

    ## ページネーション
    一覧エンドポイントは `page` / `limit` クエリパラメータでページネーション。
    レスポンスは `{ data: [], total: number, page: number, limit: number }` 形式。
  version: "2.0.0"
  contact:
    name: Animal Ekarte
servers:
  - url: http://localhost:8080/api/v1
    description: 開発環境
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ─── Summary schemas (Preload用の軽量オブジェクト) ──────────────
    OwnerSummary:
      type: object
      description: 飼主サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        owner_name:
          type: string
        phone:
          type: string
    AnimalSpeciesSummary:
      type: object
      description: 動物種サマリー
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PetSummary:
      type: object
      description: ペットサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        pet_number:
          type: string
        breed:
          type: string
        animal_species:
          $ref: '#/components/schemas/AnimalSpeciesSummary'
          nullable: true
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          nullable: true
    StaffSummary:
      type: object
      description: スタッフサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CageSummary:
      type: object
      description: ケージサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ServiceTypeSummary:
      type: object
      description: サービス種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    VaccineSummary:
      type: object
      description: ワクチンサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ExamTypeSummary:
      type: object
      description: 検査種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    BillingItem:
      type: object
      description: 会計明細項目
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        category:
          type: string
        name:
          type: string
        unit_price:
          type: number
          format: double
        quantity:
          type: integer
        tax_rate:
          type: number
          format: double
        is_insurance_applicable:
          type: boolean
        source:
          type: string
          enum: [medical_record, hospitalization, manual]
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
    Payment:
      type: object
      description: 支払情報（会計精算時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        subtotal:
          type: number
          format: double
        tax_total:
          type: number
          format: double
        total_amount:
          type: number
          format: double
        insurance_name:
          type: string
        insurance_ratio:
          type: number
          format: double
        insurance_amount:
          type: number
          format: double
        discount_amount:
          type: number
          format: double
        billing_amount:
          type: number
          format: double
        received_amount:
          type: number
          format: double
        change_amount:
          type: number
          format: double
        method:
          type: string
          enum: [cash, credit_card, electronic_money]
          description: 支払方法
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    # ─────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: エラーメッセージ
          example: "resource not found"
    PaginatedResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
    Owner:
      type: object
      required: [owner_name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        owner_name:
          type: string
          description: 飼主名（必須）
        owner_name_kana:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        company:
          type: string
        postal_code:
          type: string
        address1:
          type: string
        address2:
          type: string
        home_postal_code:
          type: string
        home_address1:
          type: string
        home_address2:
          type: string
        phone:
          type: string
        company_phone:
          type: string
        email:
          type: string
          format: email
        remarks:
          type: string
        is_dangerous:
          type: boolean
          default: false
        discount_rate:
          type: number
          format: double
        membership_type:
          type: string
          enum: [non_member, member, deceased, transferred]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        clinic_id:
          type: integer
          description: クリニックID
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        pets:
          type: array
          description: ペット一覧（Preload時のみ含まれる）
          items:
            $ref: '#/components/schemas/Pet'
    Pet:
      type: object
      required: [owner_id, name, animal_species_id]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        owner_id:
          type: integer
          format: int64
        animal_species_id:
          type: integer
          format: int64
        pet_number:
          type: string
          description: カルテ番号（自動採番・PATCH で手動変更可）
        name:
          type: string
          description: ペット名（必須）
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        breed:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        acquisition_type:
          type: string
          enum: [purchased, transferred, rescued, other]
          nullable: true
        danger_level:
          type: string
          enum: [low, medium, high]
        food:
          type: string
        environment:
          type: string
        phone:
          type: string
        last_visit:
          type: string
          format: date
          nullable: true
        insurance_id:
          type: integer
          format: int64
          nullable: true
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        animal_species:
          type: object
          description: 種別情報（Preload時のみ含まれる）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            sort_order:
              type: integer
        insurance:
          type: object
          description: 保険情報（Preload時のみ含まれる）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            coverage_rate:
              type: integer
            contact_phone:
              type: string
        owner:
          type: object
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            owner_name:
              type: string
            phone:
              type: string
    PetListItem:
      type: object
      description: ペット一覧レスポンス（GET /v1/pets 専用・必要最小限フィールド）
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        owner_id:
          type: integer
          format: int64
        animal_species_id:
          type: integer
          format: int64
        pet_number:
          type: string
        name:
          type: string
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        environment:
          type: string
        last_visit:
          type: string
          format: date
          nullable: true
        owner:
          type: object
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            owner_name:
              type: string
            phone:
              type: string
        animal_species:
          type: object
          description: 種別情報（Preload時のみ含まれる）
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            sort_order:
              type: integer
    CreatePetRequest:
      type: object
      required: [owner_id, animal_species_id, name]
      properties:
        owner_id:
          type: integer
          format: int64
        animal_species_id:
          type: integer
          format: int64
        name:
          type: string
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        breed:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        acquisition_type:
          type: string
          enum: [purchased, transferred, rescued, other]
          nullable: true
        danger_level:
          type: string
          enum: [low, medium, high]
        food:
          type: string
        environment:
          type: string
        phone:
          type: string
        insurance_id:
          type: integer
          format: int64
          nullable: true
        remarks:
          type: string
    UpdatePetRequest:
      type: object
      description: PATCH用（全フィールド任意）
      properties:
        owner_id:
          type: integer
          format: int64
        animal_species_id:
          type: integer
          format: int64
        pet_number:
          type: string
          description: カルテ番号（手動変更可）
        name:
          type: string
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        breed:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        acquisition_type:
          type: string
          enum: [purchased, transferred, rescued, other]
          nullable: true
        danger_level:
          type: string
          enum: [low, medium, high]
        food:
          type: string
        environment:
          type: string
        phone:
          type: string
        last_visit:
          type: string
          format: date
          nullable: true
        insurance_id:
          type: integer
          format: int64
          nullable: true
        remarks:
          type: string
    ReservationAppointment:
      type: object
      required: [start_time, end_time, service_type_id]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        start_time:
          type: string
          format: date-time
          description: 開始日時
        end_time:
          type: string
          format: date-time
          description: 終了日時
        owner_id:
          type: integer
          format: int64
          nullable: true
        pet_id:
          type: integer
          format: int64
          nullable: true
        visit_type:
          type: string
          enum: [first, revisit]
        service_type_id:
          type: integer
          format: int64
        doctor_id:
          type: integer
          format: int64
          nullable: true
        is_designated:
          type: boolean
          default: false
        status:
          type: string
          enum: [confirmed, pending, cancelled, checked_in, in_consultation, accounting, completed]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        pet:
          $ref: '#/components/schemas/PetSummary'
          description: ペット情報（owner含む、Preload時のみ含まれる）
          nullable: true
        service_type:
          $ref: '#/components/schemas/ServiceTypeSummary'
          description: サービス種別情報（Preload時のみ含まれる）
          nullable: true
        doctor:
          $ref: '#/components/schemas/StaffSummary'
          description: 担当医師情報（Preload時のみ含まれる）
          nullable: true
    MedicalRecord:
      type: object
      required: [date, record_no]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        record_no:
          type: string
          description: カルテ番号（自動採番）
        date:
          type: string
          format: date
          description: 診察日
        owner_id:
          type: integer
          format: int64
          nullable: true
        pet_id:
          type: integer
          format: int64
          nullable: true
        doctor_id:
          type: integer
          format: int64
          nullable: true
        reservation_appointment_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [draft, finalized]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
        pet:
          $ref: '#/components/schemas/PetSummary'
          description: ペット情報（Preload時のみ含まれる）
          nullable: true
        doctor:
          $ref: '#/components/schemas/StaffSummary'
          description: 担当医師情報（Preload時のみ含まれる）
          nullable: true
        inquiry:
          $ref: '#/components/schemas/Inquiry'
          description: 問診情報（Preload時のみ含まれる）
          nullable: true
    Hospitalization:
      type: object
      required: [owner_id, pet_id, hospitalization_type, start_date, end_date]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        owner_id:
          type: integer
          format: int64
        pet_id:
          type: integer
          format: int64
        hospitalization_type:
          type: string
          enum: [hospitalization, hotel]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [admitted, discharged, reserved]
        cage_id:
          type: integer
          format: int64
          nullable: true
        doctor_id:
          type: integer
          format: int64
          nullable: true
        memo:
          type: string
        owner_request:
          type: string
        staff_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
        pet:
          $ref: '#/components/schemas/PetSummary'
          description: ペット情報（Preload時のみ含まれる）
          nullable: true
        cage:
          $ref: '#/components/schemas/CageSummary'
          description: ケージ情報（Preload時のみ含まれる）
          nullable: true
        doctor:
          $ref: '#/components/schemas/StaffSummary'
          description: 担当医師情報（Preload時のみ含まれる）
          nullable: true
    Billing:
      type: object
      required: [scheduled_date]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        medical_record_id:
          type: integer
          format: int64
          nullable: true
        hospitalization_id:
          type: integer
          format: int64
          nullable: true
        owner_id:
          type: integer
          format: int64
          nullable: true
        pet_id:
          type: integer
          format: int64
          nullable: true
        subtotal:
          type: integer
        tax_total:
          type: integer
        total_amount:
          type: integer
        has_insurance:
          type: boolean
        status:
          type: string
          enum: [waiting, completed, cancelled, pending]
        scheduled_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
          nullable: true
        memo:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
        pet:
          $ref: '#/components/schemas/PetSummary'
          description: ペット情報（Preload時のみ含まれる）
          nullable: true
        items:
          type: array
          description: 会計明細（Preload時のみ含まれる）
          readOnly: true
          items:
            $ref: '#/components/schemas/BillingItem'
        payments:
          type: array
          description: 支払情報（Preload時のみ含まれる）
          readOnly: true
          items:
            $ref: '#/components/schemas/Payment'
    TrimmingRecord:
      type: object
      required: [date, staff_id, course_id]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        date:
          type: string
          format: date
        pet_id:
          type: integer
          format: int64
          nullable: true
        staff_id:
          type: integer
          format: int64
          nullable: true
        course_id:
          type: integer
          format: int64
          nullable: true
        weight:
          type: string
        status:
          type: string
          enum: [completed, reserved, in_progress]
        style_request:
          type: string
        bw:
          type: string
        bw_unit:
          type: string
          enum: [Kg, g]
        bt:
          type: string
        used_shampoo:
          type: string
        used_ribbon:
          type: string
        remarks:
          type: string
        style_image:
          type: string
        completed_image:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        pet:
          $ref: '#/components/schemas/PetSummary'
          description: ペット情報（owner含む、Preload時のみ含まれる）
          nullable: true
        staff:
          $ref: '#/components/schemas/StaffSummary'
          description: 担当スタッフ情報（Preload時のみ含まれる）
          nullable: true
    InventoryItem:
      type: object
      required: [name, category, unit]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        category:
          type: string
          enum: [medicine, consumable, food, other]
        quantity:
          type: integer
        unit:
          type: string
        min_stock_level:
          type: integer
        location:
          type: string
        expiry_date:
          type: string
          format: date
          nullable: true
        supplier:
          type: string
        last_restocked:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [sufficient, low, out_of_stock]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Staff:
      type: object
      required: [name, staff_role]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        is_active:
          type: boolean
          default: true
        staff_role:
          type: string
          enum: [veterinarian, nurse, trimmer, reception, manager]
        job_title_id:
          type: integer
          format: int64
          nullable: true
        license_number:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
