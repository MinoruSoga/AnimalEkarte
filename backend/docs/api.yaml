  /medical-records/{id}/billing-confirmation/confirm:
    post:
      operationId: confirmBillingConfirmation
      summary: 会計医師確認
      description: 確認者は認証済みスタッフコンテキストから決定され、request body では指定しない
      tags: [MedicalRecords]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                memo:
                  type: string
                  maxLength: 1000
                  description: 前後の空白を除去した会計確認メモ
      responses:
        '200':
          description: 確認成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /medical-records/{id}/billing-confirmation/return:
    post:
      operationId: returnBillingConfirmation
      summary: 会計差し戻し
      description: 差し戻し者は認証済みスタッフコンテキストから決定され、request body では指定しない
      tags: [MedicalRecords]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - return_reason
              properties:
                return_reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  pattern: '\S'
                  description: 前後の空白を除去後、空白以外を1文字以上含む差し戻し理由
                memo:
                  type: string
                  maxLength: 1000
                  description: 前後の空白を除去した差し戻しメモ
      responses:
        '200':
          description: 差し戻し成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
