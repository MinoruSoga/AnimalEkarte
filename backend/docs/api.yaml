    # EMR-461 form-only ID read and cage-write fields (not the EMR-499 lifecycle core).
    # Sources: hospitalization/lifecycle.md#cage-available-selection-20261019,
    # docs/design/domains/hospitalization/technical-spec.md#stay-core-cage-handoff-20261020.
    HospitalizationCageSummary:
      type: object
      description: 461用の入院応答内ケージsummary。ID表現だけをlossless化し、他用途のCageSummaryは変更しない。
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        name: { type: string }
    HospitalizationCageCurrentAssignment:
      type: object
      additionalProperties: false
      required: [state, cage_id]
      description: >-
        編集対象の現在割当表示。known+NULLは未割当、unknown+NULLは再構成不能であり未割当の証明ではない。
        候補外・無効・連結後の旧構成員という理由だけで現値を消さない。候補集合とは独立。
      oneOf:
        - properties:
            state: { enum: [known] }
        - properties:
            state: { enum: [unknown] }
            cage_id: { type: string, nullable: true, enum: [null] }
      properties:
        state: { type: string, enum: [known, unknown] }
        cage_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
    HospitalizationCageOccupancyRead:
      type: object
      additionalProperties: false
      required: [clinic_id, exclude_hospitalization_id, state, occupied_cage_ids, candidate_cage_ids, current_assignment]
      description: |
        応答専用の最小ID projection。全IDは先頭ゼロなし正数十進文字列で、Numberへ変換せず入力へ往復する。
        serverはPostgreSQL bigintの1..9223372036854775807を厳密検査し、不正形式/範囲外は400。
        DB行・患者/飼主/滞在明細・movement event・内部lock情報は返さない。
        clinic_idとexclude_hospitalization_idは要求contextのecho。clientは医院/編集対象/要求世代を照合し、
        切替後の遅延応答を破棄する。除外IDはhospitalization IDでありStayCaseIDと同一視しない。
        occupiedは自己除外後の占有ケージID（構成員も含む）、candidateは空きと確認済みの同院有効な
        独立/代表ケージIDだけ。代表groupに他滞在の占有が一つでも残れば候補にしない。
        現在割当は別fieldで返し、現値の保持を新規候補への追加許可としない。
        knownなら両配列は非NULLで全件。unknownなら両配列NULL（[]や部分集合で空きを示さない）。
        known+[]のみ当該集合の0件。空き確認は予約/確保ではなく保存時再検査が必要。
        current_assignmentは新規contextではNULL、編集contextでは状態付きobject（core不明でも現割当を保持可能）。
      oneOf:
        - properties:
            state: { enum: [known] }
            occupied_cage_ids: { type: array }
            candidate_cage_ids: { type: array }
        - properties:
            state: { enum: [unknown] }
            occupied_cage_ids: { type: array, nullable: true, enum: [null] }
            candidate_cage_ids: { type: array, nullable: true, enum: [null] }
      allOf:
        - oneOf:
            - properties:
                exclude_hospitalization_id: { type: string, nullable: true, enum: [null] }
                current_assignment: { type: object, nullable: true, enum: [null] }
            - properties:
                exclude_hospitalization_id: { type: string, pattern: '^[1-9][0-9]*$' }
                current_assignment: { $ref: '#/components/schemas/HospitalizationCageCurrentAssignment' }
      properties:
        clinic_id: { type: string, pattern: '^[1-9][0-9]*$' }
        exclude_hospitalization_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
        state: { type: string, enum: [known, unknown] }
        occupied_cage_ids:
          type: array
          nullable: true
          uniqueItems: true
          items: { type: string, pattern: '^[1-9][0-9]*$' }
        candidate_cage_ids:
          type: array
          nullable: true
          uniqueItems: true
          items: { type: string, pattern: '^[1-9][0-9]*$' }
        current_assignment:
          oneOf:
            - $ref: '#/components/schemas/HospitalizationCageCurrentAssignment'
            - type: object
              nullable: true
              enum: [null]
    HospitalizationCageCreateFields:
      type: object
      description: |
        EMR-461のcreate用ケージfield断片。入院/ホテル全体のDTOや499 core writeを再定義しない。
        cage_id省略/明示NULLは未割当（任意のまま）。正数指定は現在候補であっても保存時再検査。
        expected_cage_*とclear_cage_idはcreateには送らない。0、負数、不正型は400。IDは応答と同じ正数十進文字列で、serverはbigint範囲を検査する。
      properties:
        cage_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
      not:
        anyOf:
          - required: [clear_cage_id]
          - required: [expected_cage_id]
          - required: [expected_cage_is_null]
    HospitalizationCagePatchFields:
      type: object
      description: |
        EMR-461のPATCH用ケージfield断片。未指定とNULLを明確に区別する。
        cage_id省略は維持、cage_idの正数指定は割当要求、明示NULLは400（解除にはclear_cage_id=true）。
        clear_cage_id省略/falseは解除しない。cage_idとclear=trueの併用は400。
        割当/解除にはexpected_cage_id（表示時の正数）またはexpected_cage_is_null=trueの一方だけ必須。
        expected_cage_id=NULL、expected_cage_is_null=false、両期待値、操作なし期待値は400。
        期待割当はロック後の現値と比較するCASであり記事/勤務版や499の根拠版とは別。
        未変更現値が候補外でも自動消去しない。現在割当不明なら期待値をNULLに補完せず割当変更を停止する。
      properties:
        cage_id: { type: string, pattern: '^[1-9][0-9]*$' }
        clear_cage_id: { type: boolean }
        expected_cage_id: { type: string, pattern: '^[1-9][0-9]*$' }
        expected_cage_is_null: { type: boolean, enum: [true] }
      oneOf:
        - not:
            anyOf:
              - required: [cage_id]
              - properties: { clear_cage_id: { enum: [true] } }
                required: [clear_cage_id]
              - required: [expected_cage_id]
              - required: [expected_cage_is_null]
        - allOf:
            - oneOf:
                - required: [cage_id]
                  not:
                    properties: { clear_cage_id: { enum: [true] } }
                    required: [clear_cage_id]
                - required: [clear_cage_id]
                  properties: { clear_cage_id: { enum: [true] } }
                  not: { required: [cage_id] }
            - oneOf:
                - required: [expected_cage_id]
                  not: { required: [expected_cage_is_null] }
                - required: [expected_cage_is_null]
                  not: { required: [expected_cage_id] }
    HospitalizationFormFields:
      type: object
      description: |
        既存入院フォームの非ケージ入力field（互換記録）。応答用HospitalizationやDB行を入力DTOへ流用しない。
        本断片は全field任意で、createに必要なfieldはHospitalizationCreateRequestだけで指定する。
        旧status等の入力互換を499の有効状態判定契約へ転用しない。全stay lifecycleの再設計は対象外。
      properties:
        owner_id: { type: integer, format: int64 }
        pet_id: { type: integer, format: int64 }
        hospitalization_type: { type: string, enum: [hospitalization, hotel] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        next_visit: { type: string, format: date, nullable: true }
        status: { type: string, enum: [admitted, discharged, reserved] }
        doctor_id: { type: integer, format: int64, nullable: true }
        memo: { type: string }
        owner_request: { type: string }
        staff_notes: { type: string }
        is_insurance: { type: boolean, nullable: true }
        insurance_company_name: { type: string, nullable: true }
        insurance_number: { type: string, nullable: true }
    HospitalizationCreateRequest:
      type: object
      description: |
        既存createの入力専用DTO。非ケージfieldの既存必須条件を継承し、461のケージ制約を標準allOfで適用する。
        入力の医院/actorは認証済みscopeから決定する。status等の入力値だけで現在占有を判断しない。
      required: [owner_id, pet_id, hospitalization_type, start_date, end_date]
      allOf:
        - $ref: '#/components/schemas/HospitalizationFormFields'
        - $ref: '#/components/schemas/HospitalizationCageCreateFields'
    HospitalizationPatchRequest:
      type: object
      description: |
        PATCH入力専用DTO。owner/pet/type/start/endは必須ではなく、非送信fieldは更新要求に含まれない。
        cage_idのNULL禁止、明示clear、期待割当CASは標準allOfで適用し、vendor拡張の解釈を前提としない。
        既存buildHospitalizationUpdateが更新fieldを一つも作らない要求は400。空object、未知fieldだけ、
        falseのclearだけやis_insurance=trueだけ（保険詳細/他fieldなし）はno-op。
        memo空文字やis_insurance=false等の明示値は更新fieldとして数える。
        保険系の明示NULLは既存pointer入力と同じく更新fieldに数えず、別の実入力と併用時は保持する。
        DB現値との実差分を必須にする新業務ルールではなく、既存のfield存在検査に合わせる。
        PATCHのdoctor_id/next_visitは明示NULLを400で拒否し、未指定は維持。doctor解除操作は新設しない。
        next_visit設定とclear_next_visit=trueの併用は既存runtime同様400。解除にはclear_next_visit=trueだけを送る。
      properties:
        clear_next_visit: { type: boolean }
        doctor_id: { type: integer, format: int64 }
        next_visit: { type: string, format: date }
      not:
        required: [next_visit, clear_next_visit]
        properties:
          clear_next_visit: { enum: [true] }
      anyOf:
        - required: [owner_id]
        - required: [pet_id]
        - required: [hospitalization_type]
        - required: [start_date]
        - required: [end_date]
        - required: [next_visit]
          properties: { next_visit: { type: string, format: date } }
        - required: [status]
        - required: [doctor_id]
          properties: { doctor_id: { type: integer, format: int64 } }
        - required: [memo]
        - required: [owner_request]
        - required: [staff_notes]
        - required: [is_insurance]
          properties: { is_insurance: { enum: [false] } }
        - required: [insurance_company_name]
          properties: { insurance_company_name: { type: string } }
        - required: [insurance_number]
          properties: { insurance_number: { type: string } }
        - required: [cage_id]
        - required: [clear_cage_id]
          properties: { clear_cage_id: { enum: [true] } }
        - required: [clear_next_visit]
          properties: { clear_next_visit: { enum: [true] } }
      allOf:
        - $ref: '#/components/schemas/HospitalizationFormFields'
        - $ref: '#/components/schemas/HospitalizationCagePatchFields'
    HospitalizationCageWriteConflict:
      type: object
      required: [error, code]
      description: 拒否時は元割当を保持し部分writeなし。error文字列ではなくcodeで処理する。患者情報を返さない。
      properties:
        error: { type: string }
        code: { type: string, enum: [cage_assignment_changed, cage_occupied, occupancy_unknown] }

    # Sources: docs/spec/domains/staff-workforce/README.md, docs/spec/screens/24-shift-calendar.md,
    # docs/design/domains/staff-workforce/technical-spec.md, docs/design/shared/integration-contracts.md.
    # Reference storage/model baseline: e60ba31e86f88e0e0a6a870989ac491fd8872654 (001, #729).
    # Aggregate version for break-only writes is a target; baseline storage does not implement it.
    # EMR-493 selected wire contract; implementation pending. Not a model serialization.
    ShiftWorkBreak:
      type: object
      additionalProperties: false
      required: [starts_at, ends_at]
      description: >-
        勤務内の明示日時。starts_at < ends_at、勤務区間内、他休憩と正の時間幅で重複しない。
        区間は[start,end)。休憩開始ちょうどの予約終了と休憩終了ちょうどの予約開始は非重複。
        templateのbreak_start/break_end（時刻）をこのDTOへ流用しない。
      properties:
        starts_at: { type: string, format: date-time, example: '2026-10-21T01:00:00+09:00' }
        ends_at: { type: string, format: date-time, example: '2026-10-21T02:00:00+09:00' }
    ShiftWorkBreakView:
      type: object
      additionalProperties: false
      required: [starts_at, ends_at, interval_state]
      description: >-
        応答専用。旧休憩の明示日時が未解決ならNULLとunknownを保持し、配列から黙って除外しない。
        knownでは両日時が非NULL。unknownでも判明している片側/両側日時は保持する。
        入力用ShiftWorkBreakと分離し、unknownを保存要求へ流用しない。時刻順序/勤務内包含は別の意味検証。
      oneOf:
        - properties:
            interval_state: { enum: [known] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        - properties:
            interval_state: { enum: [unknown] }
      properties:
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        interval_state: { type: string, enum: [known, unknown] }
    ShiftStaffSelection:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        EMR-493スタッフ選択専用projection。idは勤務のstaff_idと同じ正数十進文字列。
        DBの識別子をJSON数値化する前に文字列化する。旧Staff.idのNumberから変換してはならない。
        通常Staff/アカウント/権限group/職種の公開DTOではなく、職員の新規登録や権限付与もしない。
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        name: { type: string }
    ShiftEntry:
      type: object
      additionalProperties: false
      required: [id, clinic_id, staff_id, date, shift_type, starts_at, ends_at, version, notes, breaks, interval_state, created_at, updated_at]
      description: |
        EMR-493応答専用DTO。選択医院の勤務。start_time/end_timeやDB行を返さない。
        dateは勤務開始側のJST日付。日跨ぎを分割・自動補完しない。
        full/morning/afternoonの名称だけから時間を推測しない。
        interval_state=unknownは勤務または休憩の旧日時が未解決。NULLを休日・勤務可能と扱わず、訂正確認まで保存を停止する。
        knownのoff/paid_leaveは終日非勤務、両日時NULL、breaks=[]。勤務未登録は行不存在でありoffとは別。
        子休憩が一つでもunknownなら親もunknown。親unknownは既知の親日時/子部分値を保持できる。
        旧off等に矛盾日時/休憩が残る場合はunknown表示で保存を停止し、値を黙って削除・正規化しない。
        日時順序や休憩の勤務内包含は意味検証であり、このoneOfが保証するとはしない。
        versionは勤務aggregateの目標CAS版（休憩単独変更も含む）。updated_atやtemplate版で代替しない。
        採用001のentity_version_guardは親業務列変更だけを増分し、version単独更新を拒否する。
        shift_entry_breaksから親版を増分するtriggerはなく、休憩単独変更の契約は採用001だけでは未成立。
        446/466へ限定storage差分を引渡す必要がある。方式は未選定で、このPRではDDLを変更しない。
        休憩単独更新と親/別休憩更新を同じCAS境界で直列化し、内容変更がある保存単位ごとに親版を一度進めること、
        失敗/rollback/同操作再送で余分に増分しないことをstorage引渡しの受入条件とする。
        偽のnotes等の親列更新でtriggerを起動する回避は採用しない。
      x-storage-dependency: EMR-446/466 aggregate-version support for break-only changes (mechanism unselected)
      oneOf:
        - properties:
            interval_state: { enum: [known] }
            shift_type: { enum: [full, morning, afternoon] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            breaks:
              type: array
              items:
                properties:
                  interval_state: { enum: [known] }
        - properties:
            interval_state: { enum: [known] }
            shift_type: { enum: ['off', paid_leave] }
            starts_at: { type: string, nullable: true, enum: [null] }
            ends_at: { type: string, nullable: true, enum: [null] }
            breaks: { type: array, maxItems: 0 }
        - properties:
            interval_state: { enum: [unknown] }
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        clinic_id: { type: string, pattern: '^[1-9][0-9]*$' }
        staff_id: { type: string, pattern: '^[1-9][0-9]*$' }
        staff_name: { type: string }
        date: { type: string, format: date }
        shift_type: { type: string, enum: &id004 [full, morning, afternoon, 'off', paid_leave] }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64, minimum: 1, readOnly: true }
        interval_state: { type: string, enum: [known, unknown], readOnly: true }
        notes: { type: string }
        breaks:
          type: array
          items: { $ref: '#/components/schemas/ShiftWorkBreakView' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateShiftRequest:
      type: object
      additionalProperties: false
      required: [operation_key, staff_id, date, shift_type, starts_at, ends_at, breaks, notes]
      description: |
        EMR-493。全入力を明示しNULL/未指定を同一視しない。notesの空文字とbreaks=[]は有効。
        staff_idはGET /masters/staffs?projection=shift-selectionのidおよびShiftEntry.staff_idと同じ正数十進文字列。JS Numberへ変換せずread→createへ渡す。
        serverは1..9223372036854775807のbigint範囲を厳密検査し、不正形式/範囲外は400。
        full/morning/afternoonは両日時必須・非NULL、starts_at < ends_at、dateはstarts_atのJST日付。
        off/paid_leaveは両日時を明示NULL、breaks=[]とする。時刻から翌日を推測しない。
        有効templateは入力値のコピー元のみ。template IDや時刻列を保存要求へ混在させない。
        leave期間のCRUD・複製・CSVは対象外。医院は認証済み選択scope、bodyで切り替えない。
      oneOf:
        - properties:
            shift_type: { enum: [full, morning, afternoon] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        - properties:
            shift_type: { enum: ['off', paid_leave] }
            starts_at: { type: string, nullable: true, enum: [null] }
            ends_at: { type: string, nullable: true, enum: [null] }
            breaks: { type: array, maxItems: 0 }
      properties:
        operation_key: { type: string, format: uuid }
        staff_id: { type: string, pattern: '^[1-9][0-9]*$' }
        date: { type: string, format: date }
        shift_type: { type: string, enum: [full, morning, afternoon, 'off', paid_leave] }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        breaks:
          type: array
          items: { $ref: '#/components/schemas/ShiftWorkBreak' }
        notes: { type: string }
    UpdateShiftRequest:
      type: object
      additionalProperties: false
      required: [operation_key, expected_version]
      description: |
        PATCH。未指定は維持。明示NULLを許すのはstarts_at/ends_atだけ（終日非勤務への変更時に両方指定）。
        breaksは配列全置換、[]は全休憩解除、NULLは400。notesは空文字で解除、NULLは400。
        変更後の全体にCreateShiftRequestと同じ日時・終日非勤務条件を適用する。
        勤務から非勤務へはshift_type・両日時NULL・breaks=[]を明示する。
        非勤務から勤務へはshift_type・両日時を明示する。staff_id/date/clinic_idの付替えは受け付けない。
        1つ以上の業務fieldを必要とする。版不一致は409、入力案を保持し最新状態を別読取して再確認する。
      minProperties: 3
      properties:
        operation_key: { type: string, format: uuid }
        expected_version: { type: integer, format: int64, minimum: 1 }
        shift_type: { type: string, enum: [full, morning, afternoon, 'off', paid_leave] }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        breaks:
          type: array
          items: { $ref: '#/components/schemas/ShiftWorkBreak' }
        notes: { type: string }
    ShiftMutationReceipt:
      type: object
      additionalProperties: false
      required: [operation_key, intent, shift_id, resulting_version, shift]
      description: |
        保存と同じtransactionの確定結果。shiftはその操作で確定したDTO、後日の最新値ではない。
        deleteはshift=NULL、resulting_version=NULL（削除後の架空版を作らない）。
        create/updateはshiftとresulting_versionが非NULLで一致する。新規版は1、更新の内容変更時に版を進める。
        resulting_version=shift.versionとshift_id=shift.idはserver/clientの意味検証で照合し、JSON Schemaだけで一致を保証したとしない。
      oneOf:
        - properties:
            intent: { enum: [delete] }
            resulting_version: { type: integer, nullable: true, enum: [null] }
            shift: { type: object, nullable: true, enum: [null] }
        - properties:
            intent: { enum: [create, update] }
            resulting_version: { type: integer, format: int64, minimum: 1 }
            shift: { $ref: '#/components/schemas/ShiftEntry' }
      properties:
        operation_key: { type: string, format: uuid }
        intent: { type: string, enum: [create, update, delete] }
        shift_id: { type: string, pattern: '^[1-9][0-9]*$' }
        resulting_version: { type: integer, format: int64, minimum: 1, nullable: true }
        shift:
          oneOf:
            - $ref: '#/components/schemas/ShiftEntry'
            - type: object
              nullable: true
              enum: [null]
    ShiftOperationResult:
      type: object
      additionalProperties: false
      required: [operation_key, state, receipt]
      description: succeededはreceipt非NULL、unknownはNULL。unknownは未実行・失敗・不存在の証明ではない。
      oneOf:
        - properties:
            state: { enum: [succeeded] }
            receipt: { $ref: '#/components/schemas/ShiftMutationReceipt' }
        - properties:
            state: { enum: [unknown] }
            receipt: { type: object, nullable: true, enum: [null] }
      properties:
        operation_key: { type: string, format: uuid }
        state: { type: string, enum: [succeeded, unknown] }
        receipt:
          oneOf:
            - $ref: '#/components/schemas/ShiftMutationReceipt'
            - type: object
              nullable: true
              enum: [null]
    ShiftContractError:
      type: object
      required: [error, code]
      description: |
        codeで処理しerror文字列を分岐に使わない。競合時は勤務・休憩・必要監査・結果を全て未反映。
        protected_bookingsでは認可済み対象予約だけを返す。権限不足なら予約詳細を漏らさず403。
        他院重複は相手医院名と重複時間だけを返し、患者・他院勤務全体を開示しない。
        required詳細fieldは閲覧認可を拡大しない。必要詳細の閲覧権限がなければ既存403で拒否し、
        この409 schemaを満たすために予約/他院情報を漏らしたり、無権限の空一覧を作ったりしない。
      oneOf:
        - required: [protected_bookings]
          properties:
            code: { enum: [protected_bookings] }
            protected_bookings: { type: array, minItems: 1 }
        - required: [conflicting_clinic_name, overlap_starts_at, overlap_ends_at]
          properties:
            code: { enum: [cross_clinic_overlap] }
        - properties:
            code: { enum: [version_conflict, operation_key_reused, shift_exists, source_unresolved] }
      properties:
        error: { type: string }
        code:
          type: string
          enum: [version_conflict, operation_key_reused, shift_exists, cross_clinic_overlap, protected_bookings, source_unresolved]
        conflicting_clinic_name: { type: string }
        overlap_starts_at: { type: string, format: date-time }
        overlap_ends_at: { type: string, format: date-time }
        protected_bookings:
          type: array
          items:
            type: object
            required: [appointment_id, starts_at, ends_at, patient_label, reservation_type_label]
            properties:
              appointment_id: { type: string, pattern: '^[1-9][0-9]*$' }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              patient_label: { type: string }
              reservation_type_label: { type: string }

