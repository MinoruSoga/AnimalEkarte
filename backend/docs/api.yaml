    post:
      operationId: detachLabDeviceJob
      summary: 受信のペット紐付けを取り消す
      description: ResourceLabImport edit。persisted job は import 由来 draft 検査の guarded retraction に成功した場合のみ、同一 transaction で検査を retract して未紐付けへ戻す。検査が安全に retract できない場合は 409 かつ write ゼロ。reverted job は detach しない。
