    # ─── Manual articles (医院共通マニュアル・clinic_id なし) ──────────
    # Sources: docs/spec/domains/internal-manual/README.md,
    # docs/design/domains/internal-manual/technical-spec.md#manual-selected-save-contract.
    # EMR-502 existing article edit wire contract. Publish/restore implementations are separate.
    ManualArticleContent:
      type: object
      additionalProperties: false
      required: [title, order_value, section, body_markdown]
      description: >-
        表示/履歴内容の値object。field存在と文字列の長さを区別し、未承認の文字数上限を追加しない。
        編集要求の全置換・非NULL・title/section空文字拒否は入力専用ManualArticleEditContentへ分離する。
        公開/過去版の応答も旧空本文/長文をそのまま表現できる。
        order_valueはnumeric(10,2)に表現可能な値。digestはserverがこの内容から算出し、clientで再構成しない。
      properties:
        title: { type: string }
        order_value: { type: number, multipleOf: 0.01, minimum: -99999999.99, maximum: 99999999.99 }
        section: { type: string }
        body_markdown: { type: string }
    ManualArticleEditContent:
      type: object
      description: |
        編集入力専用。既存manualarticle/service.goのTitle/Section == ""拒否を保持する。
        title/sectionは空文字を400で拒否するが、新たなtrimや空白のみ拒否・文字数上限は追加しない。
        body_markdownの空文字拒否は追加しない。旧空値/長文を含む公開/過去版はManualArticleContentで表現する。
      allOf:
        - $ref: '#/components/schemas/ManualArticleContent'
        - type: object
          properties:
            title: { type: string, minLength: 1 }
            section: { type: string, minLength: 1 }
    ManualArticleVersion:
      type: object
      additionalProperties: false
      required: [id, article_id, content_revision, content_digest, source_kind, restored_from_id, content, edited_by_staff_id, edited_at]
      description: |
        応答専用の不変内容版。idは内容版ID、content_revisionは記事内の内容改訂番号。
        article.version（CAS版）とは別。公開だけの操作で内容版を増やさない。
        記事/内容版/復元元IDは先頭ゼロなし正数十進文字列。NULLの未知参照を架空IDへ補完しない。
        全read/request/receiptでJS Numberへ変換せず往復し、serverはPostgreSQL bigintの1..9223372036854775807を検査する。
        restoredは正数の復元元参照、static/override/editedは復元元NULL。
        legacy_unknownはNULLまたは既知の正数参照を保持し、参照だけからsourceを推定したり既知IDを消したりしない。
        source_kindの旧NULLはadapterでlegacy_unknownとして示す。legacy_unknownやNULLのdigest/revisionは未解決出所。架空値で埋めず編集・公開・復元の元にしない。
      oneOf:
        - properties:
            source_kind: { enum: [restored] }
            restored_from_id: { type: string, pattern: '^[1-9][0-9]*$' }
        - properties:
            source_kind: { enum: [static, override, edited] }
            restored_from_id: { type: string, nullable: true, enum: [null] }
        - properties:
            source_kind: { enum: [legacy_unknown] }
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        article_id: { type: string, pattern: '^[1-9][0-9]*$' }
        content_revision: { type: integer, format: int64, minimum: 1, nullable: true }
        content_digest: { type: string, pattern: '^[0-9a-f]{64}$', nullable: true, description: '32byte digestのhex表現。内容一致のtoken、CAS版の代用ではない。' }
        source_kind: { type: string, enum: [static, override, edited, restored, legacy_unknown] }
        restored_from_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
        content: { $ref: '#/components/schemas/ManualArticleContent' }
        edited_by_staff_id: { type: integer, format: int64, nullable: true }
        edited_at: { type: string, format: date-time }
    ManualPublishedVersion:
      type: object
      additionalProperties: false
      required: [id, content_digest, source_kind, content]
      description: |
        公開内容専用projection。編集者staff ID、編集日時、復元元参照等の編集/history情報を公開readへ含めない。
        医院共通の記事内容を読めることは他院staff識別子の閲覧許可ではない。
        内容版ID/digest/出所を公開内容と束縛し、未知digestを捏造しない。公開状態不明overrideは自動公開しない。
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        content_digest: { type: string, pattern: '^[0-9a-f]{64}$', nullable: true }
        source_kind: { type: string, enum: [static, override, edited, restored, legacy_unknown] }
        content: { $ref: '#/components/schemas/ManualArticleContent' }
    ManualArticle:
      type: object
      additionalProperties: false
      required: [id, category, slug, published]
      description: |
        公開READ用DTO（認証済みスタッフ）。医院共通。publishedは公開確定済みの同じ内容版。
        一覧・検索・印刷はこの版ID/内容を使い、未公開current、CAS版、hidden情報を返さない。
        未公開・非表示・不存在は単体404/一覧から除外。取得障害を不存在や静的版への黙ったfallbackにしない。
        static/override adapterでも出所と版を識別し、公開状態不明のoverrideを全員公開しない。
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        category: { type: string, enum: [screens, workflows] }
        slug: { type: string }
        published: { $ref: '#/components/schemas/ManualPublishedVersion' }
    ManualArticleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ManualArticle' }
    ManualArticleEditView:
      type: object
      additionalProperties: false
      required: [id, category, slug, version, current, published_version_id, hidden]
      description: |
        編集権限者限定の応答DTO。versionは記事状態のCAS版（編集・公開・復元・非表示等で進む）。
        currentは現在の編集内容版で、published_version_idとは一致を仮定しない。
        current=NULLや出所未解決なら元内容確認へ戻す。医院は操作認可元であり記事の所有医院ではない。
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        category: { type: string, enum: [screens, workflows] }
        slug: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        current:
          oneOf:
            - $ref: '#/components/schemas/ManualArticleVersion'
            - type: object
              nullable: true
              enum: [null]
        published_version_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
        hidden: { type: boolean }
    UpsertManualArticleRequest:
      type: object
      additionalProperties: false
      required: [operation_key, article_id, expected_version, expected_content_version_id, content]
      description: |
        EMR-502の既存記事edit専用。名称は互換だが不存在の新規upsertはしない（404）。
        path category/slugとarticle_idを同じ対象へ拘束し、違えば409。
        記事/内容版IDは応答と同じ正数十進文字列で受け、JS Number変換しない。範囲外/不正形式は400。
        全field必須・非NULL。Contentを全置換しtitle/bodyの直置きや部分更新を受け付けない。
        expected_versionは記事CAS版、expected_content_version_idは編集開始時のcurrent.id。
        元内容/出所を再構成できない時はsource_unresolvedで停止。clientから版加算・公開pointer指定はできない。
        編集は新内容版・履歴・必須監査・receiptを同一owner transactionで保存する。公開版とhiddenは維持。
        publishは別の明示操作で対象内容版を指定、restoreは保持済み元版から新内容版を作る境界。
        本edit要求にpublish/restoreのフラグや復元元版を混在させない。理由必須欄・承認workflowを新設しない。
      properties:
        operation_key: { type: string, format: uuid }
        article_id: { type: string, pattern: '^[1-9][0-9]*$' }
        expected_version: { type: integer, format: int64, minimum: 1 }
        expected_content_version_id: { type: string, pattern: '^[1-9][0-9]*$' }
        content: { $ref: '#/components/schemas/ManualArticleEditContent' }
    ManualEditReceipt:
      type: object
      additionalProperties: false
      required: [operation_key, article_id, intent, previous_version, resulting_version, content_version_id, content_digest, published_version_id]
      description: |
        業務変更と原子的に確定したreceipt。resulting_version=previous_version+1。
        成功表示は対象articleと版・内容digestの一致時のみ。編集成功は公開成功を意味しない。
        再照会/同一要求の再送では元receiptを返し、後日の最新状態で書き換えない。
        operation_bindings等のDB行・fingerprint・actor_ref・before/after JSONは公開しない。
      properties:
        operation_key: { type: string, format: uuid }
        article_id: { type: string, pattern: '^[1-9][0-9]*$' }
        intent: { type: string, enum: [edit] }
        previous_version: { type: integer, format: int64, minimum: 1 }
        resulting_version: { type: integer, format: int64, minimum: 2 }
        content_version_id: { type: string, pattern: '^[1-9][0-9]*$' }
        content_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        published_version_id: { type: string, pattern: '^[1-9][0-9]*$', nullable: true }
    ManualEditOperationResult:
      type: object
      additionalProperties: false
      required: [operation_key, state, receipt]
      description: succeededはreceipt非NULL、unknownはNULL。unknownは未保存/失敗の確定ではなく入力保持して停止。
      oneOf:
        - properties:
            state: { enum: [succeeded] }
            receipt: { $ref: '#/components/schemas/ManualEditReceipt' }
        - properties:
            state: { enum: [unknown] }
            receipt: { type: object, nullable: true, enum: [null] }
      properties:
        operation_key: { type: string, format: uuid }
        state: { type: string, enum: [succeeded, unknown] }
        receipt:
          oneOf:
            - $ref: '#/components/schemas/ManualEditReceipt'
            - type: object
              nullable: true
              enum: [null]
    ManualEditConflict:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [version_conflict, operation_key_reused, target_mismatch, source_unresolved] }
    ManualArticleVersionListResponse:
      type: object
