      description: lstep-csv-import edit 権限が必要。CSV本体は50MiB、100,000データ行、64列、1セル64KiBまで。1病院1件、APIプロセス全体で2件まで同時実行でき、いずれかの上限を超えた場合は本文を解析せず429を返す。
      tags: [LstepCsvImports]
