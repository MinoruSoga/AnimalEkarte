  # ─── LIFF (BE-refactor G1-2 Phase C) ────────────────────────────────
  # reservation_line_routes.go:72-92 — r.Group("/api/liff/:clinicId") はグローバル
  # Engine 直下に登録され、他エンドポイントの /api/v1 プレフィックスを持たない。
  # このため各パスに Path Item レベルの servers オーバーライドを付与し、
  # グローバル servers(.../api/v1)との二重結合(/api/v1/api/liff/...)を防ぐ。
  /api/liff/{clinicId}/settings:
    servers:
      - url: http://localhost:8080
        description: LIFF公開API(Engine直下、/api/v1 プレフィックス無し)
    get:
      operationId: getLiffSettings
      summary: LIFF公開設定取得
      description: 認証不要(トップページ表示用)。30回/分のレートリミット。
      tags: [LIFF]
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: LIFF公開設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiffSettings'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/liff/{clinicId}/link:
    servers:
      - url: http://localhost:8080
        description: LIFF公開API(Engine直下、/api/v1 プレフィックス無し)
    post:
      operationId: linkLiffAccount
      summary: LINE User ID 紐付け(link_token + line_id_token による自己認証)
      description: 認証不要(自己認証)。10回/分のレートリミット(BE-021)。
      tags: [LIFF]
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiffLinkAccountRequest'
      responses:
        '204':
          description: 紐付け成功。レスポンスボディなし。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: リクエストボディが16KiBの上限を超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: LINE IDトークン検証サービスの応答エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
