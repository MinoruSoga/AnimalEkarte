        master-permission の edit 権限を持つユーザーのみ実行可能。
        system_admin 以外は同一クリニック内のユーザーのみ変更可。
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_ids]
              properties:
                group_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 割り当てるグループ ID のリスト（空配列 = 全グループ解除）
      responses:
        '204':
