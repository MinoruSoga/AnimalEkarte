        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        clinic_id:
          type: integer
          description: クリニックID
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        pets:
          type: array
          description: ペット一覧（Preload時のみ含まれる）
          items:
            $ref: '#/components/schemas/Pet'
    Pet:
      type: object
      required: [owner_id, name, animal_species_id]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        clinic_id:
          type: integer
          format: int64
