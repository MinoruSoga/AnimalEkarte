        '500':
          $ref: '#/components/responses/InternalError'
  /reservations/pets/{petId}/next-visit-intent:
    put:
      operationId: setNextVisitIntent
      summary: ペットの次回予定を登録/更新
      description: |
        EMR-308。ペットの次回予定（tentative appointment）を作成または更新する。
        同一医院・同一ペットの active tentative は1件のみで、既存行があれば更新する。
        tentative は予約枠容量・時間枠競合・通知の対象外。
      tags: [Reservations]
      parameters:
