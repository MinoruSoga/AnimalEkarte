            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LstepCsvImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 病院単位またはAPIプロセス全体の同時実行上限に達している
        '500':
          $ref: '#/components/responses/InternalError'
