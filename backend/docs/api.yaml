  # BE-refactor.md Phase D-1 で解消済み: GET /clinics/{clinic_id}/owners/{id}/lstep/friend-attributes
  # と、同じ co := rg.Group("/clinics/:clinic_id/owners")（handler.go:178）配下の owner ネスト
