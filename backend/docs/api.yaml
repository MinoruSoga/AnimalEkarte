  /accountings/complete:
    post:
      operationId: completeAccounting
      summary: 会計確定（明細一括作成＋支払い確定を単一トランザクションで実行）
      description: >
        BUG-018: 会計・明細・支払い分割を1リクエストで原子的に確定する。
        合計金額は client から受け取らず、server が items から再計算する。
        Idempotency-Key ヘッダで再送を冪等化し、同一キーの再送は新規作成せず既存会計を 200 で返す。
      tags: [Accountings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID 形式の冪等キー。同一キーの再送は既存の会計を返す。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountingRequest'
      responses:
        '200':
          description: 冪等再送。同一 Idempotency-Key で既に確定済みの会計を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '201':
          description: 確定成功
          headers:
            Location:
              description: 作成されたリソースのURL
              schema:
                type: string
                format: uri
                example: /v1/accountings/1234
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >
            競合。次のいずれか:
            - 同一 Idempotency-Key で異なる payload を再送した（ErrorResponse）
            - medical_record_id / hospitalization_id に既存会計がある二重確定（EMR-66）。
              この場合 code=ACCOUNTING_ALREADY_COMPLETED で、
              既存会計が accounting フィールドに同梱される
            - expected_unbilled_revision と現在の unbilled 集約版が不一致（EMR-196）。
              この場合 code=UNBILLED_ITEMS_CHANGED で、
              現在の集約版が unbilled_revision フィールドに同梱される
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                    description: エラーメッセージ
                  code:
                    type: string
                    description: >
                      安定エラーコード（二重確定時は ACCOUNTING_ALREADY_COMPLETED、
                      集約版不一致時は UNBILLED_ITEMS_CHANGED）
                    example: ACCOUNTING_ALREADY_COMPLETED
                  accounting:
                    $ref: '#/components/schemas/Billing'
                  unbilled_revision:
                    type: string
                    description: code=UNBILLED_ITEMS_CHANGED のとき現在の集約版
        '500':
          $ref: '#/components/responses/InternalError'
  /accountings/{id}:
    get:
      operationId: getAccounting
      summary: 会計取得
      tags: [Accountings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 会計情報
          content:
