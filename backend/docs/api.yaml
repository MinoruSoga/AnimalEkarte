    BadRequest:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 認証エラー（JWTトークンが無効または期限切れ）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 権限エラー（操作が許可されていない）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: リソースが既に存在する
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: レート制限を超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: リクエストボディが上限を超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type が application/json ではない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - CookieAuth: []
  - BearerAuth: []
paths:
  /login:
    post:
      operationId: login
      summary: ログイン
      description: メールアドレスとパスワードで認証してJWTトークンを返す
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /logout:
    post:
      operationId: logout
      summary: 旧ログアウト経路（互換 redirect）
      description: |
        キャッシュされた旧クライアント向け互換経路。POST と CSRF ヘッダーを維持する
        `307 Temporary Redirect` で `/auth/refresh/logout` へ転送し、
        Path が狭い refresh Cookie もブラウザから送信させる。
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '307':
          description: refresh Cookie 互換ログアウト経路へ転送
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/auth/refresh/logout
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh/logout:
    post:
      operationId: logoutRefreshCookieCompatible
      summary: ログアウト（refresh Cookie Path 互換）
      description: |
        現行の `/api/v1/auth` Path と旧 `/api/v1/auth/refresh` Path の
        `refresh_token` Cookie を同時に受信し、署名検証済み JTI を失効してから
        認証 Cookie を削除する。旧 Cookie の移行期間を安全に終了するため、
        クライアントの標準ログアウト経路はこちらを使用する。
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      summary: ログインユーザー情報取得
      description: JWTクレームからログインユーザーの詳細情報（所属クリニック・権限含む）を返す
      tags: [Auth]
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      summary: アクセストークンのリフレッシュ
      description: |
        httpOnly Cookie の refresh_token を使って新しい access_token を発行する。
        トークンローテーション（旧 refresh_token の無効化）も実施する。
      tags: [Auth]
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: トークン再発行成功。新しい access_token / refresh_token を Cookie でセット。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: token refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      summary: パスワードリセット申請
      description: |
        メールアドレスを受け取り、パスワードリセットリンクをメール送信する。
        ユーザーが存在しない場合も同じ成功レスポンスを返す（ユーザー列挙攻撃対策）。
        dev 環境はバックエンドログにトークンを出力（メール不要）。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: |
            "If this email is registered, a reset link has been sent."
            （ユーザー存否に関わらず 200 を返す）

  /auth/reset-password:
    post:
      summary: パスワードリセット実行
      description: |
        メールのリンクに含まれるトークンと新パスワードを受け取り、パスワードを更新する。
        トークンは SHA-256 ハッシュで DB 照合。有効期限 30分・ワンタイム。
        成功後は全 refresh_tokens を revoke する。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: パスワードリセット成功
        '400':
          description: トークン無効・期限切れ・使用済み

  /users/me/password:
    put:
      summary: パスワード変更
      description: |
        認証済みユーザーが自分のパスワードを変更する。
        current_password の確認が必須。他ユーザーのパスワードは変更不可。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password:     { type: string, minLength: 8 }
      responses:
        '200':
          description: パスワード変更成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
