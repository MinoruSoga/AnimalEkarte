          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 権限エラー（操作が許可されていない）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: リソースが既に存在する
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - BearerAuth: []
paths:
  /login:
    post:
      operationId: login
      summary: ログイン
      description: メールアドレスとパスワードで認証してJWTトークンを返す
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /logout:
    post:
      operationId: logout
      summary: ログアウト
      description: httpOnly Cookie (`auth_token`) を無効化してログアウトする。Cookie は HttpOnly のため JS から直接削除できないためサーバー側で MaxAge=-1 でクリアする。
      tags: [Auth]
      security: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      summary: ログインユーザー情報取得
      description: JWTクレームからログインユーザーの詳細情報（所属クリニック・権限含む）を返す
      tags: [Auth]
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
