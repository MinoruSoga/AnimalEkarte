  /accountings/complete:
    post:
      operationId: completeAccounting
      summary: 会計確定（明細一括作成＋支払い確定を単一トランザクションで実行）
      description: >
        BUG-018: 会計・明細・支払い分割を1リクエストで原子的に確定する。
        合計金額は client から受け取らず、server が items から再計算する。
        Idempotency-Key ヘッダで再送を冪等化し、同一キーの再送は新規作成せず既存会計を 200 で返す。
      tags: [Accountings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID 形式の冪等キー。同一キーの再送は既存の会計を返す。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountingRequest'
      responses:
        '200':
          description: 冪等再送。同一 Idempotency-Key で既に確定済みの会計を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '201':
          description: 確定成功
          headers:
            Location:
              description: 作成されたリソースのURL
              schema:
                type: string
                format: uri
                example: /v1/accountings/1234
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
