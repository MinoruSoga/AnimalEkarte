  # ─── Shifts ──────────────────────────────────────────────────
  /shifts:
    get:
      operationId: listShifts
      summary: シフト一覧
      x-contract-status: selected
      description: |
        EMR-493。shifts:view。選択医院の勤務を返す。dateは開始側JST日付の年月フィルタ。
        date省略時はJST当月。staff_id省略時は医院内全staff。並び順はdate, staff_id, idの昇順。
        空配列は当該filterの勤務未登録であり、休日・他院勤務なし・勤務可能の証明ではない。
        unknown日時を時刻や休日で補完しない。結果不明のmutationはこの一覧だけで成功判定しない。
      tags: [Shifts]
      parameters:
        - name: date
          in: query
          description: 開始日側JST年月フィルタ（YYYY-MM、省略時はJST当月）
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            example: "2026-03"
        - name: staff_id
          in: query
          description: ShiftEntry.staff_idと同じ正数十進文字列。Number変換せず渡し、serverはbigint範囲外/不正形式を400で拒否する。
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: シフト一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createShift
      summary: シフト作成
      x-contract-status: selected
      description: |
        shifts:createが必要。
        EMR-493選定wire契約。ownerはstaff。認証済み選択医院に拘束し、他医院へ自動再送しない。
        対象staffの所属/有効性、対象勤務の医院、現在grantをserverで検査する。
        勤務・休憩の原子的保存に加え、予約と他院勤務の並行変更を同じ整合性境界で再検査する。
        医院間の正の時間幅の重複は409。移動時間は手動確保し固定1時間や自動補完を加えない。
        勤務短縮・休憩追加・非勤務化・削除で未来/未終了の既指名予約（予定終了超過の診療中を含む）を
        不適格にする場合は409 protected_bookings。自動取消/指名解除/診療終了はしない。
        過去完了だけで永久拒否せず、予約・カルテ・会計履歴を自動改変しない。
        operation_keyはUUID。選択医院・認証actor・intent・対象・業務内容へ拘束する。
        期待版はfingerprintと分離しwrite直前に再検査、成功receipt再返却時も現在認可を再検査する。
        同じkey/同じ業務内容の確定済み操作は元receiptを返し重複効果を作らない。
        同keyで対象/業務内容が異なれば409 operation_key_reused。未成功確定後の期待版変更は現値との比較・明示再確認が必要。
        結果応答喪失や5xxはunknownとして同じkeyの結果照会を行う。照合不能中は入力保持して停止し、
        新keyで再送しない。競合解消・案変更後は最新状態の再確認から別操作を作る。
        この契約はleave/copy/CSV・予約編集・template改訂の契約を追加しない。
      tags: [Shifts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftMutationReceipt'
        '400':
