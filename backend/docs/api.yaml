        '404': { $ref: '#/components/responses/NotFound' }
  /identity-links/pets/{clinic_id}/{pet_id}/treatment-history:
    get:
      operationId: listLinkedTreatmentHistory
      summary: 最小治療履歴（include_linked 時は相関 (clinic_id,pet_id) ペアのみ）
      tags: [IdentityLinks]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: pet_id
          in: path
