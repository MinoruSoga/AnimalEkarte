    get:
      operationId: listManualArticleVersions
      summary: マニュアル記事の編集履歴一覧
      x-contract-status: selected
      description: |
        EMR-502編集元確認の境界。manual-edit:editを現在権限で検査する。
        非公開内容を含むため一般公開READと分離。保持済み内容版を返し、legacy_unknownを補完しない。
        復元は保持済み元版から新内容版を作る別操作。履歴の上書き・削除をしない。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [screens, workflows]
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
