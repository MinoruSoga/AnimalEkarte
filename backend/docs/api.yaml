openapi: "3.0.3"
info:
  title: Animal Ekarte API
  description: |
    動物病院電子カルテシステム API

    ## 認証
    全エンドポイント（`/login`、`/logout` を除く）は httpOnly Cookie (`auth_token`) が必要。
    後方互換のため `Authorization: Bearer <JWT>` ヘッダーも受け付ける（移行完了後に廃止予定）。
    ⚠️ BUG-055: 現在は単一 JWT (24時間)。BE-078 完了後に dual-token (access 15分 + refresh 7日) に移行。

    ## ページネーション
    一覧エンドポイントは `page` / `limit` クエリパラメータでページネーション。
    レスポンスは `{ data: [], total: number, page: number, limit: number }` 形式。
  version: "2.0.0"
  contact:
    name: Animal Ekarte
servers:
  - url: http://localhost:8080/api/v1
    description: 開発環境
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ─── Summary schemas (Preload用の軽量オブジェクト) ──────────────
    OwnerSummary:
      type: object
      description: 飼主サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        owner_name:
          type: string
        phone:
          type: string
    AnimalSpeciesSummary:
      type: object
      description: 動物種サマリー
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PetSummary:
      type: object
      description: ペットサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        pet_number:
          type: string
        breed:
          type: string
        animal_species:
          $ref: '#/components/schemas/AnimalSpeciesSummary'
          nullable: true
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          nullable: true
    StaffSummary:
      type: object
      description: スタッフサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CageSummary:
      type: object
      description: ケージサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ServiceTypeSummary:
      type: object
      description: サービス種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    VaccineSummary:
      type: object
      description: ワクチンサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ExamTypeSummary:
      type: object
      description: 検査種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    BillingItem:
      type: object
      description: 会計明細項目
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        category:
          type: string
        name:
          type: string
        unit_price:
          type: integer
          format: int64
        quantity:
          type: number
          format: float
          description: 数量（小数点1桁まで許容）
        tax_rate:
          type: number
          format: double
        is_insurance_applicable:
          type: boolean
        source:
          type: string
          enum: [medical_record, hospitalization, manual]
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
    Payment:
      type: object
      description: 支払情報（会計精算時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
        tax_total:
          type: integer
          format: int64
        total_amount:
          type: integer
          format: int64
        insurance_name:
          type: string
        insurance_ratio:
          type: number
          format: double
        insurance_amount:
          type: integer
          format: int64
        discount_amount:
          type: integer
          format: int64
        billing_amount:
          type: integer
          format: int64
        received_amount:
          type: integer
          format: int64
        change_amount:
          type: integer
          format: int64
        method:
          type: string
          enum: [cash, credit_card, electronic_money]
          description: 支払方法
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    # ─────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: エラーメッセージ
          example: "resource not found"
    PaginatedResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
    Owner:
      type: object
      required: [owner_name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        owner_name:
          type: string
          description: 飼主名（必須）
        owner_name_kana:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        company:
