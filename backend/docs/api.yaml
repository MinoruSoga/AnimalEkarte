      tags: [Owners, Pets]
      parameters:
        - name: id
          in: path
          required: true
          description: 飼主ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Owner Report 用ペット一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerReportPetsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  # ─── Owner lstep/line management (BE-refactor.md Phase D-1) ─────────
  # owner_handler.go / lstep_lifecycle_handler.go / lstep_tag_handler.go / line_send_handler.go /
  # line_link_handler.go, all registered under handler.go:144 registerOwnerRoutesWithAuth
  # (canonical /owners/:id group). PATCH /owners/{id}/line (ISSUE-001 alias of line-user-id),
  # POST /owners/{id}/lstep/send と GET /owners/{id}/lstep/send-history (ISSUE-002 aliases of
