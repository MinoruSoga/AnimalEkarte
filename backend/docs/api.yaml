  # ─── Manual articles (BE-refactor G1-2 Phase C) ────────────────────
  /manual/articles:
    get:
      operationId: listManualArticles
      summary: マニュアル記事一覧
      x-contract-status: selected
      description: |
        EMR-502接続境界。認証済みスタッフ全員が公開確定版を閲覧可能（manual-edit:viewを前提にしない）。
        医院共通。公開済み・非表示でない記事のみ。同じ公開版ID/Contentで検索・印刷する。
        未公開currentや公開不明overrideを混ぜず、障害時は500（静的版へ黙ってfallbackしない）。
      tags: [Manual]
      responses:
        '200':
          description: マニュアル記事一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualArticleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /manual/articles/{category}/{slug}:
    get:
      operationId: getManualArticle
      summary: マニュアル記事取得
      x-contract-status: selected
      description: |
        EMR-502公開READ境界。認証済みスタッフ全員、manual-edit:view不要。
        公開版だけを返す。未公開・非表示・不存在は404、取得障害は500。
        編集用current/記事CAS版は別の編集権限付きreadを用いる。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [screens, workflows]
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: マニュアル記事
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: upsertManualArticle
      summary: 既存マニュアル記事の編集保存
      x-contract-status: selected
      description: |
        EMR-502既存記事の編集保存。manual-edit:editの現在権限をowner境界で再検査する。
        UpsertManualArticleRequestのContent・元内容版・記事CAS版・対象IDを同一操作へ拘束する。
        operation_keyは選択医院（認可元）・認証actor・intent=editへ束縛。記事そのものは医院共通。
        同一key/同一対象/同一業務内容の確定済み操作は元receiptを返し、版・内容・履歴・監査を重複作成しない。
        期待版/元内容版はfingerprintと分離してwrite前に再検査し、成功receipt再返却時も現在認可を再検査する。
        異なる対象/業務内容へのkey再利用は409 operation_key_reused。期待版不一致は409 version_conflict。
        権限失効は403。必須履歴/監査/receiptの失敗は全rollback、公開版・旧履歴は不変。
        応答喪失や5xxは結果不明。元keyで結果照会し新keyの再保存で救済しない。
        照合不能なら編集案と元版を保持して停止。成功はreceiptの対象/版一致時のみ表示する。
        競合は元案を保持し最新edit viewを別取得、比較・再確認して新しい操作を作る。
        公開・復元の実行endpoint/DTOと新規記事作成はこの単位の対象外。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [screens, workflows]
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertManualArticleRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualEditReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 競合または元情報未解決。業務変更なし。codeで理由を識別する。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualEditConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManualArticle
      summary: マニュアルオーバーライド削除(MD ファイル版に戻す)
      x-contract-status: legacy-out-of-scope
      deprecated: true
      description: >-
        EMR-502既存editの引渡し対象外。旧route記録であり、履歴物理削除の許可ではない。
        非表示/override解除は履歴を保持する選定契約へ別途追従が必要。新edit callerから呼ばない。
        ResourceManualEdit delete 権限が必要。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [screens, workflows]
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
