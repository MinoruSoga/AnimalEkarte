  /shifts/{id}:
    get:
      operationId: getShift
      summary: 勤務の現在状態取得
      x-contract-status: selected
      description: EMR-493。shifts:view、認証済み選択医院内の対象だけを返す。scope外と不存在は共に404。404は操作結果の失敗を証明しない。
      tags: [Shifts]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            応答ShiftEntry.idと同じ先頭ゼロなし正数十進文字列。JS Numberへ変換せずpathへ渡す。
            serverは厳密に整数解析しPostgreSQL bigintの1..9223372036854775807を検査、範囲外/不正形式は400。
            桁数/辞書順だけで存在やscopeを判定しない。
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 最新勤務（編集案を上書きせず比較用に取得する）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateShift
      summary: シフト更新
      x-contract-status: selected
      description: |
        shifts:editが必要。
        EMR-493選定wire契約。ownerはstaff。認証済み選択医院に拘束し、他医院へ自動再送しない。
        対象staffの所属/有効性、対象勤務の医院、現在grantをserverで検査する。
        勤務・休憩の原子的保存に加え、予約と他院勤務の並行変更を同じ整合性境界で再検査する。
        医院間の正の時間幅の重複は409。移動時間は手動確保し固定1時間や自動補完を加えない。
        勤務短縮・休憩追加・非勤務化・削除で未来/未終了の既指名予約（予定終了超過の診療中を含む）を
        不適格にする場合は409 protected_bookings。自動取消/指名解除/診療終了はしない。
        過去完了だけで永久拒否せず、予約・カルテ・会計履歴を自動改変しない。
        operation_keyはUUID。選択医院・認証actor・intent・対象・業務内容へ拘束する。
        期待版はfingerprintと分離しwrite直前に再検査、成功receipt再返却時も現在認可を再検査する。
        同じkey/同じ業務内容の確定済み操作は元receiptを返し重複効果を作らない。
        同keyで対象/業務内容が異なれば409 operation_key_reused。未成功確定後の期待版変更は現値との比較・明示再確認が必要。
        結果応答喪失や5xxはunknownとして同じkeyの結果照会を行う。照合不能中は入力保持して停止し、
        新keyで再送しない。競合解消・案変更後は最新状態の再確認から別操作を作る。
        この契約はleave/copy/CSV・予約編集・template改訂の契約を追加しない。
      tags: [Shifts]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            応答ShiftEntry.idと同じ先頭ゼロなし正数十進文字列。JS Numberへ変換せずpathへ渡す。
            serverは厳密に整数解析しPostgreSQL bigintの1..9223372036854775807を検査、範囲外/不正形式は400。
            桁数/辞書順だけで存在やscopeを判定しない。
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftMutationReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 競合または元情報未解決。業務変更なし。codeで理由を識別する。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftContractError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteShift
      summary: シフト削除
      x-contract-status: selected
      description: |
        shifts:deleteが必要。
        EMR-493選定wire契約。ownerはstaff。認証済み選択医院に拘束し、他医院へ自動再送しない。
        対象staffの所属/有効性、対象勤務の医院、現在grantをserverで検査する。
        勤務・休憩の原子的保存に加え、予約と他院勤務の並行変更を同じ整合性境界で再検査する。
        医院間の正の時間幅の重複は409。移動時間は手動確保し固定1時間や自動補完を加えない。
        勤務短縮・休憩追加・非勤務化・削除で未来/未終了の既指名予約（予定終了超過の診療中を含む）を
        不適格にする場合は409 protected_bookings。自動取消/指名解除/診療終了はしない。
        過去完了だけで永久拒否せず、予約・カルテ・会計履歴を自動改変しない。
        operation_keyはUUID。選択医院・認証actor・intent・対象・業務内容へ拘束する。
        期待版はfingerprintと分離しwrite直前に再検査、成功receipt再返却時も現在認可を再検査する。
        同じkey/同じ業務内容の確定済み操作は元receiptを返し重複効果を作らない。
        同keyで対象/業務内容が異なれば409 operation_key_reused。未成功確定後の期待版変更は現値との比較・明示再確認が必要。
        結果応答喪失や5xxはunknownとして同じkeyの結果照会を行う。照合不能中は入力保持して停止し、
        新keyで再送しない。競合解消・案変更後は最新状態の再確認から別操作を作る。
        この契約はleave/copy/CSV・予約編集・template改訂の契約を追加しない。
      tags: [Shifts]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            応答ShiftEntry.idと同じ先頭ゼロなし正数十進文字列。JS Numberへ変換せずpathへ渡す。
            serverは厳密に整数解析しPostgreSQL bigintの1..9223372036854775807を検査、範囲外/不正形式は400。
            桁数/辞書順だけで存在やscopeを判定しない。
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: expected_version
          in: query
          required: true
          description: 表示時の勤務aggregate版。休憩変更を含め不一致なら409。
          schema: { type: integer, format: int64, minimum: 1 }
        - name: operation_key
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 削除確定receipt（再送時も同じ結果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftMutationReceipt'
        '400':
