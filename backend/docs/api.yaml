        '200':
          description: revert 成功（または同一 payload の冪等 replay）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabImportRevertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
