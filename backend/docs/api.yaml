          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiffLinkAccountRequest'
      responses:
        '204':
          description: 紐付け成功。レスポンスボディなし。
