  /manual/articles/{category}/{slug}/edit:
    get:
      operationId: getManualArticleEditView
      summary: 既存記事の編集元とCAS版の取得
      x-contract-status: selected
      description: |
        EMR-502。manual-edit:editが必要。現在権限を検査し、医院共通の対象のcurrentとCAS版を返す。
        公開版readの内容で未公開currentを上書きしない。元内容未解決なら編集送信を停止する。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string, enum: [screens, workflows] }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 編集元の状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualArticleEditView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /manual/articles/{category}/{slug}/operations/{operation_key}:
    get:
      operationId: getManualEditOperationResult
      summary: 既存記事編集の結果照会
      x-contract-status: selected
      description: |
        EMR-502。manual-edit:editの現在権限、元の選択医院・認証actor・intent=edit・記事対象へ拘束する。
        200 succeededは元の確定receipt、200 unknownは照合不能（未実行・失敗とは断定しない）。
        後続編集・非表示で現在状態が変わっても元receiptを返す。照会は新しい版や履歴を作らない。
        権限失効は403、結果store障害は500。別医院・別actorのreceiptを開示しない。
        unknown中は入力案を保持し新keyで再保存しない。照合成功後に現在状態を別取得して比較する。
      tags: [Manual]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string, enum: [screens, workflows] }
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: operation_key
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 確定receiptまたはunknown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualEditOperationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
