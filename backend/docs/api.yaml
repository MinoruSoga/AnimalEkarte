      type: object
      description: 健診フィールド定義の作成（EMR-225）。field_type=number のみ unit/min_value/max_value が意味を持つ。single_select/multi_select/checklist は options が1件以上必須、それ以外の型では options 不可。
      required: [name, field_type]
      properties:
        name:
          type: string
        field_type:
          type: string
          enum: [number, single_select, multi_select, boolean, checklist, text]
        unit:
          type: string
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: '#/components/schemas/CheckupFieldOption'
        sort_order:
          type: integer
    UpdateCheckupTypeFieldRequest:
      type: object
      description: 健診フィールド定義の部分更新。min_value/max_value を NULL に戻すには clear_min_value/clear_max_value を true にする。options は省略=維持、配列指定=上書き（非選択式への変更時は空配列で残存選択肢をクリア）。
      minProperties: 1
      properties:
        name:
          type: string
        field_type:
          type: string
          enum: [number, single_select, multi_select, boolean, checklist, text]
        unit:
          type: string
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: '#/components/schemas/CheckupFieldOption'
        sort_order:
          type: integer
        clear_min_value:
          type: boolean
        clear_max_value:
          type: boolean
