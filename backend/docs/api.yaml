            省略時は従来どおり予約可能な枠のみ返す。
          schema:
            type: boolean
      responses:
        '200':
          description: 予約可能時間枠一覧（空き状況 status/remaining 付き。満員枠は include_unavailable=true のときのみ含まれる）
          content:
            application/json:
              schema:
                type: array
