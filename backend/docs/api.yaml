    get:
      operationId: getPetIdentityGroup
      summary: ペット identity group 取得
      tags: [IdentityLinks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: group }
        '404': { $ref: '#/components/responses/NotFound' }
  /identity-links/pet-groups/{id}/members:
    post:
      operationId: addPetIdentityMembers
      summary: ペット identity group にメンバー追加
      description: |
        mixed / cross-clinic / hidden pet ids は全体 reject（部分書き込みなし）。
        親 owner group 所属外のペットは 409。audit は同一 tx で fail-closed（PHI なし）。
      tags: [IdentityLinks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [clinic_id, pet_id]
                    properties:
                      clinic_id: { type: integer, format: int64 }
                      pet_id: { type: integer, format: int64 }
      responses:
        '200': { description: 更新後 group }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unlinkPetIdentityMember
      summary: ペット identity member を unlink（last-member で group soft-delete）
      tags: [IdentityLinks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinic_id, pet_id]
              properties:
                clinic_id: { type: integer, format: int64 }
                pet_id: { type: integer, format: int64 }
      responses:
        '204': { description: unlinked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /identity-links/pets/{clinic_id}/{pet_id}/treatment-history:
    get:
      operationId: listLinkedTreatmentHistory
      summary: 最小治療履歴（include_linked 時は相関 (clinic_id,pet_id) ペアのみ）
      tags: [IdentityLinks]
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: pet_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: include_linked
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: ページネーション付き履歴 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
