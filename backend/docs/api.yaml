      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-UAT-Cleanup-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 回収成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
