    Hospitalization:
      description: 全体は旧stay DTO記録。461のケージfieldはoperationの専用requestBody schemaを参照し、499 coreの状態公開契約と混同しない。入院IDとその子route/関連応答の参照は正数十進文字列の先行wire契約で、既存runtimeの数値JSON応答適合は499および各関連ownerへ別途引渡す。
      type: object
      required: [owner_id, pet_id, hospitalization_type, start_date, end_date]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          readOnly: true
        clinic_id:
          type: integer
          format: int64
          readOnly: true
        owner_id:
          type: integer
          format: int64
        pet_id:
          type: integer
          format: int64
        hospitalization_type:
          type: string
          enum:
            - hospitalization
            - hotel
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        next_visit:
          type: string
          format: date
          nullable: true
          description: 次回予定日（YYYY-MM-DD）。CREATE/PATCHで省略は変更なし、PATCHでclear_next_visit=trueを送るとNULLに戻す。空文字・不正日付・RFC3339等は400。
        clear_next_visit:
          type: boolean
          writeOnly: true
          description: PATCHでtrueを送るとnext_visitをNULLに戻す。trueとnext_visit設定の同時指定は400。
        status:
          type: string
          enum:
            - admitted
            - discharged
            - reserved
        cage_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          nullable: true
          description: 応答NULLは未割当。create未指定/NULLは未割当。PATCHは未指定=維持、NULL=400、正数=割当（期待値必須）。解除はclear_cage_id=true。
        clear_cage_id:
          type: boolean
          writeOnly: true
          description: PATCHでtrueを送るとcage_idをNULL（未割当）に戻す。cage_idとの同時指定は400。cage_idまたはclear_cage_idを送る場合はexpected_cage_id（正数）またはexpected_cage_is_null=trueのどちらか一方が必須。
        expected_cage_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          writeOnly: true
          description: 表示時点のcage_id。cage_id/clear_cage_id指定時にexpected_cage_is_nullと排他で必須（正数のみ）。ロック行と不一致なら409。ケージ操作を伴わない指定は400。
        expected_cage_is_null:
          type: boolean
          writeOnly: true
          description: 表示時点でcage_idが未割当だったことを示す期待値。cage_id/clear_cage_id指定時にexpected_cage_idと排他でtrueのみ必須。ロック行が未割当でないなら409。ケージ操作を伴わない指定は400。
        doctor_id:
          type: integer
          format: int64
          nullable: true
        memo:
          type: string
        owner_request:
          type: string
        staff_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 削除日時（ソフトデリート）
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          description: 飼主情報（Preload時のみ含まれる）
          nullable: true
        pet:
          $ref: '#/components/schemas/PetSummary'
