        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ─── サポートウィジェット: バグ報告 + ヘルプチャット ────────────────────
  /support/chat:
    post:
      operationId: postSupportChat
      summary: ヘルプチャット(マニュアル抜粋を根拠に LLM が回答)
      description: |
        認証済みスタッフ全員が利用可能（権限ゲートなし）。新プロトコルは記事
        ID + 実効コーパス revision のみを送り、本文はサーバーが権限評価済みの
        正本コーパスから再解決して LLM の根拠にする（クライアント送信の記事
        本文/title/text は一切信頼しない）。レガシー context プロトコルは
        SUPPORT_HYBRID_SEARCH_ENABLED=false のみ受理し、ID だけを使う
        （送信された title/text は無視）。hybrid 有効時は context フィールドが
        存在するだけで 409。
        SUPPORT_LLM_API_KEY 未設定の環境では 501 を返す(フロントエンドは status で検出し検索 UI へフォールバック)。
        LLM 呼び出しコスト抑制のため IP 単位でレート制限あり。
        会話履歴はクライアント送信値を信頼せず、サーバー保存済みの履歴を使用する。
        また外部 LLM へ送る入力はサーバー側でスクリーニングし、メールアドレス・
        電話番号・長い数字列・認証情報らしき内容を含む場合は 400 で拒否する
        (best-effort の分類 — 検出を保証するものではない)。
      tags: [Support]
      requestBody:
        required: true
        description: |
          oneOf で新プロトコル(SupportChatRequest)かレガシー(LegacySupportChatRequest)を指定。
          body は 32KiB 上限（超過 413）。複数 JSON 値の連結は 400、末尾の空白は受理される。
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SupportChatRequest'
                - $ref: '#/components/schemas/LegacySupportChatRequest'
      responses:
        '200':
          description: 回答 + 参照記事
          content:
            application/json:
              schema:
                type: object
                required: [reply, sources, retrieval]
                properties:
                  reply: { type: string }
                  sources:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        category: { type: string }
                        slug: { type: string }
                  retrieval:
                    type: object
                    required: [mode, reason, manual_revision]
                    properties:
                      mode: { type: string, enum: [hybrid, keyword, none] }
                      reason: { type: string, enum: [ok, disabled, index_missing, embedding_unavailable, capacity, no_evidence] }
                      manual_revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict', description: manual_revision 不一致（1 回再取得・再送）または hybrid 有効時の context プロトコル }
        '413': { description: body が 32KiB 上限超過 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { description: LLM が未設定(SUPPORT_LLM_API_KEY なし) }
        '502': { description: LLM 上流エラー(プロバイダ詳細は返さない) }
        '503': { description: manualSearch 依存（corpus/権限/quota）未設定または DB 失敗 }
        '504': { description: 生成デッドライン超過（親 22s）。検索 2s 超過は keyword fallback、corpus 依存失敗は 503 }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/chat/exchanges:
    get:
      operationId: listSupportChatExchanges
      summary: ヘルプチャットの質問+回答ペア一覧(全医院共有・新しい順)
      description: |
        認証済みスタッフ全員が利用可能（権限ゲート・医院絞りなし — バグ報告ボードと
        同じ共有ボード方針）。全医院の保存済み履歴を「質問+回答」ペアで返す。
        clinic_name / staff_name は絞り込みではなく provenance 表示用。
        質問内容に個人情報が含まれ得る点は製品判断として承認済み（2026-10）。
        直近最大500ペア（user+assistant 各行最大1000件）を新しい順で返す。
      tags: [Support]
      responses:
        '200':
          description: 質問+回答ペア一覧(新しい順)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: 回答メッセージのID }
                        clinic_name: { type: string }
                        staff_name: { type: string }
                        question: { type: string }
                        answer: { type: string }
                        sources:
                          type: array
                          items:
                            type: object
                            properties:
                              title: { type: string }
                              category: { type: string }
                              slug: { type: string }
                        created_at: { type: string, description: 質問送信時刻 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/chat/rooms:
    get:
      operationId: listSupportChatRooms
      summary: ヘルプチャットの会話ルーム一覧(全医院共有・最終発言の新しい順)
      description: |
        認証済みスタッフ全員が利用可能（権限ゲート・医院絞りなし — exchanges と同じ
        共有ボード方針）。同一 clinic×staff の発言ストリームを、一定の無発言時間
        （30分）を区切りにした疑似会話ルーム単位で返す。ルーム境界は DB に
        永続化されない導出値であり、区切りはヒューリスティック。
        ルームは最終発言の新しい順、ルーム内の発言(turns)は古い順。
        id は "clinicID-staffID-先頭メッセージID" の導出キーで永続的でない。
      tags: [Support]
      responses:
        '200':
          description: 疑似会話ルーム一覧(最終発言の新しい順)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "導出キー clinicID-staffID-先頭メッセージID" }
                        clinic_name: { type: string }
                        staff_name: { type: string }
                        started_at: { type: string, format: date-time, description: ルーム先頭発言の時刻 }
                        last_message_at: { type: string, format: date-time, description: ルーム最終発言の時刻 }
                        turns:
                          type: array
                          description: ルーム内の発言(古い順)
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              role: { type: string, enum: [user, assistant] }
                              content: { type: string }
                              sources:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    title: { type: string }
                                    category: { type: string }
                                    slug: { type: string }
                              created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/chat/history:
    get:
      operationId: getSupportChatHistory
      summary: ヘルプチャットの会話履歴(自分のみ・古い順)
      description: |
        認証済みスタッフ全員が利用可能（権限ゲートなし）。JWT の clinic_id × user_id で
        スコープされ、選択clinic内の自分の履歴のみを返す。POST /support/chat では応答成功時に
        「質問+回答」のペアを support_chat_messages へ保存する（保存は best-effort で、
        保存失敗時も応答は返る）。ここで参照できるのは保存に成功したペアのみ。
        最大100件（新しい方から丸める）。
      tags: [Support]
      responses:
        '200':
          description: 会話履歴(古い順)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        role: { type: string, enum: [user, assistant] }
                        content: { type: string }
                        sources:
                          type: array
                          items:
                            type: object
                            properties:
                              title: { type: string }
                              category: { type: string }
                              slug: { type: string }
                        created_at: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteSupportChatHistory
      summary: ヘルプチャットの会話履歴をすべて削除(自分のみ)
      description: |
        認証済みスタッフ全員が利用可能（権限ゲートなし）。JWT の clinic_id × user_id で
        スコープされた自分の履歴を soft delete する。フロントエンドの「会話をリセット」
        から呼ばれる。
      tags: [Support]
      responses:
        '204': { description: 削除完了 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/chat/status:
    get:
      operationId: getSupportChatStatus
      summary: ヘルプチャットの有効/無効
      description: |
        認証済みスタッフ全員が利用可能。SUPPORT_LLM_API_KEY 設定の有無だけを返す
        機能フラグ(テナントデータを含まない)。enabled=false の場合フロントエンドは
        検索型ヘルプ UI を表示する。
      tags: [Support]
      responses:
        '200':
          description: 有効/無効フラグ
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /support/bug-reports:
    get:
      operationId: listSupportBugReports
      summary: 全医院のバグ報告一覧(新しい順)
      description: |
        認証済みスタッフ全員が利用可能(権限ゲート・医院絞りなし — バグ報告は
        全医院共有の製品フィードバック基盤として意図的に開放)。新しい順に
        最大200件。スクショは署名付き URL(15分 TTL)で返す。
      tags: [Support]
      responses:
        '200':
          description: バグ報告一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportBugReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSupportBugReport
      summary: バグ報告を作成(スクショ任意添付)
      description: |
        認証済みスタッフ全員が利用可能。multipart/form-data で件名・詳細・画面文脈
        (page_url/route_path/user_agent/viewport/app_version)と任意 file "screenshot"
        (PNG/JPEG/WebP)を受け付ける。全体 8MiB 上限。保存成功後に Plane 連携が
        設定済みなら best-effort でワークアイテムを自動起票する。上流エラー時は
        plane_sync_error への記録を試みる(応答には sanitize 済み理由を含む)。
        起票結果・失敗理由の DB 書き込み自体の失敗は best-effort のログのみで、
        行が未リンク/理由未記録のまま残りうる。いずれの場合も作成自体は 201 で
        成功し、連携未設定ならローカル保存のみで同期エラーは付かない。
        手動起票・再送は POST /support/bug-reports/{id}/plane-ticket。
      tags: [Support]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                detail: { type: string }
                page_url: { type: string }
                route_path: { type: string }
                user_agent: { type: string }
                viewport: { type: string }
                app_version: { type: string }
                screenshot: { type: string, format: binary }
      responses:
        '201':
          description: 作成されたバグ報告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBugReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/bug-reports/{id}/status:
    patch:
      operationId: updateSupportBugReportStatus
      summary: バグ報告の対応状況を更新
      description: 操作は報告元医院スコープ(他医院の報告は共有ボードで閲覧のみ、対象指定は404)。status は open/resolved。
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, resolved] }
      responses:
        '200':
          description: 更新後のバグ報告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBugReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/bug-reports/{id}/plane-ticket:
    post:
      operationId: createSupportBugReportPlaneTicket
      summary: バグ報告を Plane ワークアイテムとして起票(手動再送を兼ねる)
      description: |
        操作は報告元医院スコープ(他医院の報告は共有ボードで閲覧のみ、対象指定は404)。
        報告作成時に Plane 連携が設定済みなら自動起票を試行済みであり、
        この明示操作は未起票・起票失敗時の手動起票・再送に使う。既に起票済み
        (plane_issue_id あり)なら
        現在の状態をそのまま返す冪等操作。external_source+external_id で報告と
        Plane 側を対応付ける。PLANE_API_KEY 未設定の環境では 501。Plane 側エラーは
        502 で返し、失敗理由は plane_sync_error に記録される。
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 起票済み・起票されたバグ報告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBugReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { description: Plane 連携が未設定(PLANE_API_KEY なし) }
        '502': { description: Plane 上流エラー(詳細は返さず plane_sync_error に記録) }
        '500': { $ref: '#/components/responses/InternalError' }
  /support/bug-reports/{id}:
    delete:
      operationId: deleteSupportBugReport
      summary: バグ報告を削除(論理削除 + 添付スクショのオブジェクト削除)
      description: |
        操作は報告元医院スコープ(他医院の報告は共有ボードで閲覧のみ、対象指定は404)。
        deleted_at を設定する
        論理削除で、一覧・詳細からは除外される。添付スクリーンショットの
        オブジェクトは best-effort で削除する（失敗時は孤立オブジェクトが残るのみ）。
        削除しても Plane 側の既起票チケットは残る。
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 削除完了 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
