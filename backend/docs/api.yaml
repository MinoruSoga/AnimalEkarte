        ファイル上限 10MiB、リクエスト上限 11MiB。拡張子・MIME・実バイトの content sniff を検証する。
        共有の医院/スタッフアップロード枠をボディ解析前に確保する。
        同医院・uploadスタッフに紐づくキーを台帳へ予約してからstorage uploadし、完了証拠を記録して署名URLを返す。
        保存先は trimming-images/{clinic_id}/...。応答はオブジェクトキーと署名付き表示 URL（TTL 15 分）。
        upload・完了記録・署名の失敗時に原本を推測削除しない。pending/不明キーは保護する。
      tags: [Trimmings]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpeg, png, gif。10MiB 以下。
      responses:
        '201':
          description: アップロード成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrimmingImageUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /masters/trimming-courses/images:
    delete:
      operationId: deleteTrimmingCourseDraftImage
      summary: トリミング画像オブジェクト削除（未保存アップロードの掃除）
      description: |
        現在のselected clinicのmaster-trimming create/edit権限と、同医院・同uploadスタッフの台帳証拠が必要。
        upload完了・未送信・保存済み/過去履歴を含む全参照なしを同じキーlock下で再検査した作業コピーだけを破棄する。
        削除予約をcommitしてからstorageを削除する。storage失敗は予約を保持し、retryでも同じ適格性を再検査する。
        旧未登録・pending・送信済み（保存拒否/rollback/結果不明を含む）・由来不明の原本は削除しない。
        course/clinicalの画像付きJSONは他の入力検証より前に送信証拠を独立TXで確定する。
      tags: [Trimmings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: trimming-images/{clinic_id}/... のオブジェクトキー
      responses:
        '204':
          description: 証明済み未送信作業コピーの削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
