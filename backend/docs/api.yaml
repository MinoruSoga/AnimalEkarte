openapi: "3.0.3"
info:
  title: Animal Ekarte API
  description: |
    動物病院電子カルテシステム API (Implementation Synced v3.1.0)

    EMR-502 / EMR-493 / EMR-461 の x-contract-status: selected（461保存はx-cage-contract-status） は実装先行契約。runtime追従・実機受入は別工程。

    ## 認証
    主メカニズムは **HttpOnly Cookie** ベース。フロントエンドは axios `withCredentials: true` で
    Cookie を自動送信する。`Authorization: Bearer <jwt>` ヘッダはミドルウェアの後方互換
    フォールバックとしてサポートされる。

    | Cookie 名 | 内容 | 有効期限 | Path | 用途 |
    |----------|------|---------|------|------|
    | `access_token` | JWT (HS256) | 15分 | `/` | 全保護エンドポイントの認証 |
    | `refresh_token` | JWT (HS256, sub=refresh) | 7日 | `/api/v1/auth` | アクセストークン再発行・ログアウト |
    | `prev_clinic_id` | 医院ID数値 | 15分 | `/` | 医院切替の監査・履歴用 |
    | `auth_token` | (legacy) | — | `/` | 旧 Cookie 名。読み取りのみ後方互換 |

    本番環境では `Secure=true` + `SameSite=None`、開発環境では `Secure=false` + `SameSite=Lax`。

    ## ページネーション
    一覧エンドポイントは `page` / `limit` クエリパラメータでページネーション。
    レスポンスは `{ data: [], total: number, page: number, limit: number }` 形式。
  version: "3.1.0"
  contact:
    name: Animal Ekarte
servers:
  - url: http://localhost:8080/api/v1
    description: 開発環境
components:
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF 防止のため `XMLHttpRequest` を指定する。
      schema:
        type: string
        enum: [XMLHttpRequest]
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        主要な認証メカニズム。`POST /login` 成功時に Set-Cookie で発行される
        HttpOnly な JWT（MaxAge=15min）。middleware/auth.go は Cookie を優先して読み取り、
        Authorization ヘッダはフォールバック。
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        認証更新・ログアウト専用の HttpOnly な JWT（Path=/api/v1/auth、MaxAge=7days）。
        Token Rotation により毎回置換される。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        後方互換のフォールバック。Cookie が利用不可な環境（CLI クライアント等）向け。
  schemas:
    SupportChatRequest:
      type: object
      description: |
        EMR-410 新プロトコル。記事 ID + 実効コーパス revision のみ送信し、本文は
        サーバーが権限評価済みコーパスから再解決する（クライアント送信の title/text は一切信頼しない）。
      required: [message, manual_revision, keyword_candidates]
      # legacy context との oneOf 曖昧性を排除（context 存在時は新プロトコルではない）。
      not:
        required: [context]
      properties:
        message:
          type: string
          minLength: 1
          description: ユーザーの質問（UTF-8 で最大 2000 バイト。スクリーニングで機微情報検出時は 400）
        manual_revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: FE 側の実効コーパス SHA-256 hex。不一致は 409（FE は 1 回だけ再取得・再送、再び 409 なら再読込案内）
        keyword_candidates:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 記事 ID のみ（本文は送らない）。重複 (category,slug) は 400
          items:
            type: object
            required: [category, slug]
            properties:
              category:
                type: string
                enum: [screens, workflows]
              slug:
                type: string
                minLength: 1
                maxLength: 100
                pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$'
    LegacySupportChatRequest:
      type: object
      deprecated: true
      description: |
        レガシー context プロトコル。SUPPORT_HYBRID_SEARCH_ENABLED=false のみ受理
        （true の場合は context フィールドが存在するだけで 409）。title/text は
        無視され、サーバーは slug から現在コーパスを再解決する。
      required: [message, context]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        context:
          type: array
          maxItems: 6
          items:
            type: object
            required: [category, slug]
            properties:
              title: { type: string, maxLength: 200, description: "ignored（サーバーは使用しない）" }
              category: { type: string, enum: [screens, workflows] }
              slug: { type: string, maxLength: 100 }
              text: { type: string, maxLength: 6000, description: "ignored（サーバーは使用しない）" }
    # ─── Summary schemas (Preload用の軽量オブジェクト) ──────────────
    OwnerSummary:
      type: object
      description: |
        飼主サマリー（Preload時のみ含まれる）。BE-refactor.md Phase D-2: 全3消費者
        （PetSummary.owner / MedicalRecord.owner / Hospitalization.owner）が共有する
        toOwnerSummary() の実ワイヤ形（id・name のみ）に合わせた。旧 owner_name/phone は
        ワイヤに存在しない phantom フィールドだったため削除。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    AnimalSpeciesSummary:
      type: object
      description: 動物種サマリー
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PetSummary:
      type: object
      description: |
        ペットサマリー（Preload時のみ含まれる）。BE-refactor.md Phase D-2: 実ワイヤ形
        petSummaryResponse の共有base fields（7消費者: MedicalRecord/Hospitalization/
        Reservation/Trimming/Vaccination/Examination/Pet の pet フィールド）に合わせ、
        weight・status に加え #231 で breed を追加（トリミング一覧の犬種列向け。
        空文字は未設定）。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        pet_number:
          type: string
        weight:
          type: number
          format: double
          nullable: true
        status:
          type: string
          description: alive/deceased（死亡ペット判定向け。空の場合あり）
        breed:
          type: string
          description: "犬種等（#231: トリミング一覧の犬種列向け。空文字は未設定）"
        birth_date:
          type: string
          format: date
          nullable: true
          description: "EMR-301: 誕生月バッジ判定用（petSummaryResponse の omitempty additive）"
        deceased_at:
          type: string
          format: date-time
          nullable: true
          description: "死亡OR契約 sentinel（status=deceased または非null。omitempty additive）"
        animal_species:
          $ref: '#/components/schemas/AnimalSpeciesSummary'
          nullable: true
        owner:
          $ref: '#/components/schemas/OwnerSummary'
          nullable: true
    ReservationPetSummary:
      description: 受付・予約管理のスタッフ向けペットサマリー
      allOf:
        - $ref: '#/components/schemas/PetSummary'
        - type: object
          properties:
            danger_level:
              type: string
              enum: [low, medium, high]
              readOnly: true
              description: 受付での臨床安全表示に使用する危険度
            danger_reason:
              type: string
              maxLength: 500
              nullable: true
              readOnly: true
              description: 院内スタッフ向け危険理由。danger_level が high の場合は必須。
    StaffSummary:
      type: object
      description: スタッフサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CageSummary:
      type: object
      description: ケージサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ServiceTypeSummary:
      type: object
      description: サービス種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    VaccineSummary:
      type: object
      description: ワクチンサマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ExamTypeSummary:
      type: object
      description: 検査種別サマリー（Preload時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
          nullable: true
    BillingItem:
      type: object
      description: 会計明細項目
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/ItemCategory'
        name:
          type: string
        unit_price:
          type: integer
          format: int64
        quantity:
          type: number
          format: float
          description: 数量（小数点1桁まで許容）
        discount_rate:
          type: number
          format: double
        discount_amount:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
          readOnly: true
          description: 割引後金額（単価×数量−割引額、負値は0クランプ。レスポンス生成時に算出）
        tax_type:
          type: string
          enum: [included, excluded, exempt]
        tax_rate:
          type: number
          format: double
        tax_amount:
          type: integer
          format: int64
          readOnly: true
          description: 課税区分に応じて算出した税額
        is_insurance_applicable:
          type: boolean
          nullable: true
          description: 未設定の保存値は null のまま返す。false へ補完しない。
        source:
          type: string
          enum: [medical_record, hospitalization, manual, trimming]
        other_reason:
          type: string
          nullable: true
          maxLength: 500
          description: manual かつ category=other の明細理由。新規作成時はtrim後1〜500文字が必須。
        treatment_id:
          type: integer
          format: int64
          nullable: true
        medical_record_id:
          type: integer
          format: int64
          nullable: true
          description: 未請求候補など treatment 由来の親カルテID（DB列ではない仮想値）
        service_date:
          type: string
          format: date-time
          nullable: true
          description: 未請求候補の発生日（DB列ではない仮想値。EMR-246 当日/過去区分表示用）
        vaccination_id:
          type: integer
          format: int64
          nullable: true
          description: 予防接種イベント由来の明細に紐づく接種記録ID
        exam_id:
          type: integer
          format: int64
          nullable: true
          description: 検査イベント由来の明細に紐づく検査記録ID
        appointment_id:
          type: integer
          format: int64
          nullable: true
        trimming_course_id:
          type: integer
          format: int64
          nullable: true
        trimming_option_id:
          type: integer
          format: int64
          nullable: true
        merchandise_item_id:
          type: integer
          format: int64
          nullable: true
          description: 物販マスタ由来の明細に紐づく商品ID（#251 U2a-1／BUG-436）
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      description: 支払情報（会計精算時のみ含まれる）
      properties:
        id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
        tax_total:
          type: integer
          format: int64
        total_amount:
          type: integer
          format: int64
        insurance_name:
          type: string
        insurance_ratio:
          type: number
          format: double
        insurance_amount:
          type: integer
          format: int64
          description: 保険負担額（円、正の値）。billing_amount = total_amount − insurance_amount − discount_amount
        discount_amount:
          type: integer
          format: int64
        billing_amount:
          type: integer
          format: int64
        received_amount:
          type: integer
          format: int64
        change_amount:
          type: integer
          format: int64
        method:
          type: string
          enum: [cash, credit_card, electronic_money, bank_transfer]
          description: 支払方法
        paid_by:
          type: integer
          format: int64
          nullable: true
          description: 対応スタッフID
        paid_by_name:
          type: string
          readOnly: true
          description: 対応スタッフ名（Preload時のみ埋まる。未設定時は空文字）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentSplit:
      type: object
      description: 1会計に対する支払い手段ごとの内訳（混在会計では複数存在）
      properties:
        id:
          type: integer
          format: int64
        clinic_id:
          type: integer
          format: int64
        billing_id:
          type: integer
          format: int64
        method:
          type: string
          enum: [cash, credit_card, electronic_money, bank_transfer]
          description: 支払方法（内訳ごとの一次情報）
        payment_method_id:
          type: integer
          format: int64
          nullable: true
        amount:
          type: integer
          format: int64
        received_amount:
          type: integer
          format: int64
        change_amount:
          type: integer
          format: int64
        paid_by:
          type: integer
          format: int64
          nullable: true
          description: 対応スタッフID
        paid_by_name:
          type: string
          readOnly: true
          description: 対応スタッフ名（Preload時のみ埋まる。未設定時は空文字）
        created_at:
          type: string
          format: date-time
    # ─────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: エラーメッセージ
          example: "resource not found"
    PaginatedResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
    CreateOwnerPetRequest:
      type: object
      required: [name, animal_species_id]
      properties:
        name:
          type: string
        animal_species_id:
          type: integer
          format: int64
        name_kana:
          type: string
        breed:
          type: string
        color:
          type: string
        blood_type:
          type: string
          maxLength: 32
          nullable: true
        microchip_number:
          type: string
          maxLength: 64
          nullable: true
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        neutered_status:
          type: string
          enum: [unknown, not_done, done]
        acquisition_type:
          type: string
          enum: [purchased, transferred, rescued, other]
          nullable: true
        danger_level:
          type: string
          enum: [low, medium, high]
        danger_reason:
          type: string
          maxLength: 500
          nullable: true
          description: danger_level が high の場合は trim 後1文字以上必須
        food:
          type: string
        environment:
          type: string
        insurance_id:
          type: integer
          format: int64
          nullable: true
        remarks:
          type: string
        name_origin:
          type: string
          maxLength: 500
          nullable: true
          description: 名前の由来（任意記録。空文字・省略は NULL=未記録）
        meeting_story:
          type: string
          maxLength: 2000
          nullable: true
          description: 出逢いのストーリー（任意記録。空文字・省略は NULL=未記録）
    CreateOwnerRequest:
      type: object
      required: [owner_name]
      properties:
        clinic_id:
          type: integer
          format: int64
          nullable: true
        owner_name:
          type: string
        owner_name_kana:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        company:
          type: string
        postal_code:
          type: string
        address1:
          type: string
        address2:
          type: string
        home_postal_code:
          type: string
        home_address1:
          type: string
        home_address2:
          type: string
        phone:
          type: string
        company_phone:
          type: string
        email:
          type: string
          format: email
        remarks:
          type: string
        is_dangerous:
          type: boolean
        discount_rate:
          type: number
          format: double
        membership_type:
          type: string
          enum: [non_member, member, deceased, transferred]
        dm_preference:
          type: boolean
          nullable: true
        pets:
          type: array
          items:
            $ref: '#/components/schemas/CreateOwnerPetRequest'
    Owner:
      type: object
      required: [owner_name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        owner_name:
          type: string
          description: 飼主名（必須）
        owner_name_kana:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        company:
          type: string
        postal_code:
          type: string
        address1:
          type: string
        address2:
          type: string
        home_postal_code:
          type: string
        home_address1:
          type: string
        home_address2:
          type: string
        phone:
          type: string
        company_phone:
          type: string
        email:
          type: string
          format: email
        remarks:
          type: string
        is_dangerous:
          type: boolean
          default: false
        discount_rate:
          type: number
          format: double
        membership_type:
          type: string
          enum:
            - non_member
            - member
            - deceased
            - transferred
        line_id_confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: FEAT-381。LINE ID 紐付け確認日時。
        line_id_confirmed_by:
          type: integer
          format: int64
          nullable: true
          description: FEAT-381。確認操作を行ったスタッフID。
        delivery_excluded:
          type: boolean
          default: false
          description: FEAT-381。配信除外フラグ。
        delivery_excluded_reason:
          type: string
          nullable: true
        delivery_caution:
          type: boolean
          default: false
          description: FEAT-381-2。配信注意フラグ。
        delivery_caution_reason:
          type: string
          nullable: true
        is_transferred:
          type: boolean
          default: false
          description: FEAT-381。転院フラグ。
        transfer_at:
          type: string
          format: date-time
          nullable: true
        dm_preference:
          type: boolean
          nullable: true
          description: '#158 レガシーEMR準拠。DM送付希望。'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        clinic_id:
          type: integer
          description: 医院ID
        pets:
          type: array
          description: |
            ペット一覧（Preload時のみ含まれる）。BE-refactor.md Phase D-2: 実ワイヤは
            petInOwnerResponse であり、GET /pets/{id} が返す完全な Pet とは異なる形
            (owner フィールドが無い等)のため専用スキーマ OwnerPetSummary を参照する。
          items:
            $ref: '#/components/schemas/OwnerPetSummary'
    # ─── Owner.pets の実ワイヤ形(Phase D-2) ──────────────────────────────
    OwnerPetSummary:
      type: object
      description: Owner.pets 配下でのみ使用される petInOwnerResponse の実ワイヤ形。
      properties:
        id:
          type: integer
          format: int64
        owner_id:
          type: integer
          format: int64
        animal_species_id:
          type: integer
          format: int64
        pet_number:
          type: string
        name:
          type: string
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        status:
          type: string
          enum: [alive, deceased]
        birth_date:
          type: string
          format: date
          nullable: true
        breed:
          type: string
        color:
          type: string
        blood_type:
          type: string
          nullable: true
        microchip_number:
          type: string
          nullable: true
        danger_level:
          type: string
          enum: [low, medium, high]
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        neutered_status:
          type: string
          enum: [unknown, not_done, done]
        acquisition_type:
          type: string
          enum: [purchased, transferred, rescued, other]
          nullable: true
        food:
          type: string
        environment:
          type: string
        last_visit:
          type: string
          format: date
          nullable: true
        insurance_id:
          type: integer
          format: int64
          nullable: true
        remarks:
          type: string
        name_origin:
          type: string
          maxLength: 500
          nullable: true
          readOnly: true
          description: 名前の由来（任意記録）
        meeting_story:
          type: string
          maxLength: 2000
          nullable: true
          readOnly: true
          description: 出逢いのストーリー（任意記録）
        deceased_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        animal_species:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              format: int64
