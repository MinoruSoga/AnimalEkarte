      summary: 次回予定（tentative）を本予約へ確定
      description: |
        EMR-308。tentative ステータスの予約のみ確定できる（他ステータスは 409）。
        確定後は通常予約と同じ挙動になり、予約枠容量・時間枠競合の対象になる。
