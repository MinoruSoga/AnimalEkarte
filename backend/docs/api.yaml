    CompleteAccountingRequest:
      type: object
      description: >
        POST /accountings/complete の body（BUG-018）。
        合計金額は含めない — server が items から再計算する。
      required: [scheduled_date, items]
      properties:
        medical_record_id:
          type: integer
          format: int64
          nullable: true
        hospitalization_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          nullable: true
        owner_id:
          type: integer
          format: int64
          nullable: true
        pet_id:
          type: integer
          format: int64
          nullable: true
        expected_unbilled_revision:
          type: string
          maxLength: 128
          description: >
            EMR-196: GET /billing-items/unbilled-details が返した集約版 token。
            pet_id 指定時は必須（未指定・空値は 400）。complete tx 内で再集計した
            版と不一致なら 409 UNBILLED_ITEMS_CHANGED。冪等 digest には含めない。
        scheduled_date:
          type: string
          format: date-time
        memo:
          type: string
        has_insurance:
          type: boolean
        insurance_ratio:
          type: number
          format: double
          nullable: true
        insurance_name:
          type: string
          nullable: true
        insurance_amount:
          type: integer
          format: int64
          nullable: true
          description: >
            保険負担額（円）。正規契約は正の値で、server は
            billing_amount = total_amount − insurance_amount − discount_amount を再計算する。
            旧クライアント互換で負値も受け付けるが絶対値に正規化して保存する。
            has_insurance=false と非ゼロの併用は 400。
        discount_amount:
          type: integer
          format: int64
          nullable: true
          description: 非ゼロの場合 discount:edit 権限が必要。負値は 400
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompleteAccountingItemRequest'
        payment_splits:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PaymentSplit'
        post_close_reason:
          type: string
          nullable: true
          description: レジ締め後編集の理由。締め済み期間では必須
