openapi: "3.0.3"
info:
  title: Animal Ekarte API
  description: |
    動物病院電子カルテシステム API

    ## 認証
    全エンドポイント（`/auth/login` を除く）は `Authorization: Bearer <JWT>` ヘッダーが必要。

    ## ページネーション
    一覧エンドポイントは `page` / `limit` クエリパラメータでページネーション。
    レスポンスは `{ data: [], total: number, page: number, limit: number }` 形式。
  version: "2.0.0"
  contact:
    name: Animal Ekarte
servers:
  - url: http://localhost:8080/api/v1
    description: 開発環境
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "resource not found"
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    Owner:
      type: object
      required: [owner_name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        owner_name:
          type: string
          description: 飼主名（必須）
        owner_name_kana:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        company:
          type: string
        postal_code:
          type: string
        address1:
          type: string
        address2:
          type: string
        home_postal_code:
          type: string
        home_address1:
          type: string
        home_address2:
          type: string
        phone:
          type: string
        company_phone:
          type: string
        email:
          type: string
          format: email
        remarks:
          type: string
        is_dangerous:
          type: boolean
          default: false
        discount_rate:
          type: number
          format: double
        membership_type:
          type: string
          enum: ["非会員", "会員", "退亡者", "他診/準"]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Pet:
      type: object
      required: [owner_id, name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        animal_species_id:
          type: string
          format: uuid
        pet_number:
          type: string
          description: カルテ番号
        name:
          type: string
          description: ペット名（必須）
        pet_name_kana:
          type: string
        gender:
          type: string
          enum: ["雄", "雌", "不明"]
        status:
          type: string
          enum: ["生存", "死亡"]
        birth_date:
          type: string
          format: date
          nullable: true
        breed:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
          nullable: true
        neutered_date:
          type: string
          format: date
          nullable: true
        acquisition_type:
          type: string
          enum: ["購入", "譲渡", "保護", "その他"]
          nullable: true
        danger_level:
          type: string
          enum: ["低", "中", "高"]
        food:
          type: string
        environment:
          type: string
        phone:
          type: string
        last_visit:
          type: string
          format: date
          nullable: true
        insurance_id:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ReservationAppointment:
      type: object
      required: [start_time, end_time, service_type_id]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
          description: 開始日時
        end_time:
          type: string
          format: date-time
          description: 終了日時
        owner_id:
          type: string
          format: uuid
          nullable: true
        pet_id:
          type: string
          format: uuid
          nullable: true
        visit_type:
          type: string
          enum: [first, revisit]
        service_type_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
          nullable: true
        is_designated:
          type: boolean
          default: false
        status:
          type: string
          enum: [confirmed, pending, cancelled, checked_in, in_consultation, accounting, completed]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    MedicalRecord:
      type: object
      required: [date, record_no]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        record_no:
          type: string
          description: カルテ番号（自動採番）
        date:
          type: string
          format: date
          description: 診察日
        owner_id:
          type: string
          format: uuid
          nullable: true
        pet_id:
          type: string
          format: uuid
          nullable: true
        doctor_id:
          type: string
          format: uuid
          nullable: true
        reservation_appointment_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: ["作成中", "確定済"]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Hospitalization:
      type: object
      required: [owner_id, pet_id, hospitalization_type, start_date, end_date]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        pet_id:
          type: string
          format: uuid
        hospitalization_type:
          type: string
          enum: ["入院", "ホテル"]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: ["入院中", "退院済", "予約"]
        cage_id:
          type: string
          format: uuid
          nullable: true
        doctor_id:
          type: string
          format: uuid
          nullable: true
        memo:
          type: string
        owner_request:
          type: string
        staff_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Billing:
      type: object
      required: [scheduled_date]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        medical_record_id:
          type: string
          format: uuid
          nullable: true
        hospitalization_id:
          type: string
          format: uuid
          nullable: true
        owner_id:
          type: string
          format: uuid
          nullable: true
        pet_id:
          type: string
          format: uuid
          nullable: true
        subtotal:
          type: integer
        tax_total:
          type: integer
        total_amount:
          type: integer
        has_insurance:
          type: boolean
        status:
          type: string
          enum: [waiting, completed, cancelled, pending]
        scheduled_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
          nullable: true
        memo:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TrimmingRecord:
      type: object
      required: [date, staff_id, course_id]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        pet_id:
          type: string
          format: uuid
          nullable: true
        staff_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        weight:
          type: string
        status:
          type: string
          enum: ["完了", "予約", "進行中"]
        style_request:
          type: string
        bw:
          type: string
        bw_unit:
          type: string
          enum: [Kg, g]
        bt:
          type: string
        used_shampoo:
          type: string
        used_ribbon:
          type: string
        remarks:
          type: string
        style_image:
          type: string
        completed_image:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryItem:
      type: object
      required: [name, category, unit]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          enum: [medicine, consumable, food, other]
        quantity:
          type: integer
        unit:
          type: string
        min_stock_level:
          type: integer
        location:
          type: string
        expiry_date:
          type: string
          format: date
          nullable: true
        supplier:
          type: string
        last_restocked:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [sufficient, low, out_of_stock]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Staff:
      type: object
      required: [name, staff_role]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
          default: true
        staff_role:
          type: string
          enum: [veterinarian, nurse, trimmer, reception, manager]
        job_title_id:
          type: string
          format: uuid
          nullable: true
        license_number:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Cage:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        cage_type:
          type: string
          enum: [icu, dog, cat, general]
          nullable: true
        cage_size:
          type: string
          enum: [small, medium, large, xl]
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Medicine:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        dosage_form:
          type: string
          enum: [tablet, liquid, injection, topical, powder]
          nullable: true
        medicine_unit:
          type: string
          enum: [per_tablet, per_ml, per_dose, per_gram]
          nullable: true
        inventory_id:
          type: string
          format: uuid
          nullable: true
        default_quantity:
          type: integer
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Vaccine:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        species:
          type: string
          enum: [dog, cat, both]
          nullable: true
        interval:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Insurance:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
          default: true
        description:
          type: string
        coverage_rate:
          type: number
          format: double
          nullable: true
        contact_phone:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ServiceType:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
          default: true
        description:
          type: string
        color:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Consultation:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        time_condition:
          type: string
        duration:
          type: integer
          description: 所要時間（分）
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Procedure:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        duration:
          type: integer
          nullable: true
        anesthesia:
          type: string
          enum: [none, local, general]
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    HospitalizationPlan:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        body_size:
          type: string
          nullable: true
        billing_unit:
          type: string
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TrimmingCourse:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        target_size:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TrimmingOption:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        duration:
          type: integer
          nullable: true
        combinable:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ExaminationType:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    DiagnosisCategory:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
          default: true
        description:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    DiagnosisName:
      type: object
      required: [name, diagnosis_category_id]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
          default: true
        description:
          type: string
        diagnosis_category_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    CheckupType:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clinic_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        description:
          type: string
        interval:
          type: string
          description: 推奨間隔
          nullable: true
        target_age:
          type: string
          description: 対象年齢
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Clinic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        branch_name:
          type: string
        postal_code:
          type: string
        address:
          type: string
        phone_number:
          type: string
        fax_number:
          type: string
        registration_number:
          type: string
        director_name:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
        logo_url:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT トークン
        expires_at:
          type: integer
          description: Unix timestamp
        user_type:
          type: string
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        user_type:
          type: string
        job_title:
          type: string
          nullable: true
        main_clinic_id:
          type: string
          format: uuid
        clinics:
          type: array
          items:
            type: object
            properties:
              clinic_id:
                type: string
                format: uuid
              clinic_name:
                type: string
              branch_name:
                type: string
              is_main:
                type: boolean
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
security:
  - BearerAuth: []
paths:
  /auth/login:
    post:
      summary: ログイン
      description: メールアドレスとパスワードで認証してJWTトークンを返す
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
