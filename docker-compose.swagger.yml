# Swagger UI コンテナ（OpenAPI 仕様の可視化）
# 実行: docker compose -f docker-compose.swagger.yml up
# アクセス: http://localhost:8081

services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.8
    container_name: animal_ekarte_swagger_ui
    ports:
      - "8081:8080"
    environment:
      # contract 正本 backend/docs/api.yaml を直接表示する
      # （旧 docs/openapi.yaml は手動ミラーの二重管理でドリフトしたため削除済み）
      SWAGGER_JSON: /docs/api.yaml
      SWAGGER_JSON_URL: http://localhost:8080/api/swagger.json
      BASE_URL: /swagger
      URLS: |
        [
          {
            "url": "file:///docs/api.yaml",
            "name": "OpenAPI 3.0"
          }
        ]
    volumes:
      - ./backend/docs:/docs:ro

  # Redoc（別のドキュメント表示オプション）
  # アクセス: http://localhost:8082
  redoc:
    image: redocly/redoc:v2.5.3
    container_name: animal_ekarte_redoc
    ports:
      - "8082:80"
    environment:
      SPEC_URL: /docs/api.yaml
    volumes:
      # redocly/redoc は nginx ベースの静的配信イメージで、docker-run.sh の既定
      # entrypoint(location / が /usr/share/nginx/html を alias)が SPEC_URL を
      # 差し込んで配信する。/docs はそのエイリアス配下にマウントしないと 404 になる
      # ため、host の backend/docs/ を html ルート配下の docs/ にマウントする。
      - ./backend/docs:/usr/share/nginx/html/docs:ro
